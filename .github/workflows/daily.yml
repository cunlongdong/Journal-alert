name: journal-alert daily
on:
  schedule:
    - cron: "30 23 * * *" # 北京时间每日 07:30
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数（空=自动）"
        required: false
        default: ""
      sources:
        description: "数据源（空=原配置）"
        required: false
        default: ""
      no_push:
        description: "抓取并入队，但本次不推送"
        type: boolean
        default: false
      cards_only:
        description: "仅重建双语网页，不检索、不推送"
        type: boolean
        default: false
      titles_only:
        description: "仅补齐已有卡片的中文标题并更新网页，不抓取、不发送 Bark"
        type: boolean
        default: false
      abstracts_only:
        description: "只补指定 DOI 的真实摘要和翻译，不推送 Bark"
        type: boolean
        default: false
      abstract_dois:
        description: "摘要补全 DOI，英文逗号分隔；仅 abstracts_only 使用"
        required: false
        default: ""
      rebuild_only:
        description: "重建文献和日报，不入队、不发送通知"
        type: boolean
        default: false
      test_api:
        description: "只测试自部署模型"
        type: boolean
        default: false
      flush_only:
        description: "仅发送待处理的中文 Bark 论文，不检索"
        type: boolean
        default: false
      test_bark:
        description: "只发送一条 Bark 连接测试"
        type: boolean
        default: false
      delivery_status:
        description: "只显示队列、渠道送达及积压信息"
        type: boolean
        default: false
      backfill_only:
        description: "历史论文补译（不发送 Bark）"
        type: boolean
        default: false
      history_max:
        description: "本次历史补译最多处理几篇（默认3，最大15）"
        default: "3"
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: journal-alert
  cancel-in-progress: false
jobs:
  run:
    # Literature processing must never wait for the Pages deployment environment.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      JALERT_BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
      JALERT_BARK_ENABLED: ${{ vars.JALERT_BARK_ENABLED || 'true' }}
      JALERT_BARK_SERVER: ${{ vars.JALERT_BARK_SERVER || 'https://api.day.app' }}
      JALERT_BARK_BODY_BYTES: ${{ vars.JALERT_BARK_BODY_BYTES || '2400' }}
      JALERT_BARK_MAX_MESSAGES_RUN: ${{ vars.JALERT_BARK_MAX_MESSAGES_RUN || '5000' }}
      CUSTOM_AI_API_KEY: ${{ secrets.CUSTOM_AI_API_KEY }}
      CUSTOM_AI_BASE_URL: ${{ vars.CUSTOM_AI_BASE_URL }}
      CUSTOM_AI_MODEL: ${{ vars.CUSTOM_AI_MODEL }}
      JALERT_AI_PRIMARY: custom
      JALERT_AI_FALLBACK: none
      JALERT_AI_MAX_CALLS_DAY: ${{ vars.JALERT_AI_MAX_CALLS_DAY || '200' }}
      JALERT_AI_MAX_TOKENS: ${{ vars.JALERT_AI_MAX_TOKENS || '2200' }}
      JALERT_REPORT_SITE_URL: https://cunlongdong.github.io/Journal-alert/
      JALERT_MAILTO: ${{ vars.JALERT_MAILTO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Avoid silently ignoring selected modes; only one special operation per run.
      - name: Validate manual workflow options
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MODE_CARDS: ${{ inputs.cards_only }}
          MODE_TITLES: ${{ inputs.titles_only }}
          MODE_ABSTRACTS: ${{ inputs.abstracts_only }}
          MODE_REBUILD: ${{ inputs.rebuild_only }}
          MODE_API: ${{ inputs.test_api }}
          MODE_FLUSH: ${{ inputs.flush_only }}
          MODE_STATUS: ${{ inputs.delivery_status }}
          MODE_BARK: ${{ inputs.test_bark }}
          MODE_BACKFILL: ${{ inputs.backfill_only }}
          MODE_NO_PUSH: ${{ inputs.no_push }}
        shell: bash
        run: |
          set -eo pipefail
          selected=()
          [[ "$MODE_CARDS" == "true" ]] && selected+=(cards_only) || true
          [[ "$MODE_TITLES" == "true" ]] && selected+=(titles_only) || true
          [[ "$MODE_ABSTRACTS" == "true" ]] && selected+=(abstracts_only) || true
          [[ "$MODE_REBUILD" == "true" ]] && selected+=(rebuild_only) || true
          [[ "$MODE_API" == "true" ]] && selected+=(test_api) || true
          [[ "$MODE_FLUSH" == "true" ]] && selected+=(flush_only) || true
          [[ "$MODE_STATUS" == "true" ]] && selected+=(delivery_status) || true
          [[ "$MODE_BARK" == "true" ]] && selected+=(test_bark) || true
          [[ "$MODE_BACKFILL" == "true" ]] && selected+=(backfill_only) || true
          if (( ${#selected[@]} > 1 )); then
            echo "::error::请只勾选一个特殊模式。当前同时勾选：${selected[*]}"
            exit 2
          fi
          if (( ${#selected[@]} > 0 )) && [[ "$MODE_NO_PUSH" == "true" ]]; then
            echo "::error::no_push 只能单独使用（正常采集但不推送）。请取消其他特殊模式。"
            exit 2
          fi
          echo "本次操作：${selected[0]:-normal_daily_pipeline}"

      - name: Verify branch freshness before side effects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::This workflow uses a stale commit; cancel it and trigger main again."
            exit 1
          fi
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run literature and Chinese Bark history tasks
        env:
          EXTRA_DAYS: ${{ inputs.days }}
          EXTRA_SOURCES: ${{ inputs.sources }}
          EXTRA_NO_PUSH: ${{ inputs.no_push }}
          EXTRA_CARDS_ONLY: ${{ inputs.cards_only }}
          EXTRA_TITLES_ONLY: ${{ inputs.titles_only }}
          EXTRA_ABSTRACTS_ONLY: ${{ inputs.abstracts_only }}
          EXTRA_ABSTRACT_DOIS: ${{ inputs.abstract_dois }}
          EXTRA_REBUILD_ONLY: ${{ inputs.rebuild_only }}
          EXTRA_TEST_API: ${{ inputs.test_api }}
          EXTRA_FLUSH_ONLY: ${{ inputs.flush_only }}
          EXTRA_DELIVERY_STATUS: ${{ inputs.delivery_status }}
          EXTRA_TEST_BARK: ${{ inputs.test_bark }}
          EXTRA_BACKFILL_ONLY: ${{ inputs.backfill_only }}
          EXTRA_HISTORY_MAX: ${{ inputs.history_max }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EXTRA_TEST_API" == "true" ]]; then
            python tools/enhanced_run.py --test-api
          elif [[ "$EXTRA_TEST_BARK" == "true" ]]; then
            python tools/reliable_push.py --test-bark
          elif [[ "$EXTRA_DELIVERY_STATUS" == "true" ]]; then
            python tools/reliable_push.py --status
          elif [[ "$EXTRA_CARDS_ONLY" == "true" ]]; then
            python run.py --cards
          elif [[ "$EXTRA_TITLES_ONLY" == "true" ]]; then
            python run.py --cards
          elif [[ "$EXTRA_ABSTRACTS_ONLY" == "true" ]]; then
            if [[ -z "$EXTRA_ABSTRACT_DOIS" ]]; then
              echo "::error::abstracts_only requires comma-separated abstract_dois"
              exit 2
            fi
            python tools/history_backfill.py --max 15 --dois "$EXTRA_ABSTRACT_DOIS"
            python run.py --cards
          elif [[ "$EXTRA_BACKFILL_ONLY" == "true" ]]; then
            python tools/history_backfill.py --max "${EXTRA_HISTORY_MAX:-3}"
            python run.py --cards
          elif [[ "$EXTRA_REBUILD_ONLY" == "true" ]]; then
            # Rebuild from upstream without entering the notification queue.
            rebuild_args=(--once --no-push)
            if [[ -n "$EXTRA_DAYS" ]]; then rebuild_args+=(--days "$EXTRA_DAYS"); fi
            if [[ -n "$EXTRA_SOURCES" ]]; then rebuild_args+=(--sources "$EXTRA_SOURCES"); fi
            python run.py "${rebuild_args[@]}"
          elif [[ "$EXTRA_FLUSH_ONLY" == "true" ]]; then
            python tools/reliable_push.py --flush
          else
            args=(--once --no-push)
            if [[ -n "$EXTRA_DAYS" ]]; then args+=(--days "$EXTRA_DAYS"); fi
            if [[ -n "$EXTRA_SOURCES" ]]; then args+=(--sources "$EXTRA_SOURCES"); fi
            python tools/enhanced_run.py "${args[@]}"
            if [[ "$EXTRA_NO_PUSH" != "true" ]]; then
              python tools/reliable_push.py --flush
              # Historical backfill runs AFTER today's notifications; never re-pushes history.
              python tools/history_backfill.py --max 10
            fi
          fi
      - name: Fill missing Chinese card titles
        if: ${{ success() && !inputs.delivery_status && !inputs.test_api && !inputs.test_bark && !inputs.cards_only && !inputs.rebuild_only }}
        run: python tools/backfill_titles.py --max 80
      - name: Enrich bilingual card wall
        if: ${{ success() && !inputs.delivery_status && !inputs.test_api && !inputs.test_bark }}
        run: python tools/enrich_bilingual_cards.py
      - name: Bilingual completeness audit
        if: ${{ success() && !inputs.delivery_status && !inputs.test_api && !inputs.test_bark }}
        shell: bash
        run: |
          echo '### 中英文标题与摘要完整性（实际日报）' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python tools/audit_site_fullness.py >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit reports and safe resumable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage only public outputs, tolerating absent state after reset.
          for directory in reports docs; do
            if [[ -d "$directory" ]]; then
              git add -A -- "$directory"
            fi
          done
          for path in \
            state/seen.sqlite \
            state/enhanced_wechat_outbox.json \
            state/enhanced_zh_cache.json \
            state/dual_channel_delivery.json \
            state/full_english_abstracts.json \
            state/history_backfill_cursor.json; do
            if [[ -f "$path" ]]; then
              git add -- "$path"
            elif git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git rm --cached -f -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'Nothing changed'
          else
            git commit -m "chore(state): $(date +%F) Bark alerts and bilingual history"
            git push
          fi
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            state/daily/
          if-no-files-found: ignore
          retention-days: 30
      - name: Push backlog summary
        if: always()
        shell: bash
        run: |
          echo '### Bark 中文逐篇推送 / 待补译状态' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python tools/reliable_push.py --status >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        if: ${{ success() && !inputs.delivery_status && !inputs.test_api && !inputs.test_bark }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ success() && !inputs.delivery_status && !inputs.test_api && !inputs.test_bark }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy_pages:
    name: Deploy literature cards to GitHub Pages
    needs: run
    if: ${{ needs.run.result == 'success' && !inputs.delivery_status && !inputs.test_api && !inputs.test_bark }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
