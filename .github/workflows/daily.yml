name: journal-alert daily

# 07:30 Asia/Shanghai == 23:30 UTC (previous day).
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "覆盖时间窗（天）；留空使用自适应窗口"
        required: false
        default: ""
      sources:
        description: "指定数据源（例如 openalex,crossref）；留空使用配置"
        required: false
        default: ""
      no_push:
        description: "可选：不发微信；注意仍会把新论文记为已见"
        type: boolean
        required: false
        default: false
      cards_only:
        description: "只更新网页卡片，不检索论文、不发微信（清理旧日报后使用）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: journal-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      TZ: Asia/Shanghai
      JALERT_SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      JALERT_PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      JALERT_BARK_KEY: ${{ secrets.BARK_KEY }}
      JALERT_MAILTO: ${{ vars.JALERT_MAILTO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Environment self-check
        if: ${{ !inputs.cards_only }}
        continue-on-error: true
        run: python run.py --doctor

      - name: Run literature pipeline or rebuild cards
        env:
          EXTRA_DAYS: ${{ inputs.days }}
          EXTRA_SOURCES: ${{ inputs.sources }}
          EXTRA_NO_PUSH: ${{ inputs.no_push }}
          EXTRA_CARDS_ONLY: ${{ inputs.cards_only }}
        run: |
          set -eu
          if [ "${EXTRA_CARDS_ONLY}" = "true" ]; then
            python run.py --cards
          else
            ARGS="--once"
            if [ -n "${EXTRA_DAYS}" ]; then ARGS="$ARGS --days ${EXTRA_DAYS}"; fi
            if [ -n "${EXTRA_SOURCES}" ]; then ARGS="$ARGS --sources ${EXTRA_SOURCES}"; fi
            if [ "${EXTRA_NO_PUSH}" = "true" ]; then ARGS="$ARGS --no-push"; fi
            echo "python run.py ${ARGS}"
            python run.py ${ARGS}
          fi

      - name: Commit state and report back
        if: always()
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore(state): $(date +%F) daily run"
            git push
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: |
            logs/
            state/daily/
          if-no-files-found: ignore
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          report="reports/$(date +%F).md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次没有生成当天的新报告（仅重建卡片墙时属于正常情况）。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
