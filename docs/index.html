ll magnetoresistance (USMR) in a van der Waals antiferromagnet CrPS4 in contact with Pt, driven by the nonequilibrium magnon accumulation with a finite magnon chemical potential. In contrast to conventional magnonic USMR driven by magnetization fluctuations, this effect persists under strong magnetic fields and low temperatures. The magnitude of magnonic USMR in CrPS4/Pt exceeds that of YIG/Pt by more than 2 orders of magnitude and surpasses the electrical USMR in metallic Ta/Co bilayers by a factor of 2. Our results highlight magnon chemical potential gradients for nonlinear magnetoresistance in antiferromagnetic van der Waals heterostructures and open a route to magnon-based antiferromagnetic spintronic functionalities in two-terminal device geometries.","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":4,"enAbstractSource":"crossref","enAbstract":"Abstract Magnetoresistive effects are typically symmetric under magnetization reversal. However, nonlinear spin transport can give rise to unidirectional magnetoresistance in systems with strong spin–orbit interaction and broken inversion symmetry. Here, we report a large magnonic unidirectional spin Hall magnetoresistance (USMR) in a van der Waals antiferromagnet CrPS4 in contact with Pt, driven by the nonequilibrium magnon accumulation with a finite magnon chemical potential. In contrast to conventional magnonic USMR driven by magnetization fluctuations, this effect persists under strong magnetic fields and low temperatures. The magnitude of magnonic USMR in CrPS4/Pt exceeds that of YIG/Pt by more than 2 orders of magnitude and surpasses the electrical USMR in metallic Ta/Co bilayers by a factor of 2. Our results highlight magnon chemical potential gradients for nonlinear magnetoresistance in antiferromagnetic van der Waals heterostructures and open a route to magnon-based antiferromagnetic spintronic functionalities in two-terminal device geometries.","zhTitle":"由非平衡反铁磁磁振子驱动的单向磁阻","zhAbstract":"摘要 磁阻效应在磁化反转下通常是对称的。然而，在具有强自旋-轨道相互作用和反演对称性破缺的体系中，非线性自旋输运可以产生单向磁阻。在此，我们报道了在范德华反铁磁体CrPS4与Pt接触的体系中，由具有有限磁子化学势的非平衡磁子积累所驱动的大磁子单向自旋霍尔磁阻（USMR）。与由磁化涨落驱动的传统磁子USMR不同，该效应在强磁场和低温下仍然持续存在。CrPS4/Pt中磁子USMR的幅度超过YIG/Pt的幅度两个数量级以上，并且超过金属Ta/Co双层中电学USMR的幅度2倍。我们的结果突出了反铁磁范德华异质结构中用于非线性磁阻的磁子化学势梯度，并开辟了一条在两端器件几何结构中实现基于磁子的反铁磁自旋电子学功能的途径。"},{"title":"Sign crossover of magnetoresistance through magneto-optically tunable defect state spin injection process in organic magnetic tunnel junctions","url":"https://doi.org/10.1016/j.jmmm.2026.174563","doi":"10.1016/j.jmmm.2026.174563","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻","自旋流与自旋输运"],"matchTerm":"magnetic tunnel junctions","matchWhere":"标题：magnetic tunnel junctions、标题：spin injection","score":18,"authors":["Yadlapalli Sujatha","Debajit Deb","Pamulapati Soujanya","Nitish Ghosh","S Vamsee Krishna"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":5,"zhTitle":"有机磁性隧道结中通过磁光可调缺陷态自旋注入过程的磁阻符号交叉"},{"title":"Spin orbit torque manipulation of kπ-skyrmions in racetrack nanostructures for spintronic memory applications","url":"https://doi.org/10.1016/j.jmmm.2026.174602","doi":"10.1016/j.jmmm.2026.174602","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","自旋转移力矩与自旋电子存储"],"matchTerm":"spin-orbit torque","matchWhere":"标题：spin-orbit torque、标题：spintronic memory","score":18,"authors":["H. Vigo-Cotrina","Eduardo Saavedra","S. Urcia-Romero","S. Navarro-Vilca","J. Sifuentes-Rivera","A.P. Guimarães"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":6,"enAbstractSource":"OpenAlex","enAbstract":"k π -skyrmions are topological magnetic textures with promising applications in spintronic devices. In this work, we investigated the stability and current-driven dynamics of k π -skyrmions ( k = 1,2,3 , and 4) in racetrack nanostructures. Stability phase diagrams were constructed as a function of the interfacial Dzyaloshinskii–Moriya interaction strength ( D int ) and the perpendicular magnetic field ( B z ). Our results showed that the stabilization range of each k π -skyrmion strongly depends on D int . In addition, the diameters of all textures increased with increasing D int and decreased with increasing B z . The current-driven dynamics induced by spin–orbit torque were then investigated. Our results showed that the velocity of all k π -skyrmions increased with current density and decreased with perpendicular magnetic field. Although the 3 π -skyrmion exhibited larger longitudinal velocities during the transient regime than the π -skyrmion, both textures reached nearly identical steady-state velocities. A similar behavior was observed for the 2 π - and 4 π -skyrmions. The steady-state dynamics were further analyzed using the Thiele formalism, which reproduced the trends observed in the micromagnetic simulations. These findings provide insight into the stabilization and transport properties of k π -skyrmions and support their potential use in future spintronic applications.","zhTitle":"赛道纳米结构中kπ-斯格明子的自旋轨道矩操控及其在自旋电子存储器中的应用","zhAbstract":"kπ-斯格明子是在自旋电子器件中具有应用前景的拓扑磁结构。在本工作中，我们研究了跑道形纳米结构中kπ-斯格明子（k=1、2、3和4）的稳定性与电流驱动动力学。我们构建了稳定性相图，其作为界面Dzyaloshinskii–Moriya相互作用强度（D_int）和垂直磁场（B_z）的函数。我们的结果表明，每种kπ-斯格明子的稳定范围强烈依赖于D_int。此外，所有结构的直径均随D_int增大而增大，并随B_z增大而减小。随后研究了由自旋–轨道力矩诱导的电流驱动动力学。我们的结果表明，所有kπ-斯格明子的速度均随电流密度增大而增大，并随垂直磁场增大而减小。尽管3π-斯格明子在瞬态阶段表现出比π-斯格明子更大的纵向速度，但两种结构达到了几乎相同的稳态速度。对于2π-和4π-斯格明子也观察到了类似行为。我们进一步使用Thiele形式体系分析了稳态动力学，其结果再现了微磁模拟中观察到的趋势。这些发现为kπ-斯格明子的稳定化和输运性质提供了见解，并支持其在未来自旋电子应用中的潜在用途。"},{"title":"Current-control of chaos and effects of thermal fluctuations in magnetic tunnel junctions","url":"https://doi.org/10.1103/nny3-5mnz","doi":"10.1103/nny3-5mnz","journal":"Physical Review Applied","jabbr":"Physical Review Applied","pubdate":"2026-10-21","topic":"自旋转移力矩与自旋电子存储","topics":["自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","磁各向异性与界面磁性","手性磁结构与自旋动力学"],"matchTerm":"spin-transfer torque","matchWhere":"摘要：spin-transfer torque、标题：magnetic tunnel junctions、摘要：perpendicular magnetic anisotropy、摘要：ferromagnetic resonance","score":18,"authors":["Ryo Tatsumi","Shinji Miwa","Hiroaki Matsueda","Takahiro Chiba"],"authorMore":false,"abstract":"We theoretically investigate the chaotic behavior of spin-torque ferromagnetic resonance in magnetic tunnel junctions (MTJs) with perpendicular magnetic anisotropy under thermal fluctuations. By calculating the Lyapunov exponent based on the Landau–Lifshitz–Gilbert equation, we demonstrate that an MTJ characterized by a double-well potential, composed of uniaxial magnetic anisotropy and an external dc magnetic field, exhibits chaotic magnetization dynamics that can be controlled by means of the dc bias via spin-transfer torque. Furthermore, we find that thermal fluctuations help to induce these chaotic magnetization dynamics, which can be regarded as noise-induced chaos. This research provides a basis for brain-inspired computing using spintronic devices and advances the understanding of the interplay between thermal fluctuations and chaos in magnetization dynamics.","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":7,"enAbstractSource":"crossref","enAbstract":"We theoretically investigate the chaotic behavior of spin-torque ferromagnetic resonance in magnetic tunnel junctions (MTJs) with perpendicular magnetic anisotropy under thermal fluctuations. By calculating the Lyapunov exponent based on the Landau–Lifshitz–Gilbert equation, we demonstrate that an MTJ characterized by a double-well potential, composed of uniaxial magnetic anisotropy and an external dc magnetic field, exhibits chaotic magnetization dynamics that can be controlled by means of the dc bias via spin-transfer torque. Furthermore, we find that thermal fluctuations help to induce these chaotic magnetization dynamics, which can be regarded as noise-induced chaos. This research provides a basis for brain-inspired computing using spintronic devices and advances the understanding of the interplay between thermal fluctuations and chaos in magnetization dynamics.","zhTitle":"磁隧道结中混沌的电流控制及热涨落效应","zhAbstract":"我们从理论上研究了热涨落下具有垂直磁各向异性的磁隧道结（MTJ）中自旋力矩铁磁共振的混沌行为。通过基于Landau–Lifshitz–Gilbert方程计算Lyapunov指数，我们证明：由单轴磁各向异性和外部直流磁场构成的双势阱MTJ表现出混沌磁化动力学，该动力学可通过自旋转移力矩经由直流偏置进行控制。此外，我们发现热涨落有助于诱导这些混沌磁化动力学，其可被视为噪声诱导的混沌。本研究为利用自旋电子器件进行类脑计算提供了基础，并增进了对磁化动力学中热涨落与混沌之间相互作用的理解。"},{"title":"Spin Hall effect in electronic Lévy glasses: Enhanced spin-current generation in the superdiffusive regime","url":"https://doi.org/10.1103/tn92-kx55","doi":"10.1103/tn92-kx55","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-21","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","自旋流与自旋输运"],"matchTerm":"spin Hall effect","matchWhere":"标题：spin Hall effect、标题：spin current","score":18,"authors":["Diego B. Fonseca","Luiz Felipe C. Pereira","Anderson L. R. Barbosa"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-22","tkey":"other","id":8,"zhTitle":"电子Lévy玻璃中的自旋霍尔效应：超扩散区中增强的自旋流产生"},{"title":"Magnetocaloric effect in one-dimensional chain spin-flop antiferromagnetic Brannerite MnV2O6","url":"https://doi.org/10.1016/j.jmmm.2026.174675","doi":"10.1016/j.jmmm.2026.174675","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-12-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["L. Gowsalya","N. Lakshminarasimhan"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":9,"zhTitle":"一维链自旋翻转反铁磁褐钇铌矿型MnV2O6中的磁热效应"},{"title":"Strain-induced enhanced room-temperature magnetization in epitaxial Mn3Sn thin films for antiferromagnetic spintronics","url":"https://doi.org/10.1016/j.jallcom.2026.191741","doi":"10.1016/j.jallcom.2026.191741","journal":"Journal of Alloys and Compounds","jabbr":"Journal of Alloys and Compounds","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Subhankar Das","Sriram Kasilingam","Ajoy Dinda","Bilal Jamshed","Biswanath Pramanik","Subrata Biswas","Badsha Sekh","Hasibur Rahaman","Lalit Katariya","Ramu Maddu","Ahin Roy","S.N. Piramanayagam"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":10,"zhTitle":"应变诱导的外延Mn3Sn薄膜中室温磁化增强及其在反铁磁自旋电子学中的应用"},{"title":"Antiphase boundary-driven large exchange bias and negative magnetoresistance in NiCo2O4","url":"https://doi.org/10.1016/j.jmmm.2026.174575","doi":"10.1016/j.jmmm.2026.174575","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange bias","matchWhere":"标题：exchange bias","score":12,"authors":["Biswanath Pramanik","Pushpesh Pathak","Binoy K. Hazra"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":11,"zhTitle":"反相畴界驱动的NiCo2O4大交换偏置与负磁阻","enAbstractSource":"custom","enAbstract":"Nickel-based spinel oxide has recently attracted significant attention due to its remarkable magneto-transport properties, promising various spintronic applications. In this study, we observe an exchange bias effect, where the magnetic hysteresis loop shifts both horizontally and vertically when single-phase nanocrystalline NiCo2O4 is cooled in the presence of an external magnetic field. The magnitude of the exchange bias field is approximately 375 Oe at 5 K, and this effect disappears around 300 K. Furthermore, NiCo2O4 shows semiconducting behaviour in longitudinal resistivity and demonstrates a substantial negative magnetoresistance of ~31.5% at 10 K. The magnetoresistance exhibits a butterfly-shaped behaviour at low magnetic fields and becomes almost linear at high magnetic fields. A detailed analysis of the negative magnetoresistance and exchange bias reveals that both phenomena originate from the formation of antiphase boundaries in the as-synthesized NiCo2O4 sample, as confirmed by the high-resolution transmission electron micrograph.","zhAbstract":"英文论文标题：反相边界驱动的NiCo2O4大交换偏置与负磁阻 英文摘要：镍基尖晶石氧化物近期因其显著的磁输运性质而备受关注，有望用于各种自旋电子学应用。在本研究中，我们观察到一种交换偏置效应：当单相纳米晶NiCo2O4在外加磁场存在下冷却时，其磁滞回线同时发生水平和垂直位移。在5 K时，交换偏置场的大小约为375 Oe，该效应在300 K左右消失。此外，NiCo2O4在纵向电阻率上表现出半导体行为，并在10 K时展现出约31.5%的显著负磁阻。该磁阻在低磁场下呈现蝴蝶形行为，在高磁场下则几乎变为线性。对负磁阻和交换偏置的详细分析表明，这两种现象均源于所合成NiCo2O4样品中反相边界的形成，这一点已由高分辨透射电子显微图证实。"},{"title":"Large coercivity and giant exchange bias in Eu₂NiIrO₆","url":"https://doi.org/10.1016/j.jmmm.2026.174650","doi":"10.1016/j.jmmm.2026.174650","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange bias","matchWhere":"标题：exchange bias","score":12,"authors":["T. Durga Rao","Manish K. Niranjan","K. Ramesh Kumar","G. Bhavani","B. Sattibabu","Thao T. Tran","Jyothinagaram Krishnamurthy"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":12,"zhTitle":"Eu₂NiIrO₆中的大矫顽力和巨交换偏置"},{"title":"Sector-resolved microcanonical entropy of the spin-1/2 Heisenberg antiferromagnet on the Sierpiński gasket","url":"https://doi.org/10.1016/j.jmmm.2026.174633","doi":"10.1016/j.jmmm.2026.174633","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["J. Ricardo de Sousa","Orion Ciftja"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":13,"zhTitle":"Sierpiński垫上自旋-1/2海森堡反铁磁体的扇区分辨微正则熵"},{"title":"Surface-enhanced anomalous Hall conductivity in ferrimagnetic Mn2PtSn Heusler alloy","url":"https://doi.org/10.1016/j.jmmm.2026.174616","doi":"10.1016/j.jmmm.2026.174616","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["Sadikul Alom","Bhargab Kakati","Munima B. Sahariah"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":14,"zhTitle":"亚铁磁Mn2PtSn Heusler合金中的表面增强反常霍尔电导率","enAbstractSource":"custom","enAbstract":"The anomalous Hall conductivity of the bulk ferrimagnetic Heusler alloy Mn 2 PtSn is calculated using density functional theory combined with maximally localized Wannier functions. The corresponding Berry curvature distributions are then computed, from which the net anomalous Hall conductivity is obtained. To enhance the anomalous Hall conductivity through symmetry reduction, three energetically stable (001) surface terminations of Mn 2 PtSn are considered, and their Berry curvature distributions are compared with those of the bulk unit cell. The increased number of Berry curvature peaks at the surface terminations leads to a higher value of the anomalous Hall conductivity. The anomalous Hall conductivity is also evaluated as a function of the Fermi level, and the presence of sharp peaks near the Fermi level indicates the potential for further enhancement through Fermi-level tuning. The high value of anomalous Hall conductivity at the surfaces highlights their potential for application in thin-film memory devices, where surface-driven properties are crucial. • Anomalous Hall conductivity (AHC) of bulk and (001) Mn 2 PtSn surfaces is calculated. • Surface-induced symmetry-breaking enhances the AHC. • The Pt full monolayer shows the enhanced Berry curvature and AHC due to strong spin–orbit interaction. • AHC peak near Fermi level suggests potential for further AHC enhancement via tuning.","zhAbstract":"采用密度泛函理论结合最大局域化Wannier函数，计算了块体亚铁磁Heusler合金Mn2PtSn的反常霍尔电导率。随后计算了相应的贝里曲率分布，并由此得到净反常霍尔电导率。为了通过对称性降低增强反常霍尔电导率，考虑了Mn2PtSn三种能量稳定的(001)表面终止，并将其贝里曲率分布与块体晶胞的贝里曲率分布进行了比较。表面终止处贝里曲率峰数量的增加导致反常霍尔电导率值更高。还评估了反常霍尔电导率作为费米能级的函数，费米能级附近尖锐峰的存在表明通过费米能级调谐实现进一步增强的潜力。表面处高值的反常霍尔电导率凸显了其在薄膜存储器件中的应用潜力，在这些器件中表面驱动的性质至关重要。• 计算了块体和(001) Mn2PtSn表面的反常霍尔电导率(AHC)。• 表面诱导的对称性破缺增强了AHC。• 由于强自旋-轨道相互作用，Pt完整单层显示出增强的贝里曲率和AHC。• 费米能级附近的AHC峰表明通过调谐进一步增强AHC的潜力。"},{"title":"Characterization of ferrimagnetic FeGd coatings formed by a magnetron sputtering","url":"https://doi.org/10.1016/j.jmmm.2026.174566","doi":"10.1016/j.jmmm.2026.174566","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["V.O. Semin","M.V. Shandrikov","V.R. Utyaganova","M.G. Ostapenko","F.A. D'yachenko","A.A. Cherkasov","S.A. Larionov"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":15,"zhTitle":"由磁控溅射形成的亚铁磁性FeGd涂层的表征"},{"title":"Octupole-driven spin torque switching of antiferromagnetic tunnel junctions","url":"https://doi.org/10.1038/s41586-026-11172-5","doi":"10.1038/s41586-026-11172-5","journal":"Nature","jabbr":"Nature","pubdate":"2026-10-21","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Jaimin Kang","Mohammad Hamdi","Shun Kong Cheung","Lin-Ding Yuan","Mohamed Elekhtiar","Eric Matt","William Rogers","Andrea Meo","Peter G. Lim","M. S. Nicholas Tey","Anthony D’Addario","Shiva T. Konakanchi"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":16,"zhTitle":"八极驱动反铁磁隧道结的自旋力矩翻转"},{"title":"Intra-atomic magnetic octupoles and their coupling to cluster magnetic octupoles in chiral antiferromagnetic Mn 3 Sn","url":"https://doi.org/10.1103/lfl8-syfd","doi":"10.1103/lfl8-syfd","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-21","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Dohoon Park","Seungyun Han","Hyun-Woo Lee"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":17,"zhTitle":"手性反铁磁体Mn₃Sn中的原子内磁八极子及其与团簇磁八极子的耦合"},{"title":"Magnetic circular dichroism of terahertz modes and selection rules of Raman-active optical phonons in the polar altermagnet candidate Mn 2 Mo 3 O 8","url":"https://doi.org/10.1103/sqws-q32r","doi":"10.1103/sqws-q32r","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-21","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"标题：altermagnet","score":12,"authors":["F. Schilberth","K. Vasin","M. Knauft","M. Kondákor","M. Vuckovic","N. Herrmann","K. Penc","M. Minola","B. Keimer","V. A. Martinez","K. Panda","A. A. Sirenko"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":18,"zhTitle":"极性交错磁体候选材料Mn2Mo3O8中太赫兹模式的磁圆二色性及拉曼活性光学声子的选择定则"},{"title":"Probing the ground state of the antiferromagnetic Heisenberg model on the kagome lattice using geometrically informed variational quantum eigensolver","url":"https://doi.org/10.1103/82g5-bsvp","doi":"10.1103/82g5-bsvp","journal":"Physical Review Research","jabbr":"Physical Review Research","pubdate":"2026-10-21","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Abdellah Tounsi","Nacer Eddine Belaloui","Abdelmouheymen Rabah Khamadja","Takei Eddine Fadi Lalaoui","Mohamed Messaoud Louamri","David E. Bernal Neira","Mohamed Taha Rouabah"],"authorMore":true,"abstract":"This work investigates the nature of the ground state of the antiferromagnetic Heisenberg model on fundamental kagome cells, a triangle and a star, using the variational quantum eigensolver algorithm on real quantum hardware. We demonstrate that the ground-state preparation is achievable using a shallow hardware-efficient quantum circuit with a naturally Euclidean parameter space. Our custom ansatz is capable of accurately recovering meaningful properties of the ground state such as the spin-spin correlation terms and static structure factor without explicit error mitigation. These features are found to be resilient to noise. We exploited the Fubini-Study metric in constructing the ansatz, ensuring a singularity-free parameter space. With this ansatz design, the adaptive gradient descent optimizer achieves a faster convergence in terms of the number of iterations compared to simultaneous perturbation stochastic approximation. We further apply error mitigation techniques, including zero-noise extrapolation (ZNE) and qubitwise readout-error mitigation (REM). While ZNE does not obey the Rayleigh-Ritz variational principle, the conditions under which REM preserves it are discussed.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":19,"enAbstractSource":"custom","enAbstract":"This work investigates the nature of the ground state of the antiferromagnetic Heisenberg model on fundamental kagome cells, a triangle and a star, using the variational quantum eigensolver algorithm on real quantum hardware. We demonstrate that the ground-state preparation is achievable using a shallow hardware-efficient quantum circuit with a naturally Euclidean parameter space. Our custom ansatz is capable of accurately recovering meaningful properties of the ground state such as the spin-spin correlation terms and static structure factor without explicit error mitigation. These features are found to be resilient to noise. We exploited the Fubini-Study metric in constructing the ansatz, ensuring a singularity-free parameter space. With this ansatz design, the adaptive gradient descent optimizer achieves a faster convergence in terms of the number of iterations compared to simultaneous perturbation stochastic approximation. We further apply error mitigation techniques, including zero-noise extrapolation (ZNE) and qubitwise readout-error mitigation (REM). While ZNE does not obey the Rayleigh-Ritz variational principle, the conditions under which REM preserves it are discussed.","zhTitle":"利用几何信息变分量子本征求解器探究kagome晶格上反铁磁Heisenberg模型的基态","zhAbstract":"本文研究了在真实量子硬件上使用变分量子本征求解器算法，探究基本kagome元胞（三角形和星形）上反铁磁Heisenberg模型基态的性质。我们证明，使用具有自然欧几里得参数空间的浅层硬件高效量子电路可以实现基态制备。我们的定制拟设能够在没有显式误差缓解的情况下准确恢复基态的有意义性质，例如自旋-自旋关联项和静态结构因子。这些特征被发现对噪声具有鲁棒性。我们在构造拟设时利用了Fubini-Study度量，确保参数空间无奇点。采用这种拟设设计，自适应梯度下降优化器在迭代次数方面相比同时扰动随机逼近实现了更快的收敛。我们进一步应用误差缓解技术，包括零噪声外推（ZNE）和逐量子比特读出误差缓解（REM）。虽然ZNE不遵循Rayleigh-Ritz变分原理，但讨论了REM保持该原理的条件。"},{"title":"Operating regimes and materials limits of nonlinear magnon dynamics in Co-doped YIG","url":"https://doi.org/10.1016/j.jmmm.2026.174649","doi":"10.1016/j.jmmm.2026.174649","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-12-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["A.M. Tishin"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":20,"zhTitle":"Co掺杂YIG中非线性磁振子动力学的运行区间与材料极限"},{"title":"Modulation of Current-Induced Magnetization Switching by Tb Layer Thickness in Ti/Pt/Co/Tb/Ti Heterostructures","url":"https://doi.org/10.1016/j.jmmm.2026.174674","doi":"10.1016/j.jmmm.2026.174674","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetization switching","matchWhere":"标题：magnetization switching","score":9,"authors":["Shumin Lv","Zhicheng Wang","Mengjia Sun","Wenrui Guo","Liang Liu","Xiangxiang Zhao","Weixiao Hou","Qi Guo","Xue Ren","Yong Jiang","Jifan Hu"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":21,"zhTitle":"Ti/Pt/Co/Tb/Ti异质结构中Tb层厚度对电流诱导磁化翻转的调制"},{"title":"Chirality-Barrier skyrmion racetrack with topological protection, Hall effect suppression, and reconfigurable logic","url":"https://doi.org/10.1016/j.jmmm.2026.174638","doi":"10.1016/j.jmmm.2026.174638","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Xue-Feng Zhang","Wenbin Liu","Xiao-Ping Ma","Hongyan Zhang","Mengyao Han","Cunlong Dong","Guoqiang Yu","Hong-Guang Piao"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":22,"zhTitle":"手性势垒斯格明子赛道，具有拓扑保护、霍尔效应抑制和可重构逻辑","enAbstractSource":"custom","enAbstract":"Simultaneous suppression of the skyrmion Hall effect (SkHE) and preservation of skyrmion topological integrity remain critical challenges for skyrmion-based racetrack devices. We propose a chirality-engineered racetrack architecture in which a Dzyaloshinskii–Moriya interaction (DMI) sign reversal creates an energy barrier with a dual function: preserving skyrmion integrity by preventing inter-skyrmion merger into stripe domains, and providing a repulsive force that counterbalances the Magnus force to suppress the SkHE. The barrier also enables helicity-based encoding and reconfigurable AND/OR logic. By tuning the transition width w , the device operates in two regimes: crosstalk-free transport for w \u003e 10 nm , and logic operations via inter-skyrmion interactions for w ≤ 10 nm . For w ≥ 20 nm , topological charge Q ≈ 2 is preserved throughout. Thiele-equation analysis identifies the off-diagonal SOT coupling integral I x y as the governing velocity parameter. An optimal width w = 20 nm maximizes the threshold current density ( J th = 2.7 × 1 0 12 A / m 2 ) and steady-state velocity ( v ̄ ∼ 296 m / s ). Barrier-force model verification confirms the analytic prediction F y = − 2 π R t F D 0 / w . This architecture provides a compact memory-logic integrated platform within a single racetrack.","zhAbstract":"英文论文标题：具有拓扑保护、霍尔效应抑制和可重构逻辑的手性势垒斯格明子赛道 英文摘要：同时抑制斯格明子霍尔效应（SkHE）并保持斯格明子拓扑完整性，仍然是基于斯格明子的赛道器件所面临的关键挑战。我们提出了一种手性工程化赛道架构，其中Dzyaloshinskii–Moriya相互作用（DMI）符号反转产生一个具有双重功能的能量势垒：通过防止斯格明子之间合并为条纹畴来保持斯格明子完整性，并提供一种排斥力以抵消马格努斯力从而抑制SkHE。该势垒还使基于螺旋度的编码和可重构AND/OR逻辑成为可能。通过调节过渡宽度w，该器件工作在两种 regime：对于w \u003e 10 nm为无串扰输运，对于w ≤ 10 nm为通过斯格明子间相互作用实现逻辑操作。对于w ≥ 20 nm，拓扑电荷Q ≈ 2在整个过程中得以保持。Thiele方程分析确定非对角SOT耦合积分I x y为控制速度的参数。最佳宽度w = 20 nm使阈值电流密度（J th = 2.7 × 1 0 12 A / m 2）和稳态速度（v ̄ ∼ 296 m / s）最大化。势垒力模型验证确认了解析预测F y = − 2 π R t F D 0 / w。该架构在单一赛道内提供了一个紧凑的存储-逻辑集成平台。"},{"title":"Spin-wave behavior and quantum fluctuations in AB-stacked bilayer zigzag nanoribbons","url":"https://doi.org/10.1016/j.jmmm.2026.174605","doi":"10.1016/j.jmmm.2026.174605","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"spin wave","matchWhere":"标题：spin wave","score":9,"authors":["He Liu","Anbang Guo","Ao Tang","Qi Zhi"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":23,"zhTitle":"AB堆叠双层锯齿形纳米带中的自旋波行为与量子涨落"},{"title":"Multi-scale characterization of magnetic anisotropy via magnetic acoustic emission, Barkhausen noise and magnetic domain observation","url":"https://doi.org/10.1016/j.jmmm.2026.174668","doi":"10.1016/j.jmmm.2026.174668","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"标题：magnetic anisotropy","score":9,"authors":["YuFan Zeng","Fasheng Qiu","Yao Chen"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":24,"zhTitle":"磁各向异性的多尺度表征：基于磁声发射、巴克豪森噪声和磁畴观察"},{"title":"Impact of He+ ion irradiation on the domain wall dynamics in Pd/Co/Pd trilayers with perpendicular magnetic anisotropy","url":"https://doi.org/10.1016/j.jmmm.2026.174543","doi":"10.1016/j.jmmm.2026.174543","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"perpendicular magnetic anisotropy","matchWhere":"标题：perpendicular magnetic anisotropy","score":9,"authors":["Anurag Keloth","Sakshath Sadashivaiah","Parswajit Kalita","Rakhul Raj","V. Raghavendra Reddy","Bikram Das","Bharti Pandit","Ralf Röhlsberger","P.S. Anil Kumar","Ajay Gupta","Sarathlal Koyiloth Vayalil"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":25,"zhTitle":"He+离子辐照对具有垂直磁各向异性的Pd/Co/Pd三层膜中畴壁动力学的影响","enAbstractSource":"custom","enAbstract":"Heavy metal/ferromagnetic-based heterostructures with perpendicular magnetic anisotropy (PMA) are prototypes for domain wall (DW)-based spintronic devices. We explored the impact of He + ion irradiation on the bubble DW dynamics in Pd/Co/Pd trilayers with PMA. The effective magnetic anisotropy ( K e f f ) is enhanced by 20% when irradiated at the lowest fluence value, 1 × 1 0 14 He + / cm 2 and further, it decreases with an increase in fluence. Field-induced domain wall motion studies revealed that the sample irradiated at this fluence required a higher magnetic field for bubble domain walls to attain the same velocity as in the pristine sample. The bubble domain walls in the sample irradiated at this fluence expand at a rate of 1.1 mm/s, in contrast to the pristine sample’s rate of 0.38 mm/s near the coercive region, and this expansion rate diminishes with increasing fluence. At the lowest fluence value, bubble domains increase in size while their number density diminishes. However, with increased fluence, the size of the bubble domains reduces and their number density rises. Higher fluence values increase the interlayer roughness, driven by ballistic collisions between low-energy ions and atoms. The enhanced intermixing at higher fluence results in reduced saturation magnetization and anisotropy energy. Thus, by engineering the interfaces of the heterostructure and the magnetic anisotropy, ion interactions can be used to tune the pinning-controlled dynamics of magnetic bubble domains in Pd/Co/Pd based spintronic devices.","zhAbstract":"英文论文标题：He+离子辐照对具有垂直磁各向异性的Pd/Co/Pd三层的畴壁动力学的影响 英文摘要：基于重金属/铁磁体的具有垂直磁各向异性（PMA）的异质结构是基于畴壁（DW）的自旋电子器件的原型。我们探索了He+离子辐照对具有PMA的Pd/Co/Pd三层中泡状畴壁动力学的影响。当以最低注量值1×10^14 He+/cm²辐照时，有效磁各向异性（K_eff）增强了20%，并且随着注量的增加，它进一步降低。场诱导畴壁运动研究表明，在该注量下辐照的样品需要更高的磁场才能使泡状畴壁达到与原始样品相同的速度。在该注量下辐照的样品中，泡状畴壁以1.1 mm/s的速率扩展，而原始样品在矫顽力区域附近的扩展速率为0.38 mm/s，并且该扩展速率随着注量的增加而减小。在最低注量值下，泡状畴的尺寸增大，而其数密度减小。然而，随着注量增加，泡状畴的尺寸减小，其数密度上升。较高的注量值会增加层间粗糙度，这是由低能离子与原子之间的弹道碰撞驱动的。较高注量下增强的互混导致饱和磁化强度和磁各向异性能降低。因此，通过设计异质结构的界面和磁各向异性，离子相互作用可用于调控基于Pd/Co/Pd的自旋电子器件中钉扎控制的磁泡畴动力学。"},{"title":"Thermally driven stochastic magnetic-state selection and competing skyrmion annihilation pathways","url":"https://doi.org/10.1016/j.jmmm.2026.174646","doi":"10.1016/j.jmmm.2026.174646","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["F. Tejo","D. Cortés-Ortuño","J. Escrig"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":26,"zhTitle":"热驱动的随机磁态选择与竞争性斯格明子湮灭路径","enAbstractSource":"custom","enAbstract":"We investigate current-driven skyrmion nucleation and annihilation in confined Ir/Co/Pt nanodots, focusing on the role of thermal fluctuations. While minimum-energy approaches predict well-defined transition mechanisms, we show that finite-temperature dynamics can lead to distinct magnetic configurations under identical nominal conditions. Micromagnetic simulations including spin-transfer torques, Oersted fields, and thermal noise reveal stochastic variability in the current-driven magnetic response, while preserving reproducible current-dependent magnetic regimes across independent thermal-noise realisations. Comparison with geodesic nudged elastic band (GNEB) calculations identifies two competing skyrmion annihilation mechanisms, namely interior collapse and boundary-mediated annihilation, with markedly different activation barriers. At T = 300 K, the corresponding maximum barriers are approximately 44.7 k B T and 21.2 k B T , respectively, indicating that boundary-mediated annihilation is strongly kinetically favoured under thermal activation. These results highlight the interplay between energy landscape topology and stochastic dynamics, providing new insight into current-driven skyrmion transitions in confined geometries.","zhAbstract":"我们研究了受限Ir/Co/Pt纳米点中由电流驱动的斯格明子成核与湮灭，重点关注热涨落的作用。虽然最小能量方法预测出明确的转变机制，但我们表明，有限温度动力学可在相同标称条件下导致不同的磁构型。包含自旋转移矩、奥斯特场和热噪声的微磁模拟揭示了电流驱动磁响应中的随机变异性，同时在独立热噪声实现中保持了可重现的电流依赖磁区域。与测地线微扰弹性带（GNEB）计算的比较识别出两种相互竞争的斯格明子湮灭机制，即内部坍缩和边界介导的湮灭，二者具有显著不同的激活势垒。在T = 300 K时，相应的最大势垒分别约为44.7 k B T和21.2 k B T，表明在热激活下边界介导的湮灭在动力学上强烈占优。这些结果凸显了能量景观拓扑与随机动力学之间的相互作用，为受限几何结构中电流驱动的斯格明子转变提供了新见解。"},{"title":"Emergence of multiple metastable Skyrmion states induced by strong grain-boundary pinning","url":"https://doi.org/10.1016/j.jmmm.2026.174629","doi":"10.1016/j.jmmm.2026.174629","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Terumitsu Tanaka","Budi Purnama"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":27,"zhTitle":"强晶界钉扎诱导的多个亚稳态斯格明子态的出现","enAbstractSource":"custom","enAbstract":"The stability of magnetic skyrmions in polycrystalline magnetic thin films with reduced intergrain exchange coupling was investigated using micromagnetic simulations combined with the nudged elastic band method. Polycrystalline films were modeled using Voronoi tessellations, and the exchange coupling across grain boundaries was systematically reduced in order to examine the influence of strong grain-boundary pinning on skyrmion stability. The skyrmion diameter increased significantly with decreasing intergrain exchange coupling owing to the suppression of skyrmion shrinkage by grain-boundary pinning. Correspondingly, the energy barrier against skyrmion collapse increased primarily because of a reduction in the skyrmion-state energy, while the saddle-point energy exhibited only a weak dependence on intergrain exchange coupling. A nearly linear relationship between skyrmion diameter and skyrmion-state energy was observed when magnetic continuity across grain boundaries was relatively well preserved. However, systematic deviations from this diameter-energy relation emerged as the intergrain exchange coupling was further reduced. An analysis of the energy difference between the skyrmion and ferromagnetic states normalized by the skyrmion perimeter revealed that the deviation cannot be explained solely by variations in the energy difference per unit perimeter. Instead, the results suggest that strong grain-boundary pinning suppresses further skyrmion shrinkage during relaxation. Additional simulations employing different initial reversed-domain sizes demonstrated that the relaxed skyrmion diameter depends on the size of the initially introduced reversed domain under strong exchange discontinuity. The results suggest the emergence of multiple metastable skyrmion states with different diameters associated with different pinned domain-wall configurations. Despite a substantial increase in skyrmion diameter, the magnitude of the topological charge decreased only slightly, indicating that the enlarged skyrmions retain the essential topological characteristics of skyrmions. These findings demonstrate that strong grain-boundary pinning introduces additional effects beyond the conventional diameter-energy relation and provide new insight into skyrmion stability in structurally disordered magnetic films.","zhAbstract":"通过微磁学模拟结合微动弹性带方法，研究了在降低晶间交换耦合的多晶磁性薄膜中磁斯格明子的稳定性。多晶薄膜采用Voronoi镶嵌建模，并系统性地降低跨晶界的交换耦合，以考察强晶界钉扎对斯格明子稳定性的影响。由于晶界钉扎抑制了斯格明子的收缩，斯格明子直径随晶间交换耦合的降低而显著增大。相应地，由于斯格明子态能量的降低，斯格明子坍缩的能垒主要随之增大，而鞍点能量对晶间交换耦合仅表现出较弱的依赖性。当跨晶界的磁性连续性保持相对较好时，观察到斯格明子直径与斯格明子态能量之间呈近乎线性的关系。然而，随着晶间交换耦合进一步降低，出现了对该直径-能量关系的系统性偏离。对斯格明子态与铁磁态之间能量差按斯格明子周长归一化后的分析表明，该偏离不能仅由单位周长能量差的变化来解释。相反，结果表明强晶界钉扎抑制了弛豫过程中斯格明子的进一步收缩。采用不同初始反转畴尺寸的额外模拟表明，在强交换不连续性下，弛豫后的斯格明子直径取决于初始引入的反转畴的尺寸。\n结果表明，出现了与不同钉扎畴壁构型相关联的、具有不同直径的多个亚稳态斯格明子态。尽管斯格明子直径大幅增加，拓扑电荷的大小仅略有下降，这表明 enlarged skyrmions 保留了斯格明子的基本拓扑特征。这些发现表明，强晶界钉扎引入了超出传统直径-能量关系之外的额外效应，并为结构无序磁性薄膜中斯格明子的稳定性提供了新的见解。"},{"title":"Designer quantum states in magnetic topological insulator multilayers","url":"https://doi.org/10.1016/j.jmmm.2026.174589","doi":"10.1016/j.jmmm.2026.174589","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"magnetic topological insulator","matchWhere":"标题：magnetic topological insulator","score":9,"authors":["Deyi Zhuo","Han Tay","Cui-Zu Chang"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":28,"zhTitle":"磁性拓扑绝缘体多层结构中的设计量子态","enAbstractSource":"custom","enAbstract":"Magnetic topological insulators (TIs) provide a highly tunable platform for engineering quantum states that emerge from the interplay between topology and magnetism. In this review article, we summarize experimental progress over the past decade in designing magnetic TI multilayers by molecular beam epitaxy (MBE). By treating magnetically doped and undoped TI layers as topological Legos, we discuss how layer thickness, magnetic doping, heterostructure architecture, and stacking sequence can be used to control magnetic exchange gaps, interlayer coupling, and the Chern number C with atomic-layer precision. We first briefly review the realization of the C = 1 quantum anomalous Hall (QAH) effect in uniformly Cr-doped (Bi,Sb)2Te3 films in 2013 and uniformly V-doped (Bi,Sb)2Te3 films in 2015. We then discuss how Cr-doped and undoped (Bi,Sb)2Te3 layers can be combined to realize the C = 1 QAH effect in magnetically modulation-doped trilayers, including its extension into the three-dimensional (3D) regime. Next, we review the development of high-C QAH states, engineered plateau phase transitions, mesoscopic QAH devices, and electrical switching of chiral edge-current chirality. Finally, we discuss the realizations of axion insulator and C = 1/2 parity anomaly states in asymmetric magnetic TI trilayers. These advances establish magnetic TI multilayers as a versatile materials platform for creating new designer quantum states, including synthetic Weyl semimetal and QAH metal phases, and for probing the topological magnetoelectric effect in thick axion insulators and 3D QAH insulators.","zhAbstract":"磁性拓扑绝缘体（TI）为工程化由拓扑与磁性相互作用所涌现的量子态提供了一个高度可调的平台。在这篇综述文章中，我们总结了过去十年中通过分子束外延（MBE）设计磁性TI多层膜的实验进展。通过将磁性掺杂和未掺杂的TI层视为拓扑乐高积木，我们讨论了如何以原子层精度利用层厚度、磁性掺杂、异质结构架构和堆叠顺序来控制磁交换能隙、层间耦合和Chern数C。我们首先简要回顾了2013年在均匀Cr掺杂的(Bi,Sb)2Te3薄膜和2015年在均匀V掺杂的(Bi,Sb)2Te3薄膜中实现C = 1量子反常霍尔（QAH）效应的工作。然后我们讨论了如何将Cr掺杂和未掺杂的(Bi,Sb)2Te3层组合起来，在磁性调制掺杂的三层结构中实现C = 1 QAH效应，包括将其扩展到三维（3D）区域。接下来，我们回顾了高C QAH态的发展、工程化平台相变、介观QAH器件以及手性边缘电流手性的电学切换。最后，我们讨论了在非对称磁性TI三层结构中轴子绝缘体和C = 1/2宇称反常态的实现。这些进展确立了磁性TI多层膜作为一个多功能材料平台的地位，可用于创建新的设计量子态，包括合成Weyl半金属和QAH金属相，并用于在厚轴子绝缘体和3D QAH绝缘体中探测拓扑磁电效应。"},{"title":"Topological magnon frequency combs","url":"https://doi.org/10.1103/8q5b-3xcn","doi":"10.1103/8q5b-3xcn","journal":"Physical Review Applied","jabbr":"Physical Review Applied","pubdate":"2026-10-21","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Zhixiong Li","Xuejuan Liu","Zhejunyu Jin","Guanghua Guo","Xingen Zheng","Peng Yan"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":29,"zhTitle":"拓扑磁振子频率梳"},{"title":"Magnon-dislon hybridization in magnetic insulators","url":"https://doi.org/10.1103/dbd5-2s48","doi":"10.1103/dbd5-2s48","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-21","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Carlos Saji","Nicolas Vidal-Silva","Roberto E. Troncoso"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":30,"zhTitle":"磁绝缘体中的磁振子-位错子杂化"},{"title":"Chiral topological superconductivity from quantum anomalous Hall states in ferromagnetic metals","url":"https://doi.org/10.1103/rvzx-phch","doi":"10.1103/rvzx-phch","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-21","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"quantum anomalous Hall","matchWhere":"标题：quantum anomalous Hall","score":9,"authors":["Yun-Lei Sun"],"authorMore":false,"abstract":"✅ 数据源：52 本刊、104 条通道全部正常。","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-22","tkey":"other","id":31,"zhTitle":"铁磁金属中量子反常霍尔态产生的 chiral 拓扑超导性"},{"title":"Robust Anomalous Hall Effect in Epitaxial Cubic D03-Fe3Ge Nanoplates Grown via Chemical Vapor Deposition","url":"https://doi.org/10.1021/acsami.6c14914","doi":"10.1021/acsami.6c14914","journal":"ACS Applied Materials \u0026 Interfaces","jabbr":"ACS Applied Materials \u0026 Interfaces","pubdate":"2026-10-21","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Mingxuan Chen","Chao Chen","Siqi Jiang","Shuxiang Qiao","Hongyan Lu","Di Zhang","Jiabei Huang","Fuzhuo Lian","Zhaochen Qu","Siqin Wang","Ziyi Wang","Shuai Zhang"],"authorMore":true,"abstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":32,"enAbstractSource":"custom","enAbstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","zhTitle":"通过化学气相沉积生长的外延立方D03-Fe3Ge纳米片中的稳健反常霍尔效应","zhAbstract":"摘要 铁基铁磁材料因其高居里温度以及由贝里曲率驱动的显著反常霍尔效应（AHE），已成为自旋电子学中一个有前景的体系。尽管已有对非层状铁基铁磁材料外延生长的研究，但高质量单晶薄膜的实现仍然是一个艰巨的障碍。同时，晶界散射等问题进一步阻碍了它们的表征与应用。在此，我们报道了首次通过化学气相沉积合成单晶立方D03-Fe3Ge纳米片。该化合物与Fe–Ge体系中通常观察到的传统六方相有显著不同。结构表征证实了晶体的立方晶格和化学计量纯度。结构分析识别出强外延效应，导致界面处约4.16%的巨大压应变，并逐渐向表面弛豫。二次谐波产生信号可能进一步揭示，这种界面应变破坏了立方相固有的中心对称性。超导量子干涉器件磁强计测量显示出稳健的室温铁磁性和明显的磁各向异性。磁输运测量揭示出稳健的AHE，该效应在远高于室温的温度下仍保持稳定。在反常霍尔电阻与纵向电阻之间观察到的标度关系强烈表明，该效应由本征贝里曲率机制主导。\n此外，密度泛函理论计算表明，巨大的外延应变诱导能带重构，并在费米能级附近产生密集的自旋-轨道耦合带隙，从而有效地将反常霍尔电导率提高一倍，与我们的实验观测结果相符。"},{"title":"Bulk-Mediated Reflection of Chirality-Protected Surface Spin Waves","url":"https://doi.org/10.1103/hgvh-s6h5","doi":"10.1103/hgvh-s6h5","journal":"Physical Review Letters","jabbr":"Physical Review Letters","pubdate":"2026-10-21","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"摘要：magnon","score":3,"authors":["Vitaliy I. Vasyuchka","Florin Ciubotaru","Andrii V. Chumak","Burkard Hillebrands","Alexander A. Serga"],"authorMore":false,"abstract":"Surface spin waves of the Damon-Eshbach type exhibit intrinsically nonreciprocal transport properties with a chiral dynamical field structure that localizes counterpropagating waves at opposite film surfaces. Such chirality has been predicted to suppress direct backscattering in thin films within frequency ranges free of bulk modes. However, how chirality influences reflection in thicker three-dimensional magnetic media, where a dense spectrum of bulk excitations overlaps with surface waves, remains unclear. Here we demonstrate that, in micrometer-thick yttrium iron garnet films, reflection of the chiral Damon-Eshbach wave from the boundary of the magnetic medium is accompanied by excitation of spatially localized thickness-quantized bulk modes, whereas reciprocal backward-volume waves reflect nearly elastically. Brillouin light scattering spectroscopy, infrared thermography, and micromagnetic simulations reveal standing bulk excitations at the reflecting boundary and quantify the associated magnon energy accumulation and dissipation. These results identify bulk-mode excitations as the physical pathway enabling reversal of chirally localized surface waves in thick films, thereby defining the limits of chirality-based backscattering immunity and providing a general framework for wave transport in nonreciprocal magnetic media. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":33,"enAbstractSource":"custom","enAbstract":"Surface spin waves of the Damon-Eshbach type exhibit intrinsically nonreciprocal transport properties with a chiral dynamical field structure that localizes counterpropagating waves at opposite film surfaces. Such chirality has been predicted to suppress direct backscattering in thin films within frequency ranges free of bulk modes. However, how chirality influences reflection in thicker three-dimensional magnetic media, where a dense spectrum of bulk excitations overlaps with surface waves, remains unclear. Here we demonstrate that, in micrometer-thick yttrium iron garnet films, reflection of the chiral Damon-Eshbach wave from the boundary of the magnetic medium is accompanied by excitation of spatially localized thickness-quantized bulk modes, whereas reciprocal backward-volume waves reflect nearly elastically. Brillouin light scattering spectroscopy, infrared thermography, and micromagnetic simulations reveal standing bulk excitations at the reflecting boundary and quantify the associated magnon energy accumulation and dissipation. These results identify bulk-mode excitations as the physical pathway enabling reversal of chirally localized surface waves in thick films, thereby defining the limits of chirality-based backscattering immunity and providing a general framework for wave transport in nonreciprocal magnetic media.","zhTitle":"体介导的手性保护表面自旋波的反射","zhAbstract":"英文论文标题：手性保护表面自旋波的体介导反射 英文摘要：Damon-Eshbach型表面自旋波表现出本质上的非互易输运特性，其手性动力学场结构将反向传播的波局域在薄膜的相对表面上。此前已预测，在无体模的频率范围内，这种手性会抑制薄膜中的直接背散射。然而，在手性如何影响更厚的三维磁性介质中的反射方面——在该介质中，密集的体激发谱与表面波重叠——目前仍不清楚。在此，我们证明，在微米厚的钇铁石榴石薄膜中，手性Damon-Eshbach波从磁性介质边界的反射伴随着空间局域的厚度量子化体模的激发，而互易背向体波则几乎弹性反射。布里渊光散射光谱、红外热成像和微磁模拟揭示了反射边界处的驻体激发，并量化了相关的磁振子能量积累与耗散。这些结果将体模激发确定为在厚膜中实现手性局域表面波反转的物理途径，从而界定了基于手性的背散射免疫性的极限，并为非互易磁性介质中的波输运提供了一个通用框架。"},{"title":"Enhanced Magneto-Optical Kerr Effect in Nano-Magnetic Metamaterials with Near-Perfect Coherent Absorption","url":"https://doi.org/10.1021/acsnano.6c15462","doi":"10.1021/acsnano.6c15462","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-21","topic":"自旋逻辑与神经形态器件","topics":["自旋逻辑与神经形态器件"],"matchTerm":"magnetic sensing","matchWhere":"摘要：magnetic sensing","score":3,"authors":["Xiaofei Xiao","Tingjun Zheng","Alex Vanstone","Daniel S. Bromley","Holly Holder","Kilian D. Stenning","Jack C. Gartside","Will R. Branford","Rupert F. Oulton"],"authorMore":true,"abstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-22","tkey":"other","id":34,"enAbstractSource":"custom","enAbstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control.","zhTitle":"近完美相干吸收的纳米磁性超材料中增强的磁光克尔效应","zhAbstract":"摘要 无需外部磁场即可控制磁性系统的能力近来引起了关注，全光磁开关展现出越来越大的前景。在磁性纳米结构中实现对光与物质相互作用的精细控制，对于推进光磁技术至关重要，但这仍然具有挑战性，因为必须在目标波长下于超薄磁性结构内实现强光学耦合。在此，我们表明相干光学干涉可以增强图案化磁性超表面中的这种相互作用。坡莫合金纳米磁体阵列被放置在反射背板之上的薄介电间隔层上，形成磁性超表面，其反射波前由纳米磁体几何形状、填充因子和间隔层厚度决定。超表面与背板反射之间的相消干涉产生近完美吸收，对于圆形纳米磁体阵列，在模拟和实验中均超过95%。被吸收的功率几乎全部在纳米磁体内耗散，仅有百分之几在金属背板中损失。增强的吸收还伴随着更强的磁光克尔效应，这是由光与纳米磁体相互作用增强以及反射背景降低共同驱动的。这些结果为在纳米级磁性系统中实现高光学吸收和强磁光响应提供了一种通用方法，支持光可寻址自旋电子学、磁传感和全光磁控制方面的进展。"}],"reports":[{"date":"2026-10-22","generated":"2026-10-22 00:01","count":35}],"topics":["交换偏置与界面交换耦合","反铁磁与补偿磁体","自旋轨道力矩SOT","自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","自旋流与自旋输运","磁各向异性与界面磁性","手性磁结构与自旋动力学","二维磁性与拓扑自旋电子学","自旋逻辑与神经形态器件","磁振子量子器件与自旋波逻辑","轨道力矩磁存储与晶圆级集成","概率计算与自旋忆阻器","二维磁体与交替磁隧穿器件"],"themeKeys":["air","rs","chem","bgc","gis"],"topicTheme":{"空气污染":"air","遥感":"rs","大气化学":"chem","生物地球化学":"bgc","城市地理信息系统":"gis"},"generated":"2026-10-22 00:01"}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = ((a.zhTitle||'')+' '+a.title+' '+a.abstract+' '+(a.enAbstract||'')+' '+(a.zhAbstract||'')+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var chinese = a.zhAbstract || '';
    var english = a.enAbstract || a.abstract || '';
    var ab = chinese
      ? '<div class="bilingual-preview"><span class="language">中文直译</span><p class="excerpt">'+esc(trunc(chinese,110))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">中文直译</span><p class="excerpt">译文暂缺；历史文献可后续补译</p></div>';
    ab += english
      ? '<div class="bilingual-preview"><span class="language">English Abstract</span><p class="excerpt">'+esc(trunc(english,125))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">English Abstract</span><p class="excerpt">英文摘要暂缺 · 点击原文</p></div>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+(a.zhTitle ? esc(a.zhTitle)+'<span class="english-title">'+esc(a.title)+'</span>' : esc(a.title))+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+(a.zhTitle ? esc(a.zhTitle)+'<span class="english-title">'+esc(a.title)+'</span>' : esc(a.title))+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="bilingual-section"><div class="sec-t">中文摘要（忠实直译）</div>'
      +   (a.zhAbstract
            ? '<p class="abs">'+esc(a.zhAbstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">尚未生成中文译文。仅对升级后新发现的论文自动翻译；历史论文可另行补译。</p>')
      +   '<div class="sec-t">English Abstract '+(a.enAbstract?'（原始全文）':'（日报摘录，可能不完整）')+'</div>'
      +   ((a.enAbstract || a.abstract)
            ? '<p class="abs">'+esc(a.enAbstract || a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">原数据源未提供英文摘要。</p>')
      +   '</div>'
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
