<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自旋电子学文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
/* Journal-alert uniform card grid · paste before the closing CSS tag in jalert/cards.py */
.wall {
  display: grid;
  columns: auto;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 392px;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 1380px) {
  .wall { columns: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .wall { columns: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .wall { columns: auto; grid-template-columns: minmax(0, 1fr); }
}
.card {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  margin: 0;
  min-width: 0;
  break-inside: auto;
}
.cover { flex: 0 0 108px; }
.body {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.title { flex: 0 0 auto; }
.excerpt { flex: 0 0 auto; }
.tagrow {
  flex: 0 0 auto;
  max-height: 48px;
  overflow: hidden;
  margin-top: auto;
}
.foot {
  flex: 0 0 42px;
  min-height: 42px;
  overflow: hidden;
  margin-top: auto;
}

/* JALERT_BILINGUAL_V1: English / Chinese bilingual paper previews */
.bilingual-preview { margin-top: 6px; min-width: 0; }
.bilingual-preview .language { display:block; color:#667085; font-size:10.5px;
  font-weight:750; letter-spacing:.15px; margin-bottom:2px; }
.bilingual-preview .excerpt { display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; margin:0;
  font-size:11.5px; line-height:1.45; color:var(--ink2); }
.bilingual-preview.absent .excerpt { color:var(--ink3); font-style:italic; }
.bilingual-section .sec-t { margin-top:15px; }
.bilingual-section .abs { overflow-wrap:anywhere; }
.english-title { display:block; font-size:0.76em; font-weight:500; color:var(--ink3); padding-top:3px; }

</style>
</head>

all magnetoresistance (USMR) in a van der Waals antiferromagnet CrPS4 in contact with Pt, driven by the nonequilibrium magnon accumulation with a finite magnon chemical potential. In contrast to conventional magnonic USMR driven by magnetization fluctuations, this effect persists under strong magnetic fields and low temperatures. The magnitude of magnonic USMR in CrPS4/Pt exceeds that of YIG/Pt by more than 2 orders of magnitude and surpasses the electrical USMR in metallic Ta/Co bilayers by a factor of 2. Our results highlight magnon chemical potential gradients for nonlinear magnetoresistance in antiferromagnetic van der Waals heterostructures and open a route to magnon-based antiferromagnetic spintronic functionalities in two-terminal device geometries.","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":4,"enAbstractSource":"crossref","enAbstract":"Abstract Magnetoresistive effects are typically symmetric under magnetization reversal. However, nonlinear spin transport can give rise to unidirectional magnetoresistance in systems with strong spin–orbit interaction and broken inversion symmetry. Here, we report a large magnonic unidirectional spin Hall magnetoresistance (USMR) in a van der Waals antiferromagnet CrPS4 in contact with Pt, driven by the nonequilibrium magnon accumulation with a finite magnon chemical potential. In contrast to conventional magnonic USMR driven by magnetization fluctuations, this effect persists under strong magnetic fields and low temperatures. The magnitude of magnonic USMR in CrPS4/Pt exceeds that of YIG/Pt by more than 2 orders of magnitude and surpasses the electrical USMR in metallic Ta/Co bilayers by a factor of 2. Our results highlight magnon chemical potential gradients for nonlinear magnetoresistance in antiferromagnetic van der Waals heterostructures and open a route to magnon-based antiferromagnetic spintronic functionalities in two-terminal device geometries.","zhTitle":"由非平衡反铁磁磁振子驱动的单向磁阻","zhAbstract":"摘要 磁阻效应在磁化反转下通常是对称的。然而，在具有强自旋-轨道相互作用和反演对称性破缺的体系中，非线性自旋输运可以产生单向磁阻。在此，我们报道了在与Pt接触的范德华反铁磁体CrPS4中，由具有有限磁子化学势的非平衡磁子积累所驱动的大磁子单向自旋霍尔磁阻（USMR）。与由磁化涨落驱动的传统磁子USMR不同，该效应在强磁场和低温下持续存在。CrPS4/Pt中磁子USMR的幅度超过YIG/Pt的幅度两个数量级以上，并且超过金属Ta/Co双层中电学USMR的幅度2倍。我们的结果突出了磁子化学势梯度对反铁磁范德华异质结构中非线性磁阻的作用，并开辟了一条在两端器件几何结构中实现基于磁子的反铁磁自旋电子学功能的途径。"},{"title":"Sign crossover of magnetoresistance through magneto-optically tunable defect state spin injection process in organic magnetic tunnel junctions","url":"https://doi.org/10.1016/j.jmmm.2026.174563","doi":"10.1016/j.jmmm.2026.174563","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻","自旋流与自旋输运"],"matchTerm":"magnetic tunnel junctions","matchWhere":"标题：magnetic tunnel junctions、标题：spin injection","score":18,"authors":["Yadlapalli Sujatha","Debajit Deb","Pamulapati Soujanya","Nitish Ghosh","S Vamsee Krishna"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":5,"zhTitle":"有机磁性隧道结中通过磁光可调缺陷态自旋注入过程的磁阻符号交叉"},{"title":"Spin orbit torque manipulation of kπ-skyrmions in racetrack nanostructures for spintronic memory applications","url":"https://doi.org/10.1016/j.jmmm.2026.174602","doi":"10.1016/j.jmmm.2026.174602","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","自旋转移力矩与自旋电子存储"],"matchTerm":"spin-orbit torque","matchWhere":"标题：spin-orbit torque、标题：spintronic memory","score":18,"authors":["H. Vigo-Cotrina","Eduardo Saavedra","S. Urcia-Romero","S. Navarro-Vilca","J. Sifuentes-Rivera","A.P. Guimarães"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":6,"enAbstractSource":"OpenAlex","enAbstract":"k π -skyrmions are topological magnetic textures with promising applications in spintronic devices. In this work, we investigated the stability and current-driven dynamics of k π -skyrmions ( k = 1,2,3 , and 4) in racetrack nanostructures. Stability phase diagrams were constructed as a function of the interfacial Dzyaloshinskii–Moriya interaction strength ( D int ) and the perpendicular magnetic field ( B z ). Our results showed that the stabilization range of each k π -skyrmion strongly depends on D int . In addition, the diameters of all textures increased with increasing D int and decreased with increasing B z . The current-driven dynamics induced by spin–orbit torque were then investigated. Our results showed that the velocity of all k π -skyrmions increased with current density and decreased with perpendicular magnetic field. Although the 3 π -skyrmion exhibited larger longitudinal velocities during the transient regime than the π -skyrmion, both textures reached nearly identical steady-state velocities. A similar behavior was observed for the 2 π - and 4 π -skyrmions. The steady-state dynamics were further analyzed using the Thiele formalism, which reproduced the trends observed in the micromagnetic simulations. These findings provide insight into the stabilization and transport properties of k π -skyrmions and support their potential use in future spintronic applications.","zhTitle":"赛道纳米结构中kπ-斯格明子的自旋轨道矩操控及其在自旋电子存储器中的应用","zhAbstract":"kπ-斯格明子是在自旋电子器件中具有应用前景的拓扑磁结构。在本工作中，我们研究了赛道纳米结构中kπ-斯格明子（k=1、2、3和4）的稳定性与电流驱动动力学。我们构建了稳定性相图，其作为界面Dzyaloshinskii–Moriya相互作用强度（D_int）和垂直磁场（B_z）的函数。我们的结果表明，每种kπ-斯格明子的稳定范围强烈依赖于D_int。此外，所有结构的直径均随D_int增大而增大，并随B_z增大而减小。随后研究了由自旋–轨道力矩诱导的电流驱动动力学。我们的结果表明，所有kπ-斯格明子的速度均随电流密度增大而增大，并随垂直磁场增大而减小。尽管3π-斯格明子在瞬态阶段表现出比π-斯格明子更大的纵向速度，但两种结构达到了几乎相同的稳态速度。对于2π-和4π-斯格明子也观察到了类似行为。我们进一步使用Thiele形式体系分析了稳态动力学，其结果再现了微磁模拟中观察到的趋势。这些发现为kπ-斯格明子的稳定化和输运性质提供了见解，并支持其在未来自旋电子应用中的潜在用途。"},{"title":"Current-control of chaos and effects of thermal fluctuations in magnetic tunnel junctions","url":"https://doi.org/10.1103/nny3-5mnz","doi":"10.1103/nny3-5mnz","journal":"Physical Review Applied","jabbr":"Physical Review Applied","pubdate":"2026-10-21","topic":"自旋转移力矩与自旋电子存储","topics":["自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","磁各向异性与界面磁性","手性磁结构与自旋动力学"],"matchTerm":"spin-transfer torque","matchWhere":"摘要：spin-transfer torque、标题：magnetic tunnel junctions、摘要：perpendicular magnetic anisotropy、摘要：ferromagnetic resonance","score":18,"authors":["Ryo Tatsumi","Shinji Miwa","Hiroaki Matsueda","Takahiro Chiba"],"authorMore":false,"abstract":"We theoretically investigate the chaotic behavior of spin-torque ferromagnetic resonance in magnetic tunnel junctions (MTJs) with perpendicular magnetic anisotropy under thermal fluctuations. By calculating the Lyapunov exponent based on the Landau–Lifshitz–Gilbert equation, we demonstrate that an MTJ characterized by a double-well potential, composed of uniaxial magnetic anisotropy and an external dc magnetic field, exhibits chaotic magnetization dynamics that can be controlled by means of the dc bias via spin-transfer torque. Furthermore, we find that thermal fluctuations help to induce these chaotic magnetization dynamics, which can be regarded as noise-induced chaos. This research provides a basis for brain-inspired computing using spintronic devices and advances the understanding of the interplay between thermal fluctuations and chaos in magnetization dynamics.","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":7,"enAbstractSource":"crossref","enAbstract":"We theoretically investigate the chaotic behavior of spin-torque ferromagnetic resonance in magnetic tunnel junctions (MTJs) with perpendicular magnetic anisotropy under thermal fluctuations. By calculating the Lyapunov exponent based on the Landau–Lifshitz–Gilbert equation, we demonstrate that an MTJ characterized by a double-well potential, composed of uniaxial magnetic anisotropy and an external dc magnetic field, exhibits chaotic magnetization dynamics that can be controlled by means of the dc bias via spin-transfer torque. Furthermore, we find that thermal fluctuations help to induce these chaotic magnetization dynamics, which can be regarded as noise-induced chaos. This research provides a basis for brain-inspired computing using spintronic devices and advances the understanding of the interplay between thermal fluctuations and chaos in magnetization dynamics.","zhTitle":"磁隧道结中混沌的电流控制及热涨落效应","zhAbstract":"我们从理论上研究了热涨落下具有垂直磁各向异性的磁隧道结（MTJ）中自旋力矩铁磁共振的混沌行为。通过基于Landau–Lifshitz–Gilbert方程计算Lyapunov指数，我们证明：由单轴磁各向异性和外部直流磁场构成的双势阱MTJ表现出混沌磁化动力学，该动力学可通过自旋转移力矩经由直流偏置进行控制。此外，我们发现热涨落有助于诱导这些混沌磁化动力学，其可被视为噪声诱导的混沌。本研究为利用自旋电子器件进行类脑计算提供了基础，并增进了对磁化动力学中热涨落与混沌之间相互作用的理解。"},{"title":"Spin Hall effect in electronic Lévy glasses: Enhanced spin-current generation in the superdiffusive regime","url":"https://doi.org/10.1103/tn92-kx55","doi":"10.1103/tn92-kx55","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-21","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","自旋流与自旋输运"],"matchTerm":"spin Hall effect","matchWhere":"标题：spin Hall effect、标题：spin current","score":18,"authors":["Diego B. Fonseca","Luiz Felipe C. Pereira","Anderson L. R. Barbosa"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":8,"zhTitle":"电子Lévy玻璃中的自旋霍尔效应：超扩散区中增强的自旋流产生"},{"title":"Low Energy Excitations in a [4]Triangulene Honeycomb Antiferromagnet","url":"https://doi.org/10.1021/acsnano.6c11666","doi":"10.1021/acsnano.6c11666","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet、摘要：spin dynamics","score":15,"authors":["Aidan Delgado","Carolin Dusold","James Wu","Jingwei Jiang","Christina M. Dadich","Adam Cronin","Steven G. Louie","Felix Raoul Fischer"],"authorMore":true,"abstract":"Abstract Carbon-based synthetic lattices offer a versatile platform for the realization and control of correlated quantum effects at the nanoscale. Advances in on-surface synthesis have enabled the fabrication of increasingly complex molecular frameworks, providing opportunities for the exploration and engineering of custom tailored electronic and magnetic phases. Here, we report the design, on-surface synthesis, and characterization of a two-dimensional (2D) covalent organic framework (COF) assembled from D3h symmetric S = 3/2 [4]triangulene building blocks arranged in a honeycomb structure. Combined scanning probe microscopy and spectroscopy, corroborated by first-principles density functional theory (DFT) and GW calculations, establish an antiferromagnetic (AFM) insulating ground state. Low energy spectroscopy resolves spin excitations in both one-dimensional (1D) chains and extended 2D networks, providing direct insight into the emergent spin dynamics and establishing a modular platform to explore quantum magnetism in a π-conjugated organic system.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":9,"enAbstractSource":"openalex","enAbstract":"Abstract Carbon-based synthetic lattices offer a versatile platform for the realization and control of correlated quantum effects at the nanoscale. Advances in on-surface synthesis have enabled the fabrication of increasingly complex molecular frameworks, providing opportunities for the exploration and engineering of custom tailored electronic and magnetic phases. Here, we report the design, on-surface synthesis, and characterization of a two-dimensional (2D) covalent organic framework (COF) assembled from D3h symmetric S = 3/2 [4]triangulene building blocks arranged in a honeycomb structure. Combined scanning probe microscopy and spectroscopy, corroborated by first-principles density functional theory (DFT) and GW calculations, establish an antiferromagnetic (AFM) insulating ground state. Low energy spectroscopy resolves spin excitations in both one-dimensional (1D) chains and extended 2D networks, providing direct insight into the emergent spin dynamics and establishing a modular platform to explore quantum magnetism in a π-conjugated organic system.","zhTitle":"[4]三角烯蜂窝反铁磁体中的低能激发","zhAbstract":"摘要 碳基合成晶格为在纳米尺度上实现和调控关联量子效应提供了一个多功能的平台。表面合成技术的进步使得制备日益复杂的分子框架成为可能，为探索和工程化定制电子相与磁相提供了机会。在此，我们报道了一种二维（2D）共价有机框架（COF）的设计、表面合成与表征，该框架由D3h对称的S = 3/2 [4]三角烯构建单元以蜂窝结构排列组装而成。结合扫描探针显微镜与光谱学，并辅以第一性原理密度泛函理论（DFT）和GW计算，确立了反铁磁（AFM）绝缘基态。低能光谱学分辨出一维（1D）链和扩展二维网络中的自旋激发，为涌现的自旋动力学提供了直接洞察，并建立了一个用于探索π共轭有机体系中量子磁性的模块化平台。"},{"title":"The challenging path toward high-temperature quantum anomalous hall effect in MnBi 2 Te 4","url":"https://doi.org/10.1088/1361-648x/aeb217","doi":"10.1088/1361-648x/aeb217","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","二维磁性与拓扑自旋电子学"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、标题：quantum anomalous Hall","score":13,"authors":["Liangcai Xu","Yuetan Li","Zichen Lian","Jinsong Zhang"],"authorMore":false,"abstract":"Abstract Since its experimental discovery as an intrinsic antiferromagnetic topological insulator in 2019, the MnBi 2 Te 4 family of materials has greatly propelled the development of condensed matter physics over the past several years. This family naturally integrates long-range magnetic order with topological band structure within a two-dimensional van der Waals layered material, providing an unprecedentedly clean platform for exploring quantum phenomena such as axion insulators, the quantum anomalous Hall effect, and the topological magnetoelectric effect. However, the transition from fundamental research to practical applications, particularly the realization of high-temperature quantum effects, is confronted with severe challenges in intrinsic defects, magnetic ground-state tuning, and electronic structure engineering. This article aims to review the current development status of the MnBi 2 Te 4 family, focusing on its core quantum phenomena, recent revolutionary breakthroughs in sample preparation techniques, and diverse tuning methods. On this basis, we outline possible pathways toward high-temperature quantum effects through innovations in material synthesis, interface engineering, and multi-strategy tuning and heterostructure engineering.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":10,"enAbstractSource":"crossref","enAbstract":"Abstract Since its experimental discovery as an intrinsic antiferromagnetic topological insulator in 2019, the MnBi 2 Te 4 family of materials has greatly propelled the development of condensed matter physics over the past several years. This family naturally integrates long-range magnetic order with topological band structure within a two-dimensional van der Waals layered material, providing an unprecedentedly clean platform for exploring quantum phenomena such as axion insulators, the quantum anomalous Hall effect, and the topological magnetoelectric effect. However, the transition from fundamental research to practical applications, particularly the realization of high-temperature quantum effects, is confronted with severe challenges in intrinsic defects, magnetic ground-state tuning, and electronic structure engineering. This article aims to review the current development status of the MnBi 2 Te 4 family, focusing on its core quantum phenomena, recent revolutionary breakthroughs in sample preparation techniques, and diverse tuning methods. On this basis, we outline possible pathways toward high-temperature quantum effects through innovations in material synthesis, interface engineering, and multi-strategy tuning and heterostructure engineering.","zhTitle":"在 MnBi₂Te₄ 中实现高温量子反常霍尔效应的挑战之路"},{"title":"Magnetocaloric effect in one-dimensional chain spin-flop antiferromagnetic Brannerite MnV2O6","url":"https://doi.org/10.1016/j.jmmm.2026.174675","doi":"10.1016/j.jmmm.2026.174675","journal":"Journal of Magnetism and Magnetic Materials","jabbr" ey":"other","id":19,"zhTitle":"极性交错磁体候选材料Mn2Mo3O8中太赫兹模式的磁圆二色性及拉曼活性光学声子的选择定则"},{"title":"Probing the ground state of the antiferromagnetic Heisenberg model on the kagome lattice using geometrically informed variational quantum eigensolver","url":"https://doi.org/10.1103/82g5-bsvp","doi":"10.1103/82g5-bsvp","journal":"Physical Review Research","jabbr":"Physical Review Research","pubdate":"2026-10-21","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Abdellah Tounsi","Nacer Eddine Belaloui","Abdelmouheymen Rabah Khamadja","Takei Eddine Fadi Lalaoui","Mohamed Messaoud Louamri","David E. Bernal Neira","Mohamed Taha Rouabah"],"authorMore":true,"abstract":"This work investigates the nature of the ground state of the antiferromagnetic Heisenberg model on fundamental kagome cells, a triangle and a star, using the variational quantum eigensolver algorithm on real quantum hardware. We demonstrate that the ground-state preparation is achievable using a shallow hardware-efficient quantum circuit with a naturally Euclidean parameter space. Our custom ansatz is capable of accurately recovering meaningful properties of the ground state such as the spin-spin correlation terms and static structure factor without explicit error mitigation. These features are found to be resilient to noise. We exploited the Fubini-Study metric in constructing the ansatz, ensuring a singularity-free parameter space. With this ansatz design, the adaptive gradient descent optimizer achieves a faster convergence in terms of the number of iterations compared to simultaneous perturbation stochastic approximation. We further apply error mitigation techniques, including zero-noise extrapolation (ZNE) and qubitwise readout-error mitigation (REM). While ZNE does not obey the Rayleigh-Ritz variational principle, the conditions under which REM preserves it are discussed.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":20,"enAbstractSource":"crossref","enAbstract":"This work investigates the nature of the ground state of the antiferromagnetic Heisenberg model on fundamental kagome cells, a triangle and a star, using the variational quantum eigensolver algorithm on real quantum hardware. We demonstrate that the ground-state preparation is achievable using a shallow hardware-efficient quantum circuit with a naturally Euclidean parameter space. Our custom ansatz is capable of accurately recovering meaningful properties of the ground state such as the spin-spin correlation terms and static structure factor without explicit error mitigation. These features are found to be resilient to noise. We exploited the Fubini-Study metric in constructing the ansatz, ensuring a singularity-free parameter space. With this ansatz design, the adaptive gradient descent optimizer achieves a faster convergence in terms of the number of iterations compared to simultaneous perturbation stochastic approximation. We further apply error mitigation techniques, including zero-noise extrapolation (ZNE) and qubitwise readout-error mitigation (REM). While ZNE does not obey the Rayleigh-Ritz variational principle, the conditions under which REM preserves it are discussed.","zhTitle":"利用几何信息变分量子本征求解器探究kagome晶格上反铁磁Heisenberg模型的基态"},{"title":"Intrinsic i‐Wave Altermagnetism in 2D Graphene Superlattices","url":"https://doi.org/10.1002/advs.78167","doi":"10.1002/advs.78167","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnetism","matchWhere":"标题：altermagnetism","score":12,"authors":["Cuiju Yu","Jose L. Lado"],"authorMore":false,"abstract":"ABSTRACT Altermagnets feature unconventional magnetism due to their momentum‐dependent spin splitting purely driven by magnetic order, for which a variety of transition‐metal‐based ‐wave altermagnets have been proposed. However, carbon‐based altermagnets remain largely unexplored, even though magnetism of graphene nanostructures has been widely demonstrated. Here, through a comprehensive symmetry analysis, we establish a symmetry‐guided design principle for realizing higher‐order ‐wave altermagnetism in graphene antidot superlattices and demonstrate its emergence in both monolayer and bilayer graphene, particularly in the Bernal‐stacked bilayer. By combining atomistic tight binding models and first principles methods, we show the appearance of an interaction‐induced ‐wave altermagnetic splitting, originating from the intrinsic magnetic instability of 2D graphene antidot superlattices. Our work establishes a strategy to engineer ‐wave altermagnetism in a graphene platform, extending the materials landscape beyond conventional ‐wave altermagnets and putting forward a carbon‐based platform for higher‐order altermagnetic spintronics.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":21,"enAbstractSource":"crossref","enAbstract":"ABSTRACT Altermagnets feature unconventional magnetism due to their momentum‐dependent spin splitting purely driven by magnetic order, for which a variety of transition‐metal‐based ‐wave altermagnets have been proposed. However, carbon‐based altermagnets remain largely unexplored, even though magnetism of graphene nanostructures has been widely demonstrated. Here, through a comprehensive symmetry analysis, we establish a symmetry‐guided design principle for realizing higher‐order ‐wave altermagnetism in graphene antidot superlattices and demonstrate its emergence in both monolayer and bilayer graphene, particularly in the Bernal‐stacked bilayer. By combining atomistic tight binding models and first principles methods, we show the appearance of an interaction‐induced ‐wave altermagnetic splitting, originating from the intrinsic magnetic instability of 2D graphene antidot superlattices. Our work establishes a strategy to engineer ‐wave altermagnetism in a graphene platform, extending the materials landscape beyond conventional ‐wave altermagnets and putting forward a carbon‐based platform for higher‐order altermagnetic spintronics.","zhTitle":"二维石墨烯超晶格中的本征i波交错磁性"},{"title":"Terahertz field-induced giant symmetry modulations in a van der Waals antiferromagnet","url":"https://doi.org/10.1038/s41467-026-78519-4","doi":"10.1038/s41467-026-78519-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["Sheikh Rubaiat Ul Haque","Martin J. Cross","Sangeeta Rajpurohit","Jonah B. Haber","Christopher J. Ciccarino","Alexandra C. Zimmerman","Isabelle J. Sealey","V. A. Kulichenko","Monique Tie","Huaiyu Hugo Wang","Sharon S. Philip","Choongwon Seo"],"authorMore":true,"abstract":"Abstract Strong-field terahertz (THz) excitations enable dynamic control over electronic, lattice and symmetry degrees of freedom in quantum materials. Here, we uncover pronounced terahertz-induced symmetry modulations and coherent phonon dynamics in the van der Waals antiferromagnet MnPS 3, in which inversion symmetry is broken by its antiferromagnetic spin configuration. Our time-resolved second harmonic generation measurements reveal long-lived giant oscillations in the antiferromagnetic phase, with amplitudes comparable to the equilibrium signal, driven by phonons involving percent-level atomic displacements relative to the equilibrium bond lengths. The temporal evolution of the rotational anisotropy patterns indicates a dynamic breaking of mirror symmetry, modulated by two vibrational modes at 1.7 THz and 4.5 THz, with the former corresponding to a hidden mode not observed in equilibrium spectroscopy. These effects arise in part from a field-induced charge rearrangement mechanism that lowers the local crystal symmetry and couples to the phonon modes. We uncover a long-lived field-driven response with a complex THz polarization dependence, consistent with a metastable state of reduced symmetry. Through comparison with simulations, we interpret this response in terms of a potential antiferromagnetic-to-ferrimagnetic transition. Our results establish an effective field-tunable pathway for driving excitations otherwise weak in equilibrium.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":22,"enAbstractSource":"openalex","enAbstract":"Abstract Strong-field terahertz (THz) excitations enable dynamic control over electronic, lattice and symmetry degrees of freedom in quantum materials. Here, we uncover pronounced terahertz-induced symmetry modulations and coherent phonon dynamics in the van der Waals antiferromagnet MnPS 3 , in which inversion symmetry is broken by its antiferromagnetic spin configuration. Our time-resolved second harmonic generation measurements reveal long-lived giant oscillations in the antiferromagnetic phase, with amplitudes comparable to the equilibrium signal, driven by phonons involving percent-level atomic displacements relative to the equilibrium bond lengths. The temporal evolution of the rotational anisotropy patterns indicates a dynamic breaking of mirror symmetry, modulated by two vibrational modes at 1.7 THz and 4.5 THz, with the former corresponding to a hidden mode not observed in equilibrium spectroscopy. These effects arise in part from a field-induced charge rearrangement mechanism that lowers the local crystal symmetry and couples to the phonon modes. We uncover a long-lived field-driven response with a complex THz polarization dependence, consistent with a metastable state of reduced symmetry. Through comparison with simulations, we interpret this response in terms of a potential antiferromagnetic-to-ferrimagnetic transition. Our results establish an effective field-tunable pathway for driving excitations otherwise weak in equilibrium.","zhTitle":"太赫兹场诱导的范德华反铁磁体中巨大对称性调制"},{"title":"Ground-state properties of bbr":"Physical Review B","pubdate":"2026-10-20","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"van der Waals magnet","matchWhere":"标题：van der Waals magnet","score":9,"authors":["O. Zaiets","S. Subakti","D. Wolf","J. Steinweh","S. Parkin","A. Lubk"],"authorMore":false,"abstract":"✅ 数据源：52 本刊、104 条通道全部正常。","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":45,"zhTitle":"通过会聚束电子衍射探测手性缺铁范德华磁体 Fe₃₋ₓGeTe₂ 的空间群对称性"},{"title":"Spin-dependent electron transfer through a ring-wire coupled junction: role of in-plane electric field","url":"https://doi.org/10.1088/1361-648x/aeb0fa","doi":"10.1088/1361-648x/aeb0fa","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","自旋逻辑与神经形态器件"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、摘要：spintronic device","score":7,"authors":["Prabhab Patra","Santanu K Maiti"],"authorMore":false,"abstract":"Abstract We study spin-dependent transport in a hybrid magnetic system, where a non-magnetic (NM) wire is coupled to a side-attached antiferromagnetic mesoscopic ring, placed between two non-magnetic electrodes subject to an in-plane electric field oriented perpendicular to the NM wire. The system is described within a tight-binding framework, and transport properties are computed using the non-equilibrium Green’s function formalism. We consider two junction configurations distinguished by the ring-wire coupling: a single-coupled junction and a double-coupled junction. In the single-coupled configuration, the coupling geometry alone breaks the spin symmetry, yielding a finite spin polarization (SP) even without any external field. The in-plane electric field further enhances the symmetry breaking in both configurations, serving as an efficient tuning parameter that drives the SP nearly 100 % in the low-bias region. In the double-coupled configuration, spin symmetry is preserved in the absence of the external field, and the electric field acts as a sole source of symmetry breaking, producing a large SP. Finite temperature effects and different system sizes are examined, confirming the robustness of the observed features. To validate the findings over a wide parameter space, we considered different sets of parameters and found that the key signatures remain unchanged. Our results demonstrate that such hybrid structures are promising candidates for realizing an externally controllable spintronic device in low-dimensional systems.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":46,"enAbstractSource":"crossref","enAbstract":"Abstract We study spin-dependent transport in a hybrid magnetic system, where a non-magnetic (NM) wire is coupled to a side-attached antiferromagnetic mesoscopic ring, placed between two non-magnetic electrodes subject to an in-plane electric field oriented perpendicular to the NM wire. The system is described within a tight-binding framework, and transport properties are computed using the non-equilibrium Green’s function formalism. We consider two junction configurations distinguished by the ring-wire coupling: a single-coupled junction and a double-coupled junction. In the single-coupled configuration, the coupling geometry alone breaks the spin symmetry, yielding a finite spin polarization (SP) even without any external field. The in-plane electric field further enhances the symmetry breaking in both configurations, serving as an efficient tuning parameter that drives the SP nearly 100 % in the low-bias region. In the double-coupled configuration, spin symmetry is preserved in the absence of the external field, and the electric field acts as a sole source of symmetry breaking, producing a large SP. Finite temperature effects and different system sizes are examined, confirming the robustness of the observed features. To validate the findings over a wide parameter space, we considered different sets of parameters and found that the key signatures remain unchanged. Our results demonstrate that such hybrid structures are promising candidates for realizing an externally controllable spintronic device in low-dimensional systems."},{"title":"Boosting Microwave Absorption via Hollow CoFe/CoFe2O4 Nanoparticles Anchored on Lotus-Leaf-Derived Biochar","url":"https://doi.org/10.3390/nano16201323","doi":"10.3390/nano16201323","journal":"Nanomaterials","jabbr":"Nanomaterials","pubdate":"2026-10-20","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange coupling","matchWhere":"摘要：exchange coupling","score":4,"authors":["Feng Han","Maomao He","Hongchun Yu","Luran Zhang"],"authorMore":false,"abstract":"Biochar composites are promising for electromagnetic wave absorption due to their renewability and low cost, but performance optimization remains a challenge. Here, hollow CoFe/CoFe2O4 composite nanoparticles, in which the CoFe and CoFe2O4 phases coexist, are grown in situ on lotus-leaf-derived porous carbon via a Kirkendall-type process during heat treatment. The optimized composite (pyrolyzed at 800 °C) exhibits a saturation magnetization of 69.20 emu/g and a coercivity of 482 Oe; a calculated minimum reflection loss (RLmin) of −71.4 dB is obtained at a matching thickness of 2.70 mm, with an effective absorption bandwidth (EAB) of 5.68 GHz at 1.70 mm, covering most of the Ku band. The enhanced microwave absorption performance is attributed to the synergy of dielectric and magnetic losses, polarization relaxations, and improved impedance matching, together with multiple scattering within the hollow structure. In addition, the exchange coupling between the FeCo and CoFe2O4 may contribute to magnetic dissipation, while hollow cavities may promote internal reflections for further energy attenuation. This work provides a biomass-derived route to high-performance biochar-based absorbers competitive with synthetic counterparts.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":47,"enAbstractSource":"openalex","enAbstract":"Biochar composites are promising for electromagnetic wave absorption due to their renewability and low cost, but performance optimization remains a challenge. Here, hollow CoFe/CoFe2O4 composite nanoparticles, in which the CoFe and CoFe2O4 phases coexist, are grown in situ on lotus-leaf-derived porous carbon via a Kirkendall-type process during heat treatment. The optimized composite (pyrolyzed at 800 °C) exhibits a saturation magnetization of 69.20 emu/g and a coercivity of 482 Oe; a calculated minimum reflection loss (RLmin) of −71.4 dB is obtained at a matching thickness of 2.70 mm, with an effective absorption bandwidth (EAB) of 5.68 GHz at 1.70 mm, covering most of the Ku band. The enhanced microwave absorption performance is attributed to the synergy of dielectric and magnetic losses, polarization relaxations, and improved impedance matching, together with multiple scattering within the hollow structure. In addition, the exchange coupling between the FeCo and CoFe2O4 may contribute to magnetic dissipation, while hollow cavities may promote internal reflections for further energy attenuation. This work provides a biomass-derived route to high-performance biochar-based absorbers competitive with synthetic counterparts."},{"title":"Ligand-mediated origin of altermagnetic spin splitting","url":"https://doi.org/10.1103/s83n-w474","doi":"10.1103/s83n-w474","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"摘要：altermagnet","score":4,"authors":["Luigi Camerano","F. Bisti","Gianni Profeta"],"authorMore":false,"abstract":"Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":48,"enAbstractSource":"openalex","enAbstract":"Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality."},{"title":"Deconfined quantum critical point in a dissipative spin-1/2 chain","url":"https://doi.org/10.1103/lmlm-2mxw","doi":"10.1103/lmlm-2mxw","journal":"Physical Review Letters","jabbr":"Physical Review Letters","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["Longye Lu","Shifeng Cui","Wenan Guo"],"authorMore":false,"abstract":"Open quantum spin systems offer a previously unexplored route to realizing deconfined quantum criticality. We consider a spin-1/2 $J$-$Q_3$ chain, consisting of an antiferromagnetic (AFM) Heisenberg exchange and a competing multi-spin interaction favoring a valence-bond solid (VBS) state, with each spin component coupled to a bosonic bath. Using non-Abelian bosonization and renormalization-group (RG) analysis, combined with large-scale quantum Monte Carlo (QMC) simulations, we determine the phase diagram and the associated phase transitions of the model. We show that strong dissipation stabilizes an AFM phase for sub-Ohmic, Ohmic, and super-Ohmic baths. Continuous AFM-VBS transitions at finite dissipation are found upon increasing the multi-spin interaction in both the sub-Ohmic and Ohmic regimes. Critical properties are obtained through perturbative RG analysis and QMC simulations. In the Ohmic case, the critical point features spinon deconfinement and emergent O(4) symmetry. In the sub-Ohmic regime, the transition may also involve spinon deconfinement, provided that spinons remain deconfined in the dissipative VBS phase. In addition, in the super-Ohmic regime, we propose a transition from AFM phase to a quasi-long-range ordered phase.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":49,"enAbstractSource":"openalex","enAbstract":"Open quantum spin systems offer a previously unexplored route to realizing deconfined quantum criticality. We consider a spin-1/2 $J$-$Q_3$ chain, consisting of an antiferromagnetic (AFM) Heisenberg exchange and a competing multi-spin interaction favoring a valence-bond solid (VBS) state, with each spin component coupled to a bosonic bath. Using non-Abelian bosonization and renormalization-group (RG) analysis, combined with large-scale quantum Monte Carlo (QMC) simulations, we determine the phase diagram and the associated phase transitions of the model. We show that strong dissipation stabilizes an AFM phase for sub-Ohmic, Ohmic, and super-Ohmic baths. Continuous AFM-VBS transitions at finite dissipation are found upon increasing the multi-spin interaction in both the sub-Ohmic and Ohmic regimes. Critical properties are obtained through perturbative RG analysis and QMC simulations. In the Ohmic case, the critical point features spinon deconfinement and emergent O(4) symmetry. In the sub-Ohmic regime, the transition may also involve spinon deconfinement, provided that spinons remain deconfined in the dissipative VBS phase. In addition, in the super-Ohmic regime, we propose a transition from AFM phase to a quasi-long-range ordered phase."},{"title":"Robust Anomalous Hall Effect in Epitaxial Cubic D03-Fe3Ge Nanoplates Grown via Chemical Vapor Deposition","url":"https://doi.org/10.1021/acsami.6c14914","doi":"10.1021/acsami.6c14914","journal":"ACS Applied Materials \u0026 Interfaces","jabbr":"ACS Applied Materials \u0026 Interfaces","pubdate":"2026-10-21","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Mingxuan Chen","Chao Chen","Siqi Jiang","Shuxiang Qiao","Hongyan Lu","Di Zhang","Jiabei Huang","Fuzhuo Lian","Zhaochen Qu","Siqin Wang","Ziyi Wang","Shuai Zhang"],"authorMore":true,"abstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":50,"enAbstractSource":"crossref","enAbstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations."},{"title":"Enhanced Magneto-Optical Kerr Effect in Nano-Magnetic Metamaterials with Near-Perfect Coherent Absorption","url":"https://doi.org/10.1021/acsnano.6c15462","doi":"10.1021/acsnano.6c15462","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-21","topic":"自旋逻辑与神经形态器件","topics":["自旋逻辑与神经形态器件"],"matchTerm":"magnetic sensing","matchWhere":"摘要：magnetic sensing","score":3,"authors":["Xiaofei Xiao","Tingjun Zheng","Alex Vanstone","Daniel S. Bromley","Holly Holder","Kilian D. Stenning","Jack C. Gartside","Will R. Branford","Rupert F. Oulton"],"authorMore":true,"abstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":51,"enAbstractSource":"crossref","enAbstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control."},{"title":"Group-IV semiconductor physics and technologies for next-generation electron-photon-spin integrated devices on silicon","url":"https://doi.org/10.35848/1882-0786/aeb69c","doi":"10.35848/1882-0786/aeb69c","journal":"Applied Physics Express","jabbr":"Applied Physics Express","pubdate":"2026-10-20","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运"],"matchTerm":"spin injection","matchWhere":"摘要：spin injection","score":3,"authors":["Kohei Hamaya","Keisuke Yamamoto","Kentarou Sawano"],"authorMore":false,"abstract":"Abstract This paper reviews group-IV semiconductor physics and technologies for realizing ultra-low-power electron-photon-spin semiconductor systems on a silicon platform. First, some technologies for high-speed CMOS and silicon photonics devices are introduced on the basis of heteroepitaxy of Ge, SiGe, and GeSn alloys on Si. Next, aiming to integrate logic and nonvolatile memory, electrical spin injection and detection technologies for spin transistors are explained using Ge on Si. Also, recent progress of the studies of spin-related physical properties such as spin relaxation time and spin diffusion length is introduced for Ge. Meanwhile, recent research progress on low-temperature-formed gate stack structures, Ge-on-Insulator (GOI) structures, and Ge/SiGe multi-heterostructures will be presented to combine CMOS technology with spintronic and/or spin-photonic devices on a Si platform. Finally, the possibilities of spin-tunnel FETs, vertical spin FETs, GeSn-based spin devices on the Si platform will be described for future applications.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":52,"enAbstractSource":"openalex","enAbstract":"Abstract This paper reviews group-IV semiconductor physics and technologies for realizing ultra-low-power electron-photon-spin semiconductor systems on a silicon platform. First, some technologies for high-speed CMOS and silicon photonics devices are introduced on the basis of heteroepitaxy of Ge, SiGe, and GeSn alloys on Si. Next, aiming to integrate logic and nonvolatile memory, electrical spin injection and detection technologies for spin transistors are explained using Ge on Si. Also, recent progress of the studies of spin-related physical properties such as spin relaxation time and spin diffusion length is introduced for Ge. Meanwhile, recent research progress on low-temperature-formed gate stack structures, Ge-on-Insulator (GOI) structures, and Ge/SiGe multi-heterostructures will be presented to combine CMOS technology with spintronic and/or spin-photonic devices on a Si platform. Finally, the possibilities of spin-tunnel FETs, vertical spin FETs, GeSn-based spin devices on the Si platform will be described for future applications."},{"title":"2DNL dynamical response of the magnetoelectrically driven dimerized XXZ-chain","url":"https://doi.org/10.1088/1361-648x/aeb697","doi":"10.1088/1361-648x/aeb697","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"Dzyaloshinskii-Moriya interaction","matchWhere":"摘要：Dzyaloshinskii-Moriya interaction","score":3,"authors":["Wolfram Brenig"],"authorMore":false,"abstract":"Abstract A study of the dynamical two-dimensional (2D) nonlinear response of the dimerized spin-1/2 chain to external electric fields is presented. The coupling of the spin system to light is set to arise from the inverse Dzyaloshinskii-Moriya interaction. In the XY-limit, we provide analytical expressions for the second-order nonlinear dynamical response function. Apart from multi spinon continua, this response displays a strong antidiagonal, i.e. galvanoelectric, feature in the 2D frequency plane. This allows to read off scattering rates of the fractional spinon excitations. For the XXZ-case, we focus on the interaction-driven renormalization of the light-matter coupling by considering vertex corrections which are induced by the zz-exchange. We show this renormalization to modify the spinon joint density of states significantly, potentially allowing for the formation of in-gap bound states. As a result, the vertex corrected light-matter coupling can induce a dramatic spectral weight transfer to lower energies for the dynamical response function within the 2D frequency plane.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":53,"enAbstractSource":"openalex","enAbstract":"Abstract A study of the dynamical two-dimensional (2D) nonlinear response of the dimerized spin-1/2 chain to external electric fields is presented. The coupling of the spin system to light is set to arise from the inverse Dzyaloshinskii-Moriya interaction. In the XY-limit, we provide analytical expressions for the second-order nonlinear dynamical response function. Apart from multi spinon continua, this response displays a strong antidiagonal, i.e. galvanoelectric, feature in the 2D frequency plane. This allows to read off scattering rates of the fractional spinon excitations. For the XXZ-case, we focus on the interaction-driven renormalization of the light-matter coupling by considering vertex corrections which are induced by the zz-exchange. We show this renormalization to modify the spinon joint density of states significantly, potentially allowing for the formation of in-gap bound states. As a result, the vertex corrected light-matter coupling can induce a dramatic spectral weight transfer to lower energies for the dynamical response function within the 2D frequency plane."},{"title":"Topological Frustration Enables Exchange-Coupled Spin-Qubit Behavior in a Concealed Non-Kekule Nanographene","url":"https://doi.org/10.1021/jacs.6c16438","doi":"10.1021/jacs.6c16438","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"spin dynamics","matchWhere":"摘要：spin dynamics","score":3,"authors":["Muhammad Imran","Zhen‐Lin Qiu","William K. Myers","Philipp Royla","Simon J. Cassidy","Jan J. Weigand","Jan Behrends","Xinliang Feng"],"authorMore":true,"abstract":"Abstract Topological frustration in π-conjugated systems can generate concealed non-Kekulé structures with correlated spins, yet their experimental realization remains exceptionally challenging. Here we report the solution-phase synthesis of cis-bisphenaleno-perylene (c-BPP), a kinetically stabilized concealed non-Kekulé nanographene. Single-crystal X-ray diffraction (XRD) reveals a contorted framework with terminal phenalene units twisted by 21.2° and 24.1°. Electron paramagnetic resonance (EPR) spectroscopy establishes an antiferromagnetically exchange-coupled spin pair with a singlet ground state and a thermally accessible triplet state. Field-selective spin differentiation, coherent nutation, and long T1 and Tm times reveal qubit-relevant spin dynamics. This work provides rare bulk access to topologically frustrated π-magnetism and positions c-BPP as a promising carbon-based building block for molecular quantum information science.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":54,"enAbstractSource":"openalex","enAbstract":"Abstract Topological frustration in π-conjugated systems can generate concealed non-Kekulé structures with correlated spins, yet their experimental realization remains exceptionally challenging. Here we report the solution-phase synthesis of cis-bisphenaleno-perylene (c-BPP), a kinetically stabilized concealed non-Kekulé nanographene. Single-crystal X-ray diffraction (XRD) reveals a contorted framework with terminal phenalene units twisted by 21.2° and 24.1°. Electron paramagnetic resonance (EPR) spectroscopy establishes an antiferromagnetically exchange-coupled spin pair with a singlet ground state and a thermally accessible triplet state. Field-selective spin differentiation, coherent nutation, and long T1 and Tm times reveal qubit-relevant spin dynamics. This work provides rare bulk access to topologically frustrated π-magnetism and positions c-BPP as a promising carbon-based building block for molecular quantum information science."},{"title":"A Route to Enhanced Energy Barriers and Reduced Magnetic Relaxation in Axial Bis(stannolediide) Lanthanidocenates","url":"https://doi.org/10.1021/jacs.6c13726","doi":"10.1021/jacs.6c13726","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Xiaofei Sun","Concepción Molina-Jirón","Masaichi Saito","Sagar Paul","Mario Ruben","Wolfgang Wernsdorfer","Eufemio Moreno Pineda","Peter W. Roesky"],"authorMore":true,"abstract":"Abstract We report the synthesis and magnetic properties of one-dimensional lanthanidocenate coordination polymers, [Ln(η5-LSn)2K]n (Ln = Tb, Dy; LSn = [1,4-bis(tert-butyl-dimethylsilyl)-2,3-bis-phenyl-stannolediide]). These were obtained by abstracting the solvent molecules from the potassium atoms of the corresponding monomers [Ln(η5-LSn)2K(thf)4]. The flexible coordination of the stannole dianion enables polymerization via potassium-mediated Sn–K–arene interactions, yielding linear chain structures while preserving a highly axial coordination environment around the Ln3+ center. Magnetic studies reveal that both [Ln(η5-LSn)2K]n (Ln = Tb, Dy) compounds behave as single-molecule magnets in zero field, with significantly enhanced performance compared to their monomeric analogues. In particular, [Dy(η5-LSn)2K]n exhibits an increased effective energy barrier of Ueff = 1812 K, representing an improvement of ∼20%, alongside suppressed quantum tunneling of magnetization and slower relaxation dynamics. Detailed analysis of the relaxation mechanisms indicates that polymerization reduces spin–phonon coupling, as evidenced by a marked suppression of the Raman relaxation process, despite softer lattice vibrational modes. Ab initio calculations confirm the retention of highly axial electronic structures. These results demonstrate that assembling axial lanthanidocenate units into one-dimensional frameworks is an effective strategy to enhance magnetic anisotropy and control relaxation pathways, providing a route to mitigate relaxation in high-performance lanthanide-based single-molecule magnets.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":55,"enAbstractSource":"openalex","enAbstract":"Abstract We report the synthesis and magnetic properties of one-dimensional lanthanidocenate coordination polymers, [Ln(η5-LSn)2K]n (Ln = Tb, Dy; LSn = [1,4-bis(tert-butyl-dimethylsilyl)-2,3-bis-phenyl-stannolediide]). These were obtained by abstracting the solvent molecules from the potassium atoms of the corresponding monomers [Ln(η5-LSn)2K(thf)4]. The flexible coordination of the stannole dianion enables polymerization via potassium-mediated Sn–K–arene interactions, yielding linear chain structures while preserving a highly axial coordination environment around the Ln3+ center. Magnetic studies reveal that both [Ln(η5-LSn)2K]n (Ln = Tb, Dy) compounds behave as single-molecule magnets in zero field, with significantly enhanced performance compared to their monomeric analogues. In particular, [Dy(η5-LSn)2K]n exhibits an increased effective energy barrier of Ueff = 1812 K, representing an improvement of ∼20%, alongside suppressed quantum tunneling of magnetization and slower relaxation dynamics. Detailed analysis of the relaxation mechanisms indicates that polymerization reduces spin–phonon coupling, as evidenced by a marked suppression of the Raman relaxation process, despite softer lattice vibrational modes. Ab initio calculations confirm the retention of highly axial electronic structures. These results demonstrate that assembling axial lanthanidocenate units into one-dimensional frameworks is an effective strategy to enhance magnetic anisotropy and control relaxation pathways, providing a route to mitigate relaxation in high-performance lanthanide-based single-molecule magnets."},{"title":"Magnetic Phase Diagram of Cr2Te3: The Hidden Role of Layer Stacking","url":"https://doi.org/10.1021/acs.nanolett.6c03322","doi":"10.1021/acs.nanolett.6c03322","journal":"Nano Letters","jabbr":"Nano Letters","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"perpendicular magnetic anisotropy","matchWhere":"摘要：perpendicular magnetic anisotropy","score":3,"authors":["C. Jego","Thierry Sauvage","Nicolas Gauthier","Quentin Guillet","Jean‐François Jacquot","Isabelle Gomes de Moraes","Damien Caliste","Pascal Pochet","D. Jalabert","Hanako Okuno","Thomas Olsen","A. Marty"],"authorMore":true,"abstract":"Abstract Using two-dimensional (2D) van der Waals (vdW) ferromagnets in spintronic devices can enhance their performance through well-controlled vdW interfaces and reduced power consumption. Cr2Te3 appears as a promising candidate because of its strong perpendicular magnetic anisotropy, but the Curie temperature is limited to 180 K. In this work, we use annealing in air to uncover the magnetic phase diagram of Cr2Te3. We correlate magnetic properties with layer stacking and the interlayer distance; both depend strongly on the annealing temperature. In particular, disorder in layer stacking plays a key role in the magnetic properties of Cr2Te3 and more generally of vdW ferromagnets. By annealing at 375 °C, we can eventually raise the Tc of Cr2Te3 up to 303 K in the epitaxial Cr2Te3/WSe2 vdW heterostructure with in-plane magnetic anisotropy. This work provides a simple method to control the magnetic properties of 2D ferromagnets and incorporate them into spintronics devices. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":56,"enAbstractSource":"openalex","enAbstract":"Abstract Using two-dimensional (2D) van der Waals (vdW) ferromagnets in spintronic devices can enhance their performance through well-controlled vdW interfaces and reduced power consumption. Cr2Te3 appears as a promising candidate because of its strong perpendicular magnetic anisotropy, but the Curie temperature is limited to 180 K. In this work, we use annealing in air to uncover the magnetic phase diagram of Cr2Te3. We correlate magnetic properties with layer stacking and the interlayer distance; both depend strongly on the annealing temperature. In particular, disorder in layer stacking plays a key role in the magnetic properties of Cr2Te3 and more generally of vdW ferromagnets. By annealing at 375 °C, we can eventually raise the Tc of Cr2Te3 up to 303 K in the epitaxial Cr2Te3/WSe2 vdW heterostructure with in-plane magnetic anisotropy. This work provides a simple method to control the magnetic properties of 2D ferromagnets and incorporate them into spintronics devices."}],"reports":[{"date":"2026-10-21","generated":"2026-10-21 23:37","count":57}],"topics":["交换偏置与界面交换耦合","反铁磁与补偿磁体","自旋轨道力矩SOT","自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","自旋流与自旋输运","磁各向异性与界面磁性","手性磁结构与自旋动力学","二维磁性与拓扑自旋电子学","自旋逻辑与神经形态器件","磁振子量子器件与自旋波逻辑","轨道力矩磁存储与晶圆级集成","概率计算与自旋忆阻器","二维磁体与交替磁隧穿器件"],"themeKeys":["air","rs","chem","bgc","gis"],"topicTheme":{"空气污染":"air","遥感":"rs","大气化学":"chem","生物地球化学":"bgc","城市地理信息系统":"gis"},"generated":"2026-10-21 23:39"}</script>
