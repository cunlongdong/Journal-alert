<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自旋电子学文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
/* Journal-alert uniform card grid · paste before the closing CSS tag in jalert/cards.py */
.wall {
  display: grid;
  columns: auto;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 392px;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 1380px) {
  .wall { columns: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .wall { columns: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .wall { columns: auto; grid-template-columns: minmax(0, 1fr); }
}
.card {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  margin: 0;
  min-width: 0;
  break-inside: auto;
}
.cover { flex: 0 0 108px; }
.body {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.title { flex: 0 0 auto; }
.excerpt { flex: 0 0 auto; }
.tagrow {
  flex: 0 0 auto;
  max-height: 48px;
  overflow: hidden;
  margin-top: auto;
}
.foot {
  flex: 0 0 42px;
  min-height: 42px;
  overflow: hidden;
  margin-top: auto;
}

/* JALERT_BILINGUAL_V1: English / Chinese bilingual paper previews */
.bilingual-preview { margin-top: 6px; min-width: 0; }
.bilingual-preview .language { display:block; color:#667085; font-size:10.5px;
  font-weight:750; letter-spacing:.15px; margin-bottom:2px; }
.bilingual-preview .excerpt { display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; margin:0;
  font-size:11.5px; line-height:1.45; color:var(--ink2); }
.bilingual-preview.absent .excerpt { color:var(--ink3); font-style:italic; }
.bilingual-section .sec-t { margin-top:15px; }
.bilingual-section .abs { overflow-wrap:anywhere; }

</style>
</head>

<script type="application/json" id="DATA">{"articles":[{"title":"Spin current generation controlled by the Néel state in a compensated ferrimagnet","url":"https://doi.org/10.1103/52g1-n617","doi":"10.1103/52g1-n617","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","自旋转移力矩与自旋电子存储","自旋流与自旋输运"],"matchTerm":"compensated ferrimagnet","matchWhere":"标题：compensated ferrimagnet、摘要：spintronic memory、标题：spin current","score":24,"authors":["Xing-Hao Lee","Takahiro Misawa","Mamoru Matsuo","Takeo Kato"],"authorMore":false,"abstract":"Compensated ferrimagnets, which break sublattice and time-reversal symmetries in the ground state, exhibit an isotropic ferromagnet-like spin splitting despite a vanishing net magnetization, in contrast to altermagnets with momentum-dependent spin splitting. We investigate how isotropic spin splitting manifests in spin transport by analyzing the spin Seebeck effect and spin pumping in a junction between a compensated ferrimagnet and a normal metal. We show that compensated ferrimagnets generate a sizable spin Seebeck signal, with a sign that can be reversed by switching between the two Néel states. Furthermore, we demonstrate that spin pumping exhibits a Néel-state-dependent resonance …","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":0,"enAbstract":"Compensated ferrimagnets, which break sublattice and time-reversal symmetries in the ground state, exhibit an isotropic ferromagnet-like spin splitting despite a vanishing net magnetization, in contrast to altermagnets with momentum-dependent spin splitting. We investigate how isotropic spin splitting manifests in spin transport by analyzing the spin Seebeck effect and spin pumping in a junction between a compensated ferrimagnet and a normal metal. We show that compensated ferrimagnets generate a sizable spin Seebeck signal, with a sign that can be reversed by switching between the two Néel states. Furthermore, we demonstrate that spin pumping exhibits a Néel-state-dependent resonance splitting, which is absent in conventional antiferromagnets. These results identify spin pumping as a natural readout mechanism for compensated ferrimagnets and establish them as promising magnetization-free building blocks for spintronic memory devices.","zhAbstract":"补偿亚铁磁体在基态下打破亚晶格对称性和时间反演对称性，尽管净磁化强度为零，却表现出类似各向同性铁磁体的自旋劈裂，这与具有动量依赖自旋劈裂的交变磁体形成对比。我们通过分析补偿亚铁磁体与普通金属之间结中的自旋塞贝克效应和自旋泵浦，研究各向同性自旋劈裂如何在自旋输运中体现。我们表明，补偿亚铁磁体产生可观的自旋塞贝克信号，其符号可通过在两个奈尔态之间切换而反转。此外，我们证明自旋泵浦表现出依赖于奈尔态的共振劈裂，这在常规反铁磁体中不存在。这些结果将自旋泵浦确定为补偿亚铁磁体的一种自然读出机制，并确立其作为自旋电子学存储器件中有前景的无磁化构建单元的地位。"},{"title":"Generic skyrmion phase diagram in ferrimagnetic films","url":"https://doi.org/10.1103/627p-l6zk","doi":"10.1103/627p-l6zk","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic、标题：skyrmion","score":21,"authors":["M. V. Wijethunga","X. R. Wang"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":1},{"title":"Neel-vector-orientation induced direction-robust spin filtering in two-dimensional altermagnets","url":"https://doi.org/10.1103/nyd5-ddcb","doi":"10.1103/nyd5-ddcb","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","磁隧道结与磁电阻","磁各向异性与界面磁性"],"matchTerm":"antiferromagnet","matchWhere":"摘要：antiferromagnet、标题：spin filtering、摘要：magnetic anisotropy","score":16,"authors":["Xin Chen","Zou Jin","Lipeng Song","Wei Sun","Yiwen Wu","Luyao Zhu"],"authorMore":false,"abstract":"Whether an antiferromagnet can host direction-robust spin-polarized transport without a conventional spin-selective band gap remains a central challenge in antiferromagnetic spintronics. Here we establish a gapless, direction-robust spin-filtering mechanism in a compensated two-dimensional altermagnetic Weyl semimetal that requires neither a spin-selective band gap nor a large velocity contrast between spin projections. Using Janus monolayer Ta$_2$TeSeO as a realistic platform, we combine symmetry analysis with first-principles calculations, full-Brillouin-zone Wannier interpolation, and semiclassical transport. Rotating the Néel vector removes a unitary-mirror constraint and shifts one …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":2,"enAbstract":"Whether an antiferromagnet can host direction-robust spin-polarized transport without a conventional spin-selective band gap remains a central challenge in antiferromagnetic spintronics. Here we establish a gapless, direction-robust spin-filtering mechanism in a compensated two-dimensional altermagnetic Weyl semimetal that requires neither a spin-selective band gap nor a large velocity contrast between spin projections. Using Janus monolayer Ta$_2$TeSeO as a realistic platform, we combine symmetry analysis with first-principles calculations, full-Brillouin-zone Wannier interpolation, and semiclassical transport. Rotating the Néel vector removes a unitary-mirror constraint and shifts one Weyl-cone pair away from its parent high-symmetry line. For an in-plane Néel vector, the residual $C_{2z}\\mathcal T$ symmetry forbids the independent $σ_y$ mass that would open a local gap, allowing the reconstructed cones to shift in momentum while remaining gapless. Breaking unitary $C_{2z}$ simultaneously lifts the energy equivalence of the remaining mirror-pinned Weyl cones. The resulting coexistence of a metallic spin-projected manifold and a low-DOS Weyl-derived manifold produces a predominantly DOS-driven conductance imbalance. At charge neutrality and 20~K, the longitudinal conductivity polarization for $\\mathbf n\\parallel x$ remains positive for every in-plane current direction and ranges from $76.4\\%$ to $82.0\\%$. The degenerate in-plane magnetic anisotropy facilitates reversible switching between symmetry-related spin-filtering states using strain or weak anisotropic fields. This Néel-vector-driven symmetry mechanism provides a general route to direction-robust gapless spin filtering in compensated altermagnets.","zhAbstract":"反铁磁体能否在没有传统自旋选择性带隙的情况下实现方向鲁棒的自旋极化输运，仍然反铁磁自旋电子学中的一个核心挑战。在此，我们在一种补偿型二维交错磁Weyl半金属中建立了一种无带隙、方向鲁棒的自旋过滤机制，该机制既不需要自旋选择性带隙，也不需要自旋投影之间的大速度对比。以Janus单层Ta$_2$TeSeO作为现实平台，我们将对称性分析与第一性原理计算、全布里渊区Wannier插值和半经典输运相结合。旋转Néel矢量会移除一个酉镜面约束，并使一对Weyl锥偏离其母高对称线。对于面内Néel矢量，残余的$C_{2z}\\mathcal T$对称性禁止了会打开局域带隙的独立$σ_y$质量，使得重构后的锥在动量中移动同时保持无带隙。破坏酉$C_{2z}$同时解除了剩余镜面钉扎Weyl锥的能量等价性。由此产生的金属性自旋投影流形与低DOS的Weyl衍生流形的共存，产生了以DOS为主导的电导不平衡。在电荷中性和20~K下，对于$\\mathbf n\\parallel x$，纵向电导极化对于每个面内电流方向都保持为正，范围从$76.4\\%$到$82.0\\%$。简并的面内磁各向异性促进了利用应变或弱各向异性场在对称性相关的自旋过滤态之间进行可逆切换。这种Néel矢量驱动的对称性机制为补偿型交错磁体中的方向鲁棒无带隙自旋过滤提供了一条通用途径。"},{"title":"Strain-induced enhanced room-temperature magnetization in epitaxial Mn3Sn thin films for antiferromagnetic spintronics","url":"https://doi.org/10.1016/j.jallcom.2026.191741","doi":"10.1016/j.jallcom.2026.191741","journal":"Journal of Alloys and Compounds","jabbr":"Journal of Alloys and Compounds","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Subhankar Das","Sriram Kasilingam","Ajoy Dinda","Bilal Jamshed","Biswanath Pramanik","Subrata Biswas"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":3},{"title":"Surface-enhanced anomalous Hall conductivity in ferrimagnetic Mn2PtSn Heusler alloy","url":"https://doi.org/10.1016/j.jmmm.2026.174616","doi":"10.1016/j.jmmm.2026.174616","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["Sadikul Alom","Bhargab Kak ["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["Koushik Chakraborty","Aditi Agrawal","Isha","K. M. Ranjith","Anzar Ali","M. Isobe"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":12},{"title":"Atomic-scale spin sensing of a 2D d-wave altermagnet via helical tunneling","url":"https://doi.org/10.1038/s41586-026-11257-1","doi":"10.1038/s41586-026-11257-1","journal":"Nature","jabbr":"Nature","pubdate":"2026-10-13","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"标题：altermagnet","score":12,"authors":["Zhuying Wang","Shuikang Yu","Xingkai Cheng","Xiaoyu Xiao","Wanru Ma","Yitian Ma"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":13},{"title":"Giant spin-to-charge conversion by tailoring magnetically proximitized topological Dirac semimetal","url":"https://doi.org/10.1103/jg51-9xf7","doi":"10.1103/jg51-9xf7","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运","磁各向异性与界面磁性"],"matchTerm":"spin-to-charge conversion","matchWhere":"标题：spin-to-charge conversion、摘要：magnetic proximity effect","score":12,"authors":["Masayuki Ishida","Soichiro Fukuoka","Takahiro Chiba","Yohei Kota","Masaaki Tanaka","Lê Đức Anh"],"authorMore":false,"abstract":"While ferromagnet and topological material bilayers are widely studied to obtain efficient spin charge conversion via topological surface states (TSS), the influence of the magnetic proximity effect (MPE) on the TSS evolution and conversion efficiency remains poorly understood. In this study, we experimentally probe and reveal the behavior of spin momentum locked TSS through spin pumping measurements in heterostructures composed of ferromagnetic Fe and the topological Dirac semimetal alpha Sn. As the alpha Sn thickness (tSn) increases from 9 to 35 nm, the Gilbert damping constant of the Fe layer exhibits a pronounced peak at tSn = 25 nm, followed by a decrease at greater thicknesses. Our …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":14,"enAbstract":"While ferromagnet and topological material bilayers are widely studied to obtain efficient spin charge conversion via topological surface states (TSS), the influence of the magnetic proximity effect (MPE) on the TSS evolution and conversion efficiency remains poorly understood. In this study, we experimentally probe and reveal the behavior of spin momentum locked TSS through spin pumping measurements in heterostructures composed of ferromagnetic Fe and the topological Dirac semimetal alpha Sn. As the alpha Sn thickness (tSn) increases from 9 to 35 nm, the Gilbert damping constant of the Fe layer exhibits a pronounced peak at tSn = 25 nm, followed by a decrease at greater thicknesses. Our rigorous theoretical analysis, combining analytical modeling and first principles calculations, attributes this behavior to the TSS disappearance at the Fe and alpha Sn interface and exchange gap opening on the opposite surface, both induced by the long range MPE and its influence on the spin charge conversion efficiency. At tSn = 25 nm, we demonstrate highly efficient spin charge conversion with an inverse Edelstein length of 3.14 nm, the highest value reported at room temperature for ferromagnet and topological material bilayers. These findings underscore the critical role of tuning TSS properties under MPE for advancing topological materials in spintronic applications.","zhAbstract":"尽管铁磁体与拓扑材料双层结构已被广泛研究以通过拓扑表面态（TSS）获得高效的自旋-电荷转换，但磁邻近效应（MPE）对TSS演化及转换效率的影响仍知之甚少。在本研究中，我们通过自旋泵浦测量，在由铁磁Fe与拓扑狄拉克半金属α-Sn组成的异质结构中实验探测并揭示了自旋动量锁定的TSS的行为。随着α-Sn厚度（tSn）从9 nm增加至35 nm，Fe层的吉尔伯特阻尼常数在tSn = 25 nm处呈现显著峰值，随后在更大厚度处下降。我们结合解析建模与第一性原理计算的严格理论分析，将这一行为归因于Fe与α-Sn界面处TSS的消失以及相对表面上交换能隙的打开，二者均由长程MPE及其对自旋-电荷转换效率的影响所诱导。在tSn = 25 nm处，我们展示了高效的自旋-电荷转换，其逆Edelstein长度为3.14 nm，这是铁磁体与拓扑材料双层结构在室温下所报道的最高值。这些发现凸显了在MPE下调控TSS性质对于推进拓扑材料在自旋电子学应用中发展的关键作用。"},{"title":"The magnetic immunity of perpendicular STT-MRAM","url":"https://doi.org/10.1016/j.jmmm.2026.174570","doi":"10.1016/j.jmmm.2026.174570","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"自旋转移力矩与自旋电子存储","topics":["自旋转移力矩与自旋电子存储"],"matchTerm":"STT-MRAM","matchWhere":"标题：STT-MRAM","score":9,"authors":["Zhengren Yan","Pengqi Lu","Yuyan Chu","Yizhou Liu","Haifeng Du","Shikun He"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":15},{"title":"Impact of He+ ion irradiation on the domain wall dynamics in Pd/Co/Pd trilayers with perpendicular magnetic anisotropy","url":"https://doi.org/10.1016/j.jmmm.2026.174543","doi":"10.1016/j.jmmm.2026.174543","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"perpendicular magnetic anisotropy","matchWhere":"标题：perpendicular magnetic anisotropy","score":9,"authors":["Anurag Keloth","Sakshath Sadashivaiah","Parswajit Kalita","Rakhul Raj","V. Raghavendra Reddy","Bikram Das"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":16},{"title":"Emergence of multiple metastable Skyrmion states induced by strong grain-boundary pinning","url":"https://doi.org/10.1016/j.jmmm.2026.174629","doi":"10.1016/j.jmmm.2026.174629","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Terumitsu Tanaka","Budi Purnama"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":17},{"title":"Designer quantum states in magnetic topological insulator multilayers","url":"https://doi.org/10.1016/j.jmmm.2026.174589","doi":"10.1016/j.jmmm.2026.174589","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"magnetic topological insulator","matchWhere":"标题：magnetic topological insulator","score":9,"authors":["Deyi Zhuo","Han Tay","Cui-Zu Chang"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":18},{"title":"Skyrmion Bubbles by Design in a Centrosymmetric Kagome Magnet","url":"https://doi.org/10.1002/advs.78269","doi":"10.1002/advs.78269","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Mohamed El Gazzah","Fehmi Sami Yasin","Sk Jamaluddin","Hari Bhandari","Resham Babu Regmi","Xiuzhen Yu"],"authorMore":false,"abstract":"ABSTRACT Topologically protected nanoscale spin textures, such as magnetic skyrmions, have attracted significant interest for spintronics applications. While skyrmions in noncentrosymmetric materials are known to be stabilized by the Dzyaloshinskii‐Moriya interaction (DMI), their deliberate design in centrosymmetric materials remains a challenge. This difficulty largely stems from the complexity of controlling magnetocrystalline anisotropy–a critical factor in the absence of DMI. Here, we demonstrate the chemical tuning of magnetocrystalline anisotropy in the centrosymmetric Kagome magnet. The resulting compound exhibits a spin reorientation transition accompanied by an emergent skyrmion …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":19,"enAbstract":"ABSTRACT Topologically protected nanoscale spin textures, such as magnetic skyrmions, have attracted significant interest for spintronics applications. While skyrmions in noncentrosymmetric materials are known to be stabilized by the Dzyaloshinskii‐Moriya interaction (DMI), their deliberate design in centrosymmetric materials remains a challenge. This difficulty largely stems from the complexity of controlling magnetocrystalline anisotropy–a critical factor in the absence of DMI. Here, we demonstrate the chemical tuning of magnetocrystalline anisotropy in the centrosymmetric Kagome magnet . The resulting compound exhibits a spin reorientation transition accompanied by an emergent skyrmion bubble lattice, confirmed by cryogenic Lorentz transmission electron microscopy and cryogenic Lorentz differential phase contrast scanning transmission electron microscopy. Our findings overcome a key materials design challenge and open possibilities for deliberate design of skyrmionic textures in centrosymmetric systems.","zhAbstract":"摘要 拓扑保护的纳米尺度自旋结构，例如磁性斯格明子，因其在自旋电子学应用中的潜力而引起了广泛关注。虽然已知非中心对称材料中的斯格明子可由Dzyaloshinskii-Moriya相互作用（DMI）稳定，但在中心对称材料中有意设计斯格明子仍然是一个挑战。这一困难很大程度上源于控制磁晶各向异性的复杂性——在缺乏DMI的情况下，磁晶各向异性是一个关键因素。在此，我们展示了在中心对称Kagome磁体中对磁晶各向异性的化学调控。所得化合物表现出自旋重取向转变，并伴随出现斯格明子气泡晶格，这通过低温洛伦兹透射电子显微镜和低温洛伦兹微分相位衬度扫描透射电子显微镜得到确认。我们的发现克服了一个关键的材料设计挑战，并为在中心对称体系中有意设计斯格明子织构开辟了可能性。"},{"title":"Si 29 nuclear spin diffusion effects on the electron spin resonance spectrum in silicon: Low temperature and high magnetic field regime","url":"https://doi.org/10.1103/417j-6hyz","doi":"10.1103/417j-6hyz","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运"],"matchTerm":"spin diffusion","matchWhere":"标题：spin diffusion","score":9,"authors":["V. A. Grabar","M. B. Lifshits","N. S. Averkiev"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":20},{"title":"Skyrmion and meron phases induced by spin-phonon coupling","url":"https://doi.org/10.1103/trdd-j3wy","doi":"10.1103/trdd-j3wy","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["E. Iroulart","F. A. Gómez Albarracín","H. Diego Rosales"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":21,"enAbstract":"In chiral magnets, magnetic skyrmions are typically stabilized by the competition between exchange and Dzyaloshinskii-Moriya (DM) interactions under an external magnetic field, while the role of lattice degrees of freedom has received comparatively less attention. Here we study how spin-phonon (SP) coupling modifies magnetic interactions and the resulting spin textures in a two-dimensional skyrmion model in the square lattice. Using Monte Carlo simulations, we compare two simplified models describing the SP coupling: the Einstein site-phonon (ESP) and bond-phonon (BP) models. Integrating the lattice degrees of freedom, we obtain effective Hamiltonians for each SP model, which involve three-spin interactions and quadratic terms. In both cases, skyrmion crystals are stabilized in field regimes that are topologically trivial in the uncoupled model. Moreover, in certain regimes, the conventional triple-$\\qv$ hexagonal skyrmion lattice is distorted into a double-$\\qv$ square skyrmion lattice. Additionally, we find that, in the ESP model, strong phonon coupling affecting the exchange interactions drives the system from typical low-field helical phases to meron-antimeron crystals with no net chirality. Overall, our results show that lattice effects provide a simple mechanism to tune a wide variety of topological magnetic phases, ranging from typical skyrmion crystals to distorted arrangements of skyrmions, elongated bimerons and meron-antimeron phases.","zhAbstract":"在手性磁体中，磁性斯格明子通常由交换相互作用与Dzyaloshinskii-Moriya（DM）相互作用在外加磁场下的竞争所稳定，而晶格自由度的作用则相对受到较少关注。本文研究自旋-声子（SP）耦合如何改变二维正方晶格斯格明子模型中的磁性相互作用及由此产生的自旋织构。利用蒙特卡罗模拟，我们比较了描述SP耦合的两种简化模型：爱因斯坦格点声子（ESP）模型和键声子（BP）模型。通过积分晶格自由度，我们得到了每种SP模型的有效哈密顿量，其中包含三自旋相互作用和二次项。在两种情况下，斯格明子晶体均在未耦合模型中拓扑平庸的场区间内被稳定。此外，在某些区间内，传统的三$\\qv$六角斯格明子晶格被畸变为双$\\qv$方形斯格明子晶格。另外，我们发现，在ESP模型中，影响交换相互作用的强声子耦合驱动系统从典型的低场螺旋相转变为无净手性的半子-反半子晶体。总体而言，我们的结果表明，晶格效应提供了一种简单的机制来调控多种拓扑磁相，从典型的斯格明子晶体到畸变的斯格明子排列、拉长的双半子和半子-反半子相。"},{"title":"Magnon band structure and topology in a periodically deformed kagome lattice with Dzyaloshinskii-Moriya interaction","url":"https://doi.org/10.1103/k8rg-69rv","doi":"10.1103/k8rg-69rv","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-14","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"Dzyaloshinskii-Moriya interaction","matchWhere":"标题：Dzyaloshinskii-Moriya interaction","score":9,"authors":["Mohammed Abdullah Hammadi","Mohammed Salman Alsadah","Husam Abdulmajeed Noorwli","H. Bahlouli","Michael Rudolf Vogl"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":22},{"title":"Dynamic control of random telegraph noise in magnetic tunnel junctions","url":"https://doi.org/10.1103/knc8-vshx","doi":"10.1103/knc8-vshx","journal":"Physical Review Applied","jabbr":"Physical Review Applied","pubdate":"2026-10-08","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻"],"matchTerm":"magnetic tunnel junctions","matchWhere":"标题：magnetic tunnel junctions","score":9,"authors":["Mehrdad Elyasi","Shun Kanai","Hideo Ohno","Shunsuke Fukami","Gerrit E. W. Bauer"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":23},{"title":"Dynamical instability in a Floquet-driven dissipative system","url":"https://doi.org/10.1103/251l-jnp3","doi":"10.1103/251l-jnp3","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、摘要：magnon","score":7,"authors":["Takuya Okugawa","Jens Paaske","Martin Eckstein","Michael A. Sentef","Angel Rubio","Andrew J. Millis"],"authorMore":false,"abstract":"We analyse the magnon spectrum and distribution function of the antiferromagnetic phase of the Floquet-driven Hubbard model. Above a critical drive strength, we find a dynamical instability, resulting from a change in sign of the magnon damping at a non-zero wavevector. The change in sign means that infinitesimal fluctuations grow with time, corresponding to an instability of the driven state. Implications for the nonequilibrium distribution function and the strong drive nonlinear dynamics are discussed.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":24,"enAbstract":"We analyse the magnon spectrum and distribution function of the antiferromagnetic phase of the Floquet-driven Hubbard model. Above a critical drive strength, we find a dynamical instability, resulting from a change in sign of the magnon damping at a non-zero wavevector. The change in sign means that infinitesimal fluctuations grow with time, corresponding to an instability of the driven state. Implications for the nonequilibrium distribution function and the strong drive nonlinear dynamics are discussed.","zhAbstract":"我们分析了Floquet驱动Hubbard模型反铁磁相的磁振子谱和分布函数。在临界驱动强度以上，我们发现了一种动力学不稳定性，其源于在非零波矢处磁振子阻尼的符号变化。符号变化意味着无穷小涨落随时间增长，对应于驱动态的不稳定性。讨论了对非平衡分布函数以及强驱动非线性动力学的影响。"},{"title":"Ligand-mediated origin of altermagnetic spin splitting","url":"https://doi.org/10.1103/s83n-w474","doi":"10.1103/s83n-w474","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"摘要：altermagnet","score":4,"authors":["Luigi Camerano","F. Bisti","Gianni Profeta"],"authorMore":false,"abstract":"Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":25},{"title":"Deconfined quantum critical point in a dissipative spin-1/2 chain","url":"https://doi.org/10.1103/lmlm-2mxw","doi":"10.1103/lmlm-2mxw","journal":"Physical Review Letters","jabbr":"Physical Review Letters","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["Longye Lu","Shifeng Cui","Wenan Guo"],"authorMore":false,"abstract":"Open quantum spin systems offer a previously unexplored route to realizing deconfined quantum criticality. We consider a spin-1/2 $J$-$Q_3$ chain, consisting of an antiferromagnetic (AFM) Heisenberg exchange and a competing multi-spin interaction favoring a valence-bond solid (VBS) state, with each spin component coupled to a bosonic bath. Using non-Abelian bosonization and renormalization-group (RG) analysis, combined with large-scale quantum Monte Carlo (QMC) simulations, we determine the phase diagram and the associated phase transitions of the model. We show that strong dissipation stabilizes an AFM phase for sub-Ohmic, Ohmic, and super-Ohmic baths. Continuous AFM-VBS transitions at finite dissipation are found upon increasing the multi-spin interaction in both the sub-Ohmic and Ohmic regimes. Critical properties are obtained through perturbative RG analysis and QMC simulations. In the Ohmic case, the critical point features spinon deconfinement and emergent O(4) symmetry. In the sub-Ohmic regime, the transition may also involve spinon deconfinement, provided that spinons remain deconfined in the dissipative VBS phase. In addition, in the super-Ohmic regime, we propose a transition from AFM phase to a quasi-long-range ordered phase.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":26},{"title":"Giant Baromagnetic Effect Induced by Spin Engineering in Mn3(Zn0.25Sn0.25Ga0.25Ge0.25)C","url":"https://doi.org/10.1021/jacs.6c13327","doi":"10.1021/jacs.6c13327","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-14","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["Jiechen Luo","Wentao Wu","Ao Qiu","Bing Wang","Xiuliang YUAN","Shihai An"],"authorMore":false,"abstract":"Abstract Baromagnetic effect (BME), arising from pressure-induced spin reorientation, holds great potential for next-generation information technologies owing to its strong multifield coupling characteristics. However, the practical implementation of BME is hindered by the small magnetization change and the large driving pressure required in conventional materials. Guided by spin-polarized calculations, this work successfully obtains a giant BME material Mn3(Zn0.25Sn0.25Ga0.25Ge0.25)C, which exhibits a remarkable pressure-induced maximum magnetization change (|ΔMmax|) of 2.63 μB·f.u.–1 and an exceptionally large baromagnetic coefficient (BMC, d) of 15.0 μB·f.u.–1·GPa–1. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":27,"enAbstract":"Abstract Baromagnetic effect (BME), arising from pressure-induced spin reorientation, holds great potential for next-generation information technologies owing to its strong multifield coupling characteristics. However, the practical implementation of BME is hindered by the small magnetization change and the large driving pressure required in conventional materials. Guided by spin-polarized calculations, this work successfully obtains a giant BME material Mn3(Zn0.25Sn0.25Ga0.25Ge0.25)C, which exhibits a remarkable pressure-induced maximum magnetization change (|ΔMmax|) of 2.63 μB·f.u.–1 and an exceptionally large baromagnetic coefficient (BMC, d) of 15.0 μB·f.u.–1·GPa–1. Temperature-dependent neutron powder diffraction (NPD) measurements reveal a clear evolution from the nearly collinear antiferromagnetic (cAFM) configuration with k = (1/2, 1/2, 1/2) to the ferromagnetic (FM) configuration, indicating that the spins are highly susceptible to reorientation under external perturbations. First-principles calculations further clarify that pressure modulates the energy difference (ΔE) between the cAFM and FM configurations via the Ruderman-Kittel-Kasuya-Yosida (RKKY) interaction, elucidating the microscopic origin of the giant BME. This demonstration establishes spin engineering, achieved through precise control of spin configurations via targeted element selection, as an effective strategy for realizing high-performance baromagnetic systems. It further provides clear guidance for designing materials with superior functional properties.","zhAbstract":"摘要 压磁效应（BME）源于压力诱导的自旋重取向，由于其强多场耦合特性，在下一代信息技术中具有巨大潜力。然而，BME的实际应用受到传统材料中磁化变化小和驱动压力大的阻碍。在自旋极化计算的指导下，本工作成功获得了一种巨压磁效应材料Mn3(Zn0.25Sn0.25Ga0.25Ge0.25)C，其表现出显著的压力诱导最大磁化变化（|ΔMmax|）为2.63 μB·f.u.–1以及异常大的压磁系数（BMC，d）为15.0 μB·f.u.–1·GPa–1。温度依赖的中子粉末衍射（NPD）测量揭示了从k = (1/2, 1/2, 1/2)的近共线反铁磁（cAFM）构型到铁磁（FM）构型的清晰演化，表明自旋在外部扰动下极易发生重取向。第一性原理计算进一步阐明，压力通过Ruderman-Kittel-Kasuya-Yosida（RKKY）相互作用调制cAFM与FM构型之间的能量差（ΔE），阐明了巨BME的微观起源。该演示确立了通过靶向元素选择精确控制自旋构型实现的自旋工程，作为实现高性能压磁系统的有效策略。它进一步为设计具有优越功能特性的材料提供了明确指导。"},{"title":"Finite-momentum superconductivity with singlet-triplet mixing in an altermagnetic metal: A pairing instability analysis","url":"https://doi.org/10.1103/f3fm-bgzz","doi":"10.1103/f3fm-bgzz","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnetism","matchWhere":"摘要：altermagnetism","score":4,"authors":["Hui Hu","Zhao Liu","Jia Wang","Xia-Ji Liu","Yoji Ohashi"],"authorMore":false,"abstract":"We analyze the pairing instability of an altermagnetic metal on a square lattice driven by an attractive nearest-neighbor interaction. This interaction enables multiple pairing channels, including even-parity extended $s$-wave and $d$-wave states, as well as two odd-parity $p$-wave channels. We verify that altermagnetic spin-splitting in the single-particle dispersion gives rise to finite-momentum pairing between electrons with unlike spins, in agreement with earlier predictions. Quite unexpectedly, this pairing typically emerges across multiple channels with mixed parity. Consequently, the resulting finite-momentum Fulde-Ferrell-Larkin-Ovchinnikov (FFLO) superconducting phase is expected …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":28,"enAbstract":"We analyze the pairing instability of an altermagnetic metal on a square lattice driven by an attractive nearest-neighbor interaction. This interaction enables multiple pairing channels, including even-parity extended $s$-wave and $d$-wave states, as well as two odd-parity $p$-wave channels. We verify that altermagnetic spin-splitting in the single-particle dispersion gives rise to finite-momentum pairing between electrons with unlike spins, in agreement with earlier predictions. Quite unexpectedly, this pairing typically emerges across multiple channels with mixed parity. Consequently, the resulting finite-momentum Fulde-Ferrell-Larkin-Ovchinnikov (FFLO) superconducting phase is expected to exhibit a multi-component order parameter featuring singlet-triplet mixing. We examine several forms of altermagnetism, specifically $d_{xy}$-wave and $d_{x^{2}-y^{2}}$-wave altermagnetic couplings, and present the corresponding phase diagrams. Additionally, we study triplet pairing between electrons with identical spins and find that it always occurs at zero center-of-mass momentum. Although it is unfavorable in the regime of weak altermagnetic coupling and low electron filling, it can dominate the phase diagram when the altermagnetic coupling is sufficiently strong. The influence of on-site attractive interactions on mixed-parity pairing is also explored.","zhAbstract":"我们分析了由吸引性最近邻相互作用驱动的正方晶格交错磁金属的配对不稳定性。该相互作用能够产生多个配对通道，包括偶宇称扩展s波和d波态，以及两个奇宇称p波通道。我们验证了单粒子色散中的交错磁自旋劈裂会导致自旋相反电子之间的有限动量配对，这与先前的预测一致。出乎意料的是，这种配对通常以混合宇称的多个通道出现。因此，所得到的有限动量Fulde-Ferrell-Larkin-Ovchinnikov（FFLO）超导相预计会表现出具有单重态-三重态混合的多分量序参量。我们考察了几种形式的交错磁性，具体为d_{xy}波和d_{x^{2}-y^{2}}波交错磁耦合，并给出了相应的相图。此外，我们研究了自旋相同电子之间的三重态配对，并发现它总是发生在零质心动量处。尽管它在弱交错磁耦合和低电子填充区域不利，但当交错磁耦合足够强时，它可以主导相图。我们还探讨了在位吸引相互作用对混合宇称配对的影响。"},{"title":"Robust Anomalous Hall Effect in Epitaxial Cubic D03-Fe3Ge Nanoplates Grown via Chemical Vapor Deposition","url":"https://doi.org/10.1021/acsami.6c14914","doi":"10.1021/acsami.6c14914","journal":"ACS Applied Materials \u0026 Interfaces","jabbr":"ACS Applied Materials \u0026 Interfaces","pubdate":"2026-10-21","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Mingxuan Chen","Chao Chen","Siqi Jiang","Shuxiang Qiao","Hongyan Lu","Di Zhang"],"authorMore":true,"abstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":29},{"title":"Enhanced Magneto-Optical Kerr Effect in Nano-Magnetic Metamaterials with Near-Perfect Coherent Absorption","url":"https://doi.org/10.1021/acsnano.6c15462","doi":"10.1021/acsnano.6c15462","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-21","topic":"自旋逻辑与神经形态器件","topics":["自旋逻辑与神经形态器件"],"matchTerm":"magnetic sensing","matchWhere":"摘要：magnetic sensing","score":3,"authors":["Xiaofei Xiao","Tingjun Zheng","Alex Vanstone","Daniel S. Bromley","Holly Holder","Kilian D. Stenning"],"authorMore":true,"abstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":30},{"title":"Alternating Magnetic Field‐Enhanced Alkaline Hydrogen Evolution on Co‐Doped Mn 3 O 4","url":"https://doi.org/10.1002/adfm.79032","doi":"10.1002/adfm.79032","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-14","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"spin dynamics","matchWhere":"摘要：spin dynamics","score":3,"authors":["Yaowen Zhang","Rongrong Cui","Yihao Li","Lintao Yang","Hanchi Feng","Ao Wang"],"authorMore":false,"abstract":"ABSTRACT As non‐precious metal catalysts for the hydrogen evolution reaction (HER), the performance of transition metal oxides is limited by electronic‐state tuning from static doping strategies. This work proposes a novel strategy for dynamically regulating the electronic state of catalysts using an alternating magnetic field (AMF). We synthesized a series of Mn x Co 3‐x O 4 catalysts, where Co substitution enriches high‐spin Mn 2+ centers and introduces lattice flexibility. Under a low‐energy AMF, the magnetic moments of high‐spin Mn 2+ undergo forced precession. Through dynamic magneto‐structural coupling within the compliant lattice, this spin dynamics acts as a continuous structural …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":31,"enAbstract":"ABSTRACT As non‐precious metal catalysts for the hydrogen evolution reaction (HER), the performance of transition metal oxides is limited by electronic‐state tuning from static doping strategies. This work proposes a novel strategy for dynamically regulating the electronic state of catalysts using an alternating magnetic field (AMF). We synthesized a series of Mn x Co 3‐x O 4 catalysts, where Co substitution enriches high‐spin Mn 2+ centers and introduces lattice flexibility. Under a low‐energy AMF, the magnetic moments of high‐spin Mn 2+ undergo forced precession. Through dynamic magneto‐structural coupling within the compliant lattice, this spin dynamics acts as a continuous structural perturbation that provides a pathway for dynamic orbital regulation, potentially driven by the lifting of d‐orbital degeneracy. This optimized orbital configuration enables a favorable binding energy with H* intermediates, accelerating the sluggish Volmer step and enhancing HER activity. Under the AMF, the Mn 2.5 Co 0.5 O 4 exhibits a low overpotential of 13 mV at 10 mA cm −2 , outperforming previously reported manganese‐based oxides. This work offers a strategy to dynamically lift d‐orbital degeneracy for efficient water electrolysis.","zhAbstract":"摘要：作为析氢反应（HER）的非贵金属催化剂，过渡金属氧化物的性能受限于静态掺杂策略对电子态的调控。本工作提出了一种利用交变磁场（AMF）动态调控催化剂电子态的新策略。我们合成了一系列Mn x Co 3‐x O 4 催化剂，其中Co取代富集了高自旋Mn 2+ 中心并引入了晶格柔性。在低能AMF下，高自旋Mn 2+ 的磁矩发生受迫进动。通过柔性晶格内的动态磁-结构耦合，这种自旋动力学作为连续的结构扰动，为动态轨道调控提供了途径，其可能由d轨道简并的解除所驱动。这种优化的轨道构型能够与H*中间体形成有利的结合能，加速缓慢的Volmer步骤并增强HER活性。在AMF下，Mn 2.5 Co 0.5 O 4 在10 mA cm −2 下表现出13 mV的低过电位，优于先前报道的锰基氧化物。本工作提供了一种动态解除d轨道简并以实现高效水电解的策略。"},{"title":"Heisenberg-limited metrology from the quantum-quench dynamics of an anisotropic ferromagnet","url":"https://doi.org/10.1103/92jc-nlz8","doi":"10.1103/92jc-nlz8","journal":"Physical Review Research","jabbr":"Physical Review Research","pubdate":"2026-10-14","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"摘要：magnon","score":3,"authors":["Z. M. McIntyre","Ji Zou","Jelena Klinovaja","Daniel Loss"],"authorMore":false,"abstract":"The emerging field of quantum magnonics seeks to understand and harness the quantum properties of magnons—quantized collective spin excitations in magnets. Squeezed magnon states arise naturally as the equilibrium ground states of anisotropic ferromagnets and antiferromagnets, representing an important class of nonclassical magnon states. In this work, we show how a qubit-conditioned quantum quench of an anisotropic ferromagnet can be used for Heisenberg-limited parameter estimation based on measurements of the qubit only. In the presence of ground-state squeezing, the protocol yields information about the eigenmode frequency of the coupled magnon-qubit system, whereas no information is …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":32,"enAbstract":"The emerging field of quantum magnonics seeks to understand and harness the quantum properties of magnons—quantized collective spin excitations in magnets. Squeezed magnon states arise naturally as the equilibrium ground states of anisotropic ferromagnets and antiferromagnets, representing an important class of nonclassical magnon states. In this work, we show how a qubit-conditioned quantum quench of an anisotropic ferromagnet can be used for Heisenberg-limited parameter estimation based on measurements of the qubit only. In the presence of ground-state squeezing, the protocol yields information about the eigenmode frequency of the coupled magnon-qubit system, whereas no information is gained in the absence of such squeezing. The protocol therefore leverages genuine quantum correlations in the form of magnonic squeezing while simultaneously relying on the equilibrium character of this squeezing—a feature distinctive to magnetic systems.","zhAbstract":"新兴的量子磁振子学领域旨在理解和利用磁振子的量子特性——磁振子是磁体中量子化的集体自旋激发。压缩磁振子态作为各向异性铁磁体和反铁磁体的平衡基态自然出现，代表了一类重要的非经典磁振子态。在本工作中，我们展示了如何利用各向异性铁磁体的量子比特条件化量子淬火，仅基于对量子比特的测量来实现海森堡极限的参数估计。在存在基态压缩的情况下，该协议可获得关于耦合磁振子-量子比特系统本征模频率的信息，而在不存在这种压缩时则无法获得任何信息。因此，该协议利用了磁振子压缩形式的真正量子关联，同时依赖于这种压缩的平衡特性——这是磁性系统所独有的特征。"},{"title":"Fourier-Space Approach to Physics-Informed Magnetization Reconstruction from Nitrogen-Vacancy Measurements","url":"https://doi.org/10.1103/nc5g-3yw9","doi":"10.1103/nc5g-3yw9","journal":"Physical Review Letters","jabbr":"Physical Review Letters","pubdate":"2026-10-14","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"van der Waals ferromagnet","matchWhere":"摘要：van der Waals ferromagnet","score":3,"authors":["Alexander Setescak","Florian Bruckner","Dieter Suess","Young-Gwan Choi","Hayden Binger","Lotte Boer"],"authorMore":true,"abstract":"Reconstructing magnetization textures from nitrogen-vacancy (NV) magnetometry stray-field measurements is a challenging, fundamentally ill-posed inverse problem, further complicated by the unknown effective distance between sensor and magnetic material. Here we show that incorporating a micromagnetic energy functional directly into the inversion filters out unphysical, high-energy configurations, while Fourier-space upward continuation of the stray field allows us to simultaneously fit the distance. Applied to measurements of the van der Waals ferromagnet Fe 3 − x GaTe 2, it recovers an effective distance estimate of approximately 81 n m and low-energy configurations that reproduce the … ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":33,"enAbstract":"Reconstructing magnetization textures from nitrogen-vacancy (NV) magnetometry stray-field measurements is a challenging, fundamentally ill-posed inverse problem, further complicated by the unknown effective distance between sensor and magnetic material. Here we show that incorporating a micromagnetic energy functional directly into the inversion filters out unphysical, high-energy configurations, while Fourier-space upward continuation of the stray field allows us to simultaneously fit the distance. Applied to measurements of the van der Waals ferromagnet Fe 3 − x GaTe 2 , it recovers an effective distance estimate of approximately 81 n m and low-energy configurations that reproduce the observed field. More broadly, embedding physics directly into the reconstruction turns ill-posed magnetic inverse problems into transparent, interpretable reconstructions, with applicability well beyond NV magnetometry.","zhAbstract":"从氮-空位（NV）磁强计杂散场测量中重建磁化织构是一个具有挑战性且本质不适定的逆问题，而传感器与磁性材料之间未知的有效距离进一步增加了其复杂性。在此，我们表明，将微磁能量泛函直接引入反演过程可滤除非物理的高能构型，同时杂散场的傅里叶空间向上延拓使我们能够同时拟合距离。将该方法应用于范德华铁磁体Fe 3 − x GaTe 2 的测量，可恢复约81 n m的有效距离估计以及能够重现观测场的低能构型。更广泛地说，将物理直接嵌入重建过程，可将不适定磁逆问题转化为透明、可解释的重建，其适用性远超NV磁强计。"},{"title":"Thermomagnonic torques in insulating altermagnets","url":"https://doi.org/10.1103/918g-3q7f","doi":"10.1103/918g-3q7f","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"摘要：skyrmion","score":3,"authors":["Edward Schwartz","Hamed Vakili","A. A. Kovalev"],"authorMore":false,"abstract":"We develop a symmetry-controlled theory of anisotropic thermomagnonic torques in insulating altermagnets. We identify a spin-splitter magnonic torque linked to thermally generated, sublattice-odd spin currents and an anisotropic entropic torque dictated by crystal symmetry. These torques produce anisotropic magnetic-texture responses to temperature gradients. In particular, thermally generated spin currents induce domain-wall precession, which reduces domain-wall velocities for selected gradient directions. We also predict an anisotropic skyrmion Hall response, with symmetry-selected directions enabling fast skyrmion motion with strongly suppressed transverse deflection. Our results reveal …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":34,"enAbstract":"We develop a symmetry-controlled theory of anisotropic thermomagnonic torques in insulating altermagnets. We identify a spin-splitter magnonic torque linked to thermally generated, sublattice-odd spin currents and an anisotropic entropic torque dictated by crystal symmetry. These torques produce anisotropic magnetic-texture responses to temperature gradients. In particular, thermally generated spin currents induce domain-wall precession, which reduces domain-wall velocities for selected gradient directions. We also predict an anisotropic skyrmion Hall response, with symmetry-selected directions enabling fast skyrmion motion with strongly suppressed transverse deflection. Our results reveal experimentally testable symmetry fingerprints of insulating altermagnets and extend more broadly to anisotropic magnets with exchange-driven magnon spin splitting.","zhAbstract":"我们建立了一种关于绝缘交变磁体中各向异性热磁振子力矩的对称性控制理论。我们识别出一种与热产生的、子晶格奇自旋流相关的自旋分裂磁振子力矩，以及一种由晶体对称性决定的各向异性熵力矩。这些力矩对温度梯度产生各向异性的磁织构响应。特别地，热产生的自旋流诱导畴壁进动，这降低了选定梯度方向上的畴壁速度。我们还预测了一种各向异性的斯格明子霍尔响应，其中对称性选定的方向能够实现快速斯格明子运动，同时横向偏转被强烈抑制。我们的结果揭示了绝缘交变磁体可在实验上检验的对称性指纹，并更广泛地推广到具有交换驱动磁振子自旋分裂的各向异性磁体。"},{"title":"Anomalous Hall and Nernst effects driven by static and fluctuating spin chiralities on Kagome lattice","url":"https://doi.org/10.1103/9mcp-cdld","doi":"10.1103/9mcp-cdld","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-13","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"摘要：skyrmion","score":3,"authors":["Helin Li","Z G Zhu","Gang Su"],"authorMore":false,"abstract":"We theoretically investigate the anomalous Hall and Nernst effects (AHE and ANE) in a two dimensional Kagome lattice to uncover the distinct roles of static and fluctuating scalar spin chi ralities. Employing Monte Carlo simulations incorporating with a tight binding Hamiltonian via the s-d exchange interaction, we explicitly evaluate the anomalous transport coefficients. A key finding is the systematic disentanglement of the macroscopic responses into an intrinsic contribu tion, governed by momentum space Berry curvature induced by static chirality, and an extrinsic skew scattering contribution driven by real space dynamical spin fluctuations. We demonstrate a pronounced mechanistic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":35,"enAbstract":"We theoretically investigate the anomalous Hall and Nernst effects (AHE and ANE) in a two dimensional Kagome lattice to uncover the distinct roles of static and fluctuating scalar spin chi ralities. Employing Monte Carlo simulations incorporating with a tight binding Hamiltonian via the s-d exchange interaction, we explicitly evaluate the anomalous transport coefficients. A key finding is the systematic disentanglement of the macroscopic responses into an intrinsic contribu tion, governed by momentum space Berry curvature induced by static chirality, and an extrinsic skew scattering contribution driven by real space dynamical spin fluctuations. We demonstrate a pronounced mechanistic crossover: deep in magnetically ordered phases like the skyrmion crystal, the intrinsic Berry curvature dictates the transport behavior. However, approaching the magnetic order-disorder critical regime, strong thermal fluctuations disrupt static noncoplanar spin configu rations, drastically suppressing intrinsic responses. Here, dynamical chiral fluctuations emerge as the dominant driving force. By delineating the phase regimes governed by static versus fluctuating chiralities, this work elucidates the distinct microscopic mechanisms dictating anomalous transport in frustrated magnetic systems.","zhAbstract":"我们从理论上研究了二维Kagome晶格中的反常霍尔效应和能斯特效应（AHE和ANE），以揭示静态和涨落标量自旋手性的不同作用。采用结合紧束缚哈密顿量的蒙特卡罗模拟，并通过s-d交换相互作用，我们明确评估了反常输运系数。一个关键发现是将宏观响应系统地解耦为由静态手性引起的动量空间贝里曲率所主导的内禀贡献，以及由实空间动态自旋涨落驱动的外禀斜散射贡献。我们展示了显著的机制交叉：在诸如斯格明子晶体等磁有序相深处，内禀贝里曲率主导输运行为。然而，当接近磁有序-无序临界区域时，强烈的热涨落破坏了静态非共面自旋构型，急剧抑制了内禀响应。此时，动态手性涨落成为主导驱动力。通过 delineating 由静态手性与涨落手性所主导的相区，本工作阐明了在阻挫磁系统中决定反常输运的不同微观机制。"},{"title":"Ferroelectric Control of Layer-Resolved Spin and Orbital Transport in a Topological Heterobilayer","url":"https://doi.org/10.1021/acs.nanolett.6c04169","doi":"10.1021/acs.nanolett.6c04169","journal":"Nano Letters","jabbr":"Nano Letters","pubdate":"2026-10-07","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT"],"matchTerm":"spin Hall effect","matchWhere":"摘要：spin Hall effect","score":3,"authors":["Zhiqi Chen","Bo Yuan","Ying Dai","Baibiao Huang","Xiaotian Wang","Chengwang Niu"],"authorMore":false,"abstract":"Abstract Ferroelectric switching in van der Waals heterostructures provides a powerful route to reconfiguring quantum states and their associated transport responses. Here, we propose a ferroelectric topological heterobilayer in which the stepwise reversal of polarization in the two monolayers enables selective control of spin and orbital transport with reduced mutual interference. Using first-principles calculations, we identify the In2Te3/In2Se3 heterobilayer as a candidate, where this stepwise polarization switching drives successive topological phase transitions from second-order topological to quantum spin Hall insulators and eventually to a trivial metal. These three phases exhibit … … ✅ 数据源：52 本刊、104 条通道全部正常。 ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":36,"enAbstract":"Abstract Ferroelectric switching in van der Waals heterostructures provides a powerful route to reconfiguring quantum states and their associated transport responses. Here, we propose a ferroelectric topological heterobilayer in which the stepwise reversal of polarization in the two monolayers enables selective control of spin and orbital transport with reduced mutual interference. Using first-principles calculations, we identify the In2Te3/In2Se3 heterobilayer as a candidate, where this stepwise polarization switching drives successive topological phase transitions from second-order topological to quantum spin Hall insulators and eventually to a trivial metal. These three phases exhibit distinct transport characteristics, including pure orbital Hall effect (OHE), layer-resolved coexistence of spin Hall effect (SHE) and OHE, and a metallic state with simultaneously enhanced SHE and OHE, accompanied by pronounced changes in the layer distribution of carriers. Our work highlights ferroelectric topological heterobilayers as a promising platform for controlling and characterizing spin–orbitronic transport, with potential for integrated spintronic and orbitronic devices.","zhAbstract":"摘要 范德华异质结构中的铁电翻转为重构量子态及其相关输运响应提供了一条有力途径。在此，我们提出一种铁电拓扑异质双层，其中两个单层中极化的逐步反转能够实现对自旋和轨道输运的选择性控制，并减少相互干扰。利用第一性原理计算，我们确定In2Te3/In2Se3异质双层为候选体系，其中这种逐步极化翻转驱动连续的拓扑相变，从二阶拓扑绝缘体到量子自旋霍尔绝缘体，并最终到平庸金属。这三个相表现出不同的输运特性，包括纯轨道霍尔效应（OHE）、自旋霍尔效应（SHE）与OHE的层分辨共存，以及同时增强SHE和OHE的金属态，并伴随载流子层分布的显著变化。我们的工作凸显了铁电拓扑异质双层作为控制和表征自旋—轨道电子学输运的有前景平台，具有用于集成自旋电子和轨道电子器件的潜力。"}],"reports":[{"date":"2026-10-21","generated":"2026-10-21 19:25","count":37}],"topics":["交换偏置与界面交换耦合","反铁磁与补偿磁体","自旋轨道力矩SOT","自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","自旋流与自旋输运","磁各向异性与界面磁性","手性磁结构与自旋动力学","二维磁性与拓扑自旋电子学","自旋逻辑与神经形态器件"],"themeKeys":["air","rs","chem","bgc","gis"],"topicTheme":{"空气污染":"air","遥感":"rs","大气化学":"chem","生物地球化学":"bgc","城市地理信息系统":"gis"},"generated":"2026-10-21 19:25"}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = (a.title+' '+a.abstract+' '+(a.enAbstract||'')+' '+(a.zhAbstract||'')+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var chinese = a.zhAbstract || '';
    var english = a.enAbstract || a.abstract || '';
    var ab = chinese
      ? '<div class="bilingual-preview"><span class="language">中文直译</span><p class="excerpt">'+esc(trunc(chinese,110))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">中文直译</span><p class="excerpt">译文暂缺；历史文献可后续补译</p></div>';
    ab += english
      ? '<div class="bilingual-preview"><span class="language">English Abstract</span><p class="excerpt">'+esc(trunc(english,125))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">English Abstract</span><p class="excerpt">英文摘要暂缺 · 点击原文</p></div>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+esc(a.title)+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="bilingual-section"><div class="sec-t">中文摘要（忠实直译）</div>'
      +   (a.zhAbstract
            ? '<p class="abs">'+esc(a.zhAbstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">尚未生成中文译文。仅对升级后新发现的论文自动翻译；历史论文可另行补译。</p>')
      +   '<div class="sec-t">English Abstract '+(a.enAbstract?'（原始全文）':'（日报摘录，可能不完整）')+'</div>'
      +   ((a.enAbstract || a.abstract)
            ? '<p class="abs">'+esc(a.enAbstract || a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">原数据源未提供英文摘要。</p>')
      +   '</div>'
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
