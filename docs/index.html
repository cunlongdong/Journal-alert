<h1>文献数据库正在等待重新生成</h1>
<p>旧历史文献、Bark 发送状态以及翻译缓存已经按仓库所有者要求清空。</p>
<p>前往 <a href="https://github.com/cunlongdong/Journal-alert/actions/workflows/daily.yml">GitHub Actions</a>，手动运行 <strong>journal-alert daily</strong>，选择 <strong>main</strong> 并勾选 <strong>no_push</strong>，重建完成后这里会显示新的卡片墙。</p>
<p>重建后 Bark 默认暂停；检查通过后运行 <strong>approve_rebuild</strong> 解锁，再由你决定是否运行 <strong>flush_only</strong>。首次重建不会向手机发送论文。</p>
