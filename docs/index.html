<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自旋电子学文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
/* Journal-alert uniform card grid · paste before the closing CSS tag in jalert/cards.py */
.wall {
  display: grid;
  columns: auto;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 392px;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 1380px) {
  .wall { columns: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .wall { columns: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .wall { columns: auto; grid-template-columns: minmax(0, 1fr); }
}
.card {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  margin: 0;
  min-width: 0;
  break-inside: auto;
}
.cover { flex: 0 0 108px; }
.body {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.title { flex: 0 0 auto; }
.excerpt { flex: 0 0 auto; }
.tagrow {
  flex: 0 0 auto;
  max-height: 48px;
  overflow: hidden;
  margin-top: auto;
}
.foot {
  flex: 0 0 42px;
  min-height: 42px;
  overflow: hidden;
  margin-top: auto;
}

/* JALERT_BILINGUAL_V1: English / Chinese bilingual paper previews */
.bilingual-preview { margin-top: 6px; min-width: 0; }
.bilingual-preview .language { display:block; color:#667085; font-size:10.5px;
  font-weight:750; letter-spacing:.15px; margin-bottom:2px; }
.bilingual-preview .excerpt { display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; margin:0;
  font-size:11.5px; line-height:1.45; color:var(--ink2); }
.bilingual-preview.absent .excerpt { color:var(--ink3); font-style:italic; }
.bilingual-section .sec-t { margin-top:15px; }
.bilingual-section .abs { overflow-wrap:anywhere; }
.english-title { display:block; font-size:0.76em; font-weight:500; color:var(--ink3); padding-top:3px; }

</style>
</head>

authors":["Kaili Li","Zhigang Li","Zixiao Wu","Chenjie Yuan","Hanyuan Ding","Yangyang Xu"],"authorMore":true,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":2,"zhTitle":"补偿型亚铁磁绝缘体中自旋霍尔磁电阻的电学调制"},{"title":"Generic skyrmion phase diagram in ferrimagnetic films","url":"https://doi.org/10.1103/627p-l6zk","doi":"10.1103/627p-l6zk","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic、标题：skyrmion","score":21,"authors":["M. V. Wijethunga","X. R. Wang"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":3,"enAbstract":"Ferrimagnetic skyrmions offer enhanced tunability due to antiferromagnetically coupled sublattices and reduced net magnetization. In chiral magnetic films at zero magnetic field, skyrmion stability is commonly characterized by a dimensionless parameter $κ$, yet its applicability to ferrimagnetic systems remains unclear, as most studies assume a fixed, strong inter-sublattice exchange coupling $J$. Here we investigate how variations in $J$ govern relaxed stable and metastable ferrimagnetic skyrmion configurations and introduce a dimensionless parameter $ζ_{eff}$ to characterize the crossover between strong and weak inter-sublattice locking. In the strong-coupling regime, inter-sublattice locking enables stabilization of skyrmion in a sublattice where intrinsic Dzyaloshinskii-Moriya interaction is absent while the other sublattice has finite DMI, yielding a sublattice with DMI-free ferrimagnetic skyrmions. As $J$ decreases, this locking breaks down, leading to independent sublattice behavior and the failure of an effective $κ$-based description. Our results establish a unified framework linking inter-sublattice exchange and skyrmion phase stability in ferrimagnetic systems.","zhTitle":"铁磁薄膜中通用斯格明子相图","zhAbstract":"英文论文标题：铁磁薄膜中通用的斯格明子相图 英文摘要：亚铁磁斯格明子由于反铁磁耦合的子晶格和降低的净磁化强度而提供了增强的可调性。在零磁场下的手性磁性薄膜中，斯格明子的稳定性通常由无量纲参数$κ$来表征，然而其对于亚铁磁系统的适用性仍不清楚，因为大多数研究假设一个固定的、强的子晶格间交换耦合$J$。在此，我们研究了$J$的变化如何调控弛豫后的稳定和亚稳态亚铁磁斯格明子构型，并引入一个无量纲参数$ζ_{eff}$来表征强与弱子晶格间锁定之间的交叉。在强耦合区域，子晶格间锁定使得斯格明子能够在一个本征Dzyaloshinskii-Moriya相互作用缺失的子晶格中稳定，而另一个子晶格具有有限DMI，从而产生具有无DMI子晶格的亚铁磁斯格明子。随着$J$减小，这种锁定被破坏，导致子晶格行为独立以及基于有效$κ$的描述失效。我们的结果建立了一个统一框架，将亚铁磁系统中的子晶格间交换与斯格明子相稳定性联系起来。"},{"title":"Sign crossover of magnetoresistance through magneto-optically tunable defect state spin injection process in organic magnetic tunnel junctions","url":"https://doi.org/10.1016/j.jmmm.2026.174563","doi":"10.1016/j.jmmm.2026.174563","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻","自旋流与自旋输运"],"matchTerm":"magnetic tunnel junctions","matchWhere":"标题：magnetic tunnel junctions、标题：spin injection","score":18,"authors":["Yadlapalli Sujatha","Debajit Deb","Pamulapati Soujanya","Nitish Ghosh","S Vamsee Krishna"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":4,"zhTitle":"有机磁性隧道结中通过磁光可调缺陷态自旋注入过程的磁阻符号交叉"},{"title":"Spin orbit torque manipulation of kπ-skyrmions in racetrack nanostructures for spintronic memory applications","url":"https://doi.org/10.1016/j.jmmm.2026.174602","doi":"10.1016/j.jmmm.2026.174602","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","自旋转移力矩与自旋电子存储"],"matchTerm":"spin orbit torque","matchWhere":"标题：spin orbit torque、标题：spintronic memory","score":18,"authors":["H. Vigo-Cotrina","Eduardo Saavedra","S. Urcia-Romero","S. Navarro-Vilca","J. Sifuentes-Rivera","A.P. Guimarães"],"authorMore":false,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":5,"enAbstract":"k π -skyrmions are topological magnetic textures with promising applications in spintronic devices. In this work, we investigated the stability and current-driven dynamics of k π -skyrmions ( k = 1,2,3 , and 4) in racetrack nanostructures. Stability phase diagrams were constructed as a function of the interfacial Dzyaloshinskii–Moriya interaction strength ( D int ) and the perpendicular magnetic field ( B z ). Our results showed that the stabilization range of each k π -skyrmion strongly depends on D int . In addition, the diameters of all textures increased with increasing D int and decreased with increasing B z . The current-driven dynamics induced by spin–orbit torque were then investigated. Our results showed that the velocity of all k π -skyrmions increased with current density and decreased with perpendicular magnetic field. Although the 3 π -skyrmion exhibited larger longitudinal velocities during the transient regime than the π -skyrmion, both textures reached nearly identical steady-state velocities. A similar behavior was observed for the 2 π - and 4 π -skyrmions. The steady-state dynamics were further analyzed using the Thiele formalism, which reproduced the trends observed in the micromagnetic simulations. These findings provide insight into the stabilization and transport properties of k π -skyrmions and support their potential use in future spintronic applications.","zhTitle":"赛道纳米结构中kπ-斯格明子的自旋轨道矩操控及其在自旋电子存储器中的应用","zhAbstract":"kπ-斯格明子是在自旋电子器件中具有应用前景的拓扑磁结构。在本工作中，我们研究了跑道形纳米结构中kπ-斯格明子（k=1、2、3和4）的稳定性与电流驱动动力学。我们构建了稳定性相图，其作为界面Dzyaloshinskii–Moriya相互作用强度（D_int）和垂直磁场（B_z）的函数。我们的结果表明，每种kπ-斯格明子的稳定范围强烈依赖于D_int。此外，所有结构的直径均随D_int增大而增大，并随B_z增大而减小。随后研究了由自旋–轨道力矩诱导的电流驱动动力学。我们的结果表明，所有kπ-斯格明子的速度均随电流密度增大而增大，并随垂直磁场增大而减小。尽管3π-斯格明子在瞬态阶段表现出比π-斯格明子更大的纵向速度，但两种结构达到了几乎相同的稳态速度。对于2π-和4π-斯格明子也观察到了类似行为。我们进一步使用Thiele形式体系分析了稳态动力学，其结果再现了微磁模拟中观察到的趋势。这些发现为kπ-斯格明子的稳定化和输运性质提供了见解，并支持其在未来自旋电子应用中的潜在用途。"},{"title":"Magnetic anisotropy in the near-stoichiometric van der Waals ferromagnet Fe 3 GeTe 2","url":"https://doi.org/10.1103/27h2-qnt8","doi":"10.1103/27h2-qnt8","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性","二维磁性与拓扑自旋电子学"],"matchTerm":"magnetic anisotropy","matchWhere":"标题：magnetic anisotropy、标题：van der Waals ferromagnet","score":18,"authors":["Riju Pal","Joyal John Abraham","Satyabrata Bera","Mintu Mondal","Atindra Nath Pal","Bernd Büchner"],"authorMore":true,"abstract":"","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-21","tkey":"other","id":6},{"title":"Ferroelectric Switching of Skyrmion Topology in 2D Multiferroics","url":"https://doi.org/10.1021/acsnano.6c14517","doi":"10.1021/acsnano.6c14517","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学","二维磁性与拓扑自旋电子学"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、标题：skyrmion、摘要：topological spintronics","score":16,"authors":["Xu Wang","Kaiying Dou","Xiudong Wang","Junhuang Yang","Ying Dai","Baibiao Huang"],"authorMore":true,"abstract":"Abstract Deterministic switching of skyrmion topology is a central frontier in topological spintronics, yet current paradigms rely almost exclusively on dissipative-current-driven spin torques. Here, we propose a fundamentally distinct mechanism for the nonvolatile switching of the skyrmion topology in two-dimensional multiferroics. We reveal that the intrinsic magnetoelectric coupling intimately links the out-of-plane ferroelectric polarization to interlayer magnetic exchange. Consequently, an electric-field-driven polarization reversal deterministically converts the interlayer coupling between the ferromagnetic and antiferromagnetic states. This macroscopic exchange reversal directly flips the microscopic skyrmion core polarity and reverses its topological charge, thereby stabilizing the two electrically addressable topological phases. Guided by our established design principles, we rigorously validate this mechanism in a Co2CF2/MoN2 multiferroic heterostructure by using combined first-principles calculations and atomistic spin simulations. Our findings bypass the limitations of continuous current injection, establishing a robust physical framework for energy-efficient multiferroic topological spintronics.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":7,"enAbstract":"Abstract Deterministic switching of skyrmion topology is a central frontier in topological spintronics, yet current paradigms rely almost exclusively on dissipative-current-driven spin torques. Here, we propose a fundamentally distinct mechanism for the nonvolatile switching of the skyrmion topology in two-dimensional multiferroics. We reveal that the intrinsic magnetoelectric coupling intimately links the out-of-plane ferroelectric polarization to interlayer magnetic exchange. Consequently, an electric-field-driven polarization reversal deterministically converts the interlayer coupling between the ferromagnetic and antiferromagnetic states. This macroscopic exchange reversal directly flips the microscopic skyrmion core polarity and reverses its topological charge, thereby stabilizing the two electrically addressable topological phases. Guided by our established design principles, we rigorously validate this mechanism in a Co2CF2/MoN2 multiferroic heterostructure by using combined first-principles calculations and atomistic spin simulations. Our findings bypass the limitations of continuous current injection, establishing a robust physical framework for energy-efficient multiferroic topological spintronics.","zhTitle":"二维多铁性材料中斯格明子拓扑的铁电翻转","zhAbstract":"摘要 斯格明子拓扑的确定性翻转是拓扑自旋电子学的核心前沿，然而当前范式几乎完全依赖于耗散电流驱动的自旋力矩。在此，我们提出了一种在二维多铁材料中实现斯格明子拓扑非易失性翻转的根本不同机制。我们揭示，本征磁电耦合将面外铁电极化与层间磁交换紧密联系起来。因此，电场驱动的极化反转确定性地将层间耦合在铁磁态与反铁磁态之间转换。这种宏观交换反转直接翻转微观斯格明子核极性并反转其拓扑荷，从而稳定两个电可寻址的拓扑相。在我们建立的设计原则指导下，我们通过结合第一性原理计算与原子自旋模拟，在Co2CF2/MoN2多铁异质结构中严格验证了该机制。我们的发现绕过了连续电流注入的局限性，为节能多铁拓扑自旋电子学建立了一个稳健的物理框架。"},{"title":"Low Energy Excitations in a [4]Triangulene Honeycomb Antiferromagnet","url":"https://doi.org/10.1021/acsnano.6c11666","doi":"10.1021/acsnano.6c11666","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet、摘要：spin dynamics","score":15,"authors":["Aidan Delgado","Carolin Dusold","James Wu","Jingwei Jiang","Christina M. Dadich","Adam Cronin"],"authorMore":true,"abstract":"Abstract Carbon-based synthetic lattices offer a versatile platform for the realization and control of correlated quantum effects at the nanoscale. Advances in on-surface synthesis have enabled the fabrication of increasingly complex molecular frameworks, providing opportunities for the exploration and engineering of custom tailored electronic and magnetic phases. Here, we report the design, on-surface synthesis, and characterization of a two-dimensional (2D) covalent organic framework (COF) assembled from D3h symmetric S = 3/2 [4]triangulene building blocks arranged in a honeycomb structure. Combined scanning probe microscopy and spectroscopy, corroborated by first-principles density functional theory (DFT) and GW calculations, establish an antiferromagnetic (AFM) insulating ground state. Low energy spectroscopy resolves spin excitations in both one-dimensional (1D) chains and extended 2D networks, providing direct insight into the emergent spin dynamics and establishing a modular platform to explore quantum magnetism in a π-conjugated organic system.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":8,"enAbstract":"Abstract Carbon-based synthetic lattices offer a versatile platform for the realization and control of correlated quantum effects at the nanoscale. Advances in on-surface synthesis have enabled the fabrication of increasingly complex molecular frameworks, providing opportunities for the exploration and engineering of custom tailored electronic and magnetic phases. Here, we report the design, on-surface synthesis, and characterization of a two-dimensional (2D) covalent organic framework (COF) assembled from D3h symmetric S = 3/2 [4]triangulene building blocks arranged in a honeycomb structure. Combined scanning probe microscopy and spectroscopy, corroborated by first-principles density functional theory (DFT) and GW calculations, establish an antiferromagnetic (AFM) insulating ground state. Low energy spectroscopy resolves spin excitations in both one-dimensional (1D) chains and extended 2D networks, providing direct insight into the emergent spin dynamics and establishing a modular platform to explore quantum magnetism in a π-conjugated organic system.","zhTitle":"[4]三角烯蜂窝反铁磁体中的低能激发","zhAbstract":"摘要 碳基合成晶格为在纳米尺度上实现和调控关联量子效应提供了一个多功能的平台。表面合成技术的进步使得制备日益复杂的分子框架成为可能，为探索和工程化定制电子相与磁相提供了机会。在此，我们报道了一种二维（2D）共价有机框架（COF）的设计、表面合成与表征，该框架由D3h对称的S = 3/2 [4]三角烯构建单元以蜂窝结构排列组装而成。结合扫描探针显微镜与光谱学，并辅以第一性原理密度泛函理论（DFT）和GW计算，确立了反铁磁（AFM）绝缘基态。低能光谱学分辨出一维（1D）链和扩展二维网络中的自旋激发，为新兴自旋动力学提供了直接洞察，并建立了一个用于探索π共轭有机体系中量子磁性的模块化平台。"},{"title":"Unfolding of Field-Free Spin–Orbit Torque Magnetization Switching in a van der Waals Heterostructure","url":"https://doi.org/10.1021/acsnano.6c10331","doi":"10.1021/acsnano.6c10331","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-19","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","磁各向异性与界面磁性","手性磁结构与自旋动力学"],"matchTerm":"field-free switching","matchWhere":"摘要：field-free switching、标题：magnetization switching、摘要：Dzyaloshinskii-Moriya interaction","score":15,"authors":["Niklas Kercher","Paul Noël","Emir Karadža","Pietro Gambardella"],"authorMore":false,"abstract":"Abstract Heterostructures of 2D materials offer high tunability of magnetic properties, including current-induced magnetization switching by unconventional spin–orbit torques. The microscopic mechanisms governing spin-torque switching in van der Waals systems, however, remain insufficiently understood. Here, we investigate current-induced magnetization reversal in an Fe3GeTe2 (FGT) and WTe2 heterostructure using scanning harmonic magneto-optical Kerr effect microscopy. Spatially resolved magnetization maps show that field-free switching unfolds from asymmetric domain nucleation at the edges of the FGT flake, followed by domain wall propagation. This switching behavior is deterministic and bipolar, consistent with spin–orbit torques arising from the injection of both in-plane and out-of-plane spins from WTe2 into FGT. The critical currents for up-to-down and down-to-up switching differ because of asymmetric domain nucleation and directional domain wall pinning effects. Micromagnetic simulations reproduce the switching behavior observed experimentally, showing how the initial domain nucleation sites are determined by the sample geometry and combined influence of in-plane and out-of-plane spins and Dzyaloshinskii-Moriya interaction. Finally, by systematically varying the field-like and damping-like torque components and sweeping the spin polarization between in-plane and out-of-plane, we identify the torque configurations that yield the most efficient switching in van der Waals magnets with different shapes.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":9,"enAbstract":"Abstract Heterostructures of 2D materials offer high tunability of magnetic properties, including current-induced magnetization switching by unconventional spin–orbit torques. The microscopic mechanisms governing spin-torque switching in van der Waals systems, however, remain insufficiently understood. Here, we investigate current-induced magnetization reversal in an Fe3GeTe2 (FGT) and WTe2 heterostructure using scanning harmonic magneto-optical Kerr effect microscopy. Spatially resolved magnetization maps show that field-free switching unfolds from asymmetric domain nucleation at the edges of the FGT flake, followed by domain wall propagation. This switching behavior is deterministic and bipolar, consistent with spin–orbit torques arising from the injection of both in-plane and out-of-plane spins from WTe2 into FGT. The critical currents for up-to-down and down-to-up switching differ because of asymmetric domain nucleation and directional domain wall pinning effects. Micromagnetic simulations reproduce the switching behavior observed experimentally, showing how the initial domain nucleation sites are determined by the sample geometry and combined influence of in-plane and out-of-plane spins and Dzyaloshinskii-Moriya interaction. Finally, by systematically varying the field-like and damping-like torque components and sweeping the spin polarization between in-plane and out-of-plane, we identify the torque configurations that yield the most efficient switching in van der Waals magnets with different shapes.","zhTitle":"无场自旋轨道矩磁化翻转在范德华异质结构中的展开","zhAbstract":"摘要 二维材料的异质结构为磁性质提供了高度可调性，包括由非常规自旋–轨道力矩驱动的电流诱导磁化翻转。然而，范德华体系中自旋力矩翻转的微观机制仍未得到充分理解。在此，我们利用扫描谐波磁光克尔效应显微镜研究了Fe3GeTe2（FGT）与WTe2异质结构中的电流诱导磁化反转。空间分辨的磁化图显示，无场翻转从FGT薄片边缘的不对称畴成核开始，随后是畴壁传播。这种翻转行为是确定性的和双极性的，与来自WTe2的面内和面外自旋注入FGT所产生的自旋–轨道力矩一致。向上到向下和向下到向上翻转的临界电流不同，这是由于不对称的畴成核和方向性畴壁钉扎效应。微磁模拟再现了实验观察到的翻转行为，显示了初始畴成核位点如何由样品几何形状以及面内和面外自旋与Dzyaloshinskii-Moriya相互作用的共同影响所决定。最后，通过系统地改变类场和类阻尼力矩分量并在面内和面外自旋极化之间进行扫描，我们确定了在不同形状的范德华磁体中产生最有效翻转的力矩配置。"},{"title":"The challenging path toward high-temperature quantum anomalous hall effect in MnBi 2 Te 4","url":"https://doi.org/10.1088/1361-648x/aeb217","doi":"10.1088/1361-648x/aeb217","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","二维磁性与拓扑自旋电子学"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、标题：quantum anomalous Hall","score":13,"authors":["Liangcai Xu","Yuetan Li","Zichen Lian","Jinsong Zhang"],"authorMore":false,"abstract":"Abstract Since its experimental discovery as an intrinsic antiferromagnetic topological insulator in 2019, the MnBi 2 Te 4 family of materials has greatly propelled the development of condensed matter physics over the past several years. This family naturally integrates long-range magnetic order with topological band structure within a two-dimensional van der Waals layered material, providing an unprecedentedly clean platform for exploring quantum phenomena such as axion insulators, the quantum anomalous Hall effect, and the topological magnetoelectric effect. However, the transition from fundamental research to practical applications, particularly the realization of high-temperature quantum effects, is confronted with severe challenges in intrinsic defects, magnetic ground-state tuning, and electronic structure engineering. This article aims to review the current development status of the MnBi 2 Te 4 family, focusing on its core quantum phenomena, recent revolutionary breakthroughs in sample preparation techniques, and diverse tuning methods. On this basis, we outline possible pathways toward high-temperature quantum effects through innovations in material synthesis, interface engineering, and multi-strategy tuning and heterostructure engineering.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":10,"enAbstract":"Abstract Since its experimental discovery as an intrinsic antiferromagnetic topological insulator in 2019, the MnBi 2 Te 4 family of materials has greatly propelled the development of condensed matter physics over the past several years. This family naturally integrates long-range magnetic order with topological band structure within a two-dimensional van der Waals layered material, providing an unprecedentedly clean platform for exploring quantum phenomena such as axion insulators, the quantum anomalous Hall effect, and the topological magnetoelectric effect. However, the transition from fundamental research to practical applications, particularly the realization of high-temperature quantum effects, is confronted with severe challenges in intrinsic defects, magnetic ground-state tuning, and electronic structure engineering. This article aims to review the current development status of the MnBi 2 Te 4 family, focusing on its core quantum phenomena, recent revolutionary breakthroughs in sample preparation techniques, and diverse tuning methods. On this basis, we outline possible pathways toward high-temperature quantum effects through innovations in material synthesis, interface engineering, and multi-strategy tuning and heterostructure engineering."},{"title":"Magnetocaloric effect in one-dimensional chain spin-flop antiferromagnetic Brannerite MnV2O6","url":"https://doi.org/10.1016/j.jmmm.2026.174675","doi":"10.1016/j.jmmm.2026.174675","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-12-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["L. Gowsalya","N. Lakshminarasimhan"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":11,"zhTitle":"一维链自旋翻转反铁磁褐钇铌矿型MnV2O6中的磁热效应"},{"title":"Strain-induced enhanced room-temperature magnetization in epitaxial Mn3Sn thin films for antiferromagnetic spintronics","url":"https://doi.org/10.1016/j.jallcom.2026.191741","doi":"10.1016/j.jallcom.2026.191741","journal":"Journal of Alloys and Compounds","jabbr":"Journal of Alloys and Compounds","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Subhankar Das","Sriram Kasilingam","Ajoy Dinda","Bilal Jamshed","Biswanath Pramanik","Subrata Biswas"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":12,"zhTitle":"应变诱导的外延Mn3Sn薄膜中增强的室温磁化及其在反铁磁自旋电子学中的应用"},{"title":"Antiphase boundary-driven large exchange bias and negative magnetoresistance in NiCo2O4","url":"https://doi.org/10.1016/j.jmmm.2026.174575","doi":"10.1016/j.jmmm.2026.174575","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange bias","matchWhere":"标题：exchange bias","score":12,"authors":["Biswanath Pramanik","Pushpesh Pathak","Binoy K. Hazra"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":13,"zhTitle":"反相畴界驱动的NiCo2O4大交换偏置与负磁阻"},{"title":"Large coercivity and giant exchange bias in Eu₂NiIrO₆","url":"https://doi.org/10.1016/j.jmmm.2026.174650","doi":"10.1016/j.jmmm.2026.174650","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange bias","matchWhere":"标题：exchange bias","score":12,"authors":["T. Durga Rao","Manish K. Niranjan","K. Ramesh Kumar","G. Bhavani","B. Sattibabu","Thao T. Tran"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":14,"zhTitle":"Eu₂NiIrO₆中的大矫顽力和巨交换偏置"},{"title":"Sector-resolved microcanonical entropy of the spin-1/2 Heisenberg antiferromagnet on the Sierpiński gasket","url":"https://doi.org/10.1016/j.jmmm.2026.174633","doi":"10.1016/j.jmmm.2026.174633","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["J. Ricardo de Sousa","Orion Ciftja"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":15,"zhTitle":"Sierpiński垫上自旋-1/2海森堡反铁磁体的扇区分辨微正则熵"},{"title":"Surface-enhanced anomalous Hall conductivity in ferrimagnetic Mn2PtSn Heusler alloy","url":"https://doi.org/10.1016/j.jmmm.2026.174616","doi":"10.1016/j.jmmm.2026.174616","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["Sadikul Alom","Bhargab Kakati","Munima B. Sahariah"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":16,"enAbstract":"The anomalous Hall conductivity of the bulk ferrimagnetic Heusler alloy Mn 2 PtSn is calculated using density functional theory combined with maximally localized Wannier functions. The corresponding Berry curvature distributions are then computed, from which the net anomalous Hall conductivity is obtained. To enhance the anomalous Hall conductivity through symmetry reduction, three energetically stable (001) surface terminations of Mn 2 PtSn are considered, and their Berry curvature distributions are compared with those of the bulk unit cell. The increased number of Berry curvature peaks at the surface terminations leads to a higher value of the anomalous Hall conductivity. The anomalous Hall conductivity is also evaluated as a function of the Fermi level, and the presence of sharp peaks near the Fermi level indicates the potential for further enhancement through Fermi-level tuning. The high value of anomalous Hall conductivity at the surfaces highlights their potential for application in thin-film memory devices, where surface-driven properties are crucial. • Anomalous Hall conductivity (AHC) of bulk and (001) Mn 2 PtSn surfaces is calculated. • Surface-induced symmetry-breaking enhances the AHC. • The Pt full monolayer shows the enhanced Berry curvature and AHC due to strong spin–orbit interaction. • AHC peak near Fermi level suggests potential for further AHC enhancement via tuning.","zhTitle":"亚铁磁Mn2PtSn Heusler合金中的表面增强反常霍尔电导率"},{"title":"Characterization of ferrimagnetic FeGd coatings formed by a magnetron sputtering","url":"https://doi.org/10.1016/j.jmmm.2026.174566","doi":"10.1016/j.jmmm.2026.174566","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["V.O. Semin","M.V. Shandrikov","V.R. Utyaganova","M.G. Ostapenko","F.A. D'yachenko","A.A. Cherkasov"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":17},{"title":"Intrinsic i‐Wave Altermagnetism in 2D Graphene Superlattices","url":"https://doi.org/10.1002/advs.78167","doi":"10.1002/advs.78167","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnetism","matchWhere":"标题：altermagnetism","score":12,"authors":["Cuiju Yu","Jose L. Lado"],"authorMore":false,"abstract":"ABSTRACT Altermagnets feature unconventional magnetism due to their momentum‐dependent spin splitting purely driven by magnetic order, for which a variety of transition‐metal‐based ‐wave altermagnets have been proposed. However, carbon‐based altermagnets remain largely unexplored, even though magnetism of graphene nanostructures has been widely demonstrated. Here, through a comprehensive symmetry analysis, we establish a symmetry‐guided design principle for realizing higher‐order ‐wave altermagnetism in graphene antidot superlattices and demonstrate its emergence in both monolayer and bilayer graphene, particularly in the Bernal‐stacked bilayer. By combining atomistic tight binding models and first principles methods, we show the appearance of an interaction‐induced ‐wave altermagnetic splitting, originating from the intrinsic magnetic instability of 2D graphene antidot superlattices. Our work establishes a strategy to engineer ‐wave altermagnetism in a graphene platform, extending the materials landscape beyond conventional ‐wave altermagnets and putting forward a carbon‐based platform for higher‐order altermagnetic spintronics.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":18},{"title":"Terahertz field-induced giant symmetry modulations in a van der Waals antiferromagnet","url":"https://doi.org/10.1038/s41467-026-78519-4","doi":"10.1038/s41467-026-78519-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["Sheikh Rubaiat Ul Haque","Martin J. Cross","Sangeeta Rajpurohit","Jonah B. Haber","Christopher J. Ciccarino","Alexandra C. Zimmerman"],"authorMore":true,"abstract":"Abstract Strong-field terahertz (THz) excitations enable dynamic control over electronic, lattice and symmetry degrees of freedom in quantum materials. Here, we uncover pronounced terahertz-induced symmetry modulations and coherent phonon dynamics in the van der Waals antiferromagnet MnPS 3, in which inversion symmetry is broken by its antiferromagnetic spin configuration. Our time-resolved second harmonic generation measurements reveal long-lived giant oscillations in the antiferromagnetic phase, with amplitudes comparable to the equilibrium signal, driven by phonons involving percent-level atomic displacements relative to the equilibrium bond lengths. The temporal evolution of the rotational anisotropy patterns indicates a dynamic breaking of mirror symmetry, modulated by two vibrational modes at 1.7 THz and 4.5 THz, with the former corresponding to a hidden mode not observed in equilibrium spectroscopy. These effects arise in part from a field-induced charge rearrangement mechanism that lowers the local crystal symmetry and couples to the phonon modes. We uncover a long-lived field-driven response with a complex THz polarization dependence, consistent with a metastable state of reduced symmetry. Through comparison with simulations, we interpret this response in terms of a potential antiferromagnetic-to-ferrimagnetic transition. Our results establish an effective field-tunable pathway for driving excitations otherwise weak in equilibrium.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":19},{"title":"Ground-state properties of the S = 3 2 anisotropic triangular lattice antiferromagnet Na 3 Cr (PO 4) 2","url":"https://doi.org/10.1103/d35n-4jtr","doi":"10.1103/d35n-4jtr","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["A. Magar","Sebin J. Sebastian","Q.-P. Ding","Y. Skourski","A. A. Tsirlin","Y. Furukawa"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":20},{"title":"Strain-Engineered Giant Tunneling Magnetoresistance in Fe-Intercalated MoS2 van der Waals Magnetic Tunnel Junctions","url":"https://doi.org/10.1021/acsaelm.6c01591","doi":"10.1021/acsaelm.6c01591","journal":"ACS Applied Electronic Materials","jabbr":"ACS Applied Electronic Materials","pubdate":"2026-10-19","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻","自旋流与自旋输运"],"matchTerm":"magnetic tunnel junctions","matchWhere":"标题：magnetic tunnel junctions、摘要：spin injection","score":12,"authors":["Huan Wang","Xiaojie Liu","Hui Wang","Haitao Yin"],"authorMore":false,"abstract":"Abstract This work proposes an all-two-dimensional magnetic tunnel junction consisting of Fe-intercalated MoS2 ferromagnetic electrodes and a pristine bilayer MoS2 tunneling barrier. We systematically investigate the modulation mechanism of out-of-plane tensile strain on the spin-transport properties of the device using quantum transport simulations. The results reveal that Fe intercalation induces a semiconductor-to-ferromagnetic-metal transition in MoS2 and the magnetic moment increases progressively under tensile strain. Under an applied tensile strain of 3%, the MTJ achieves an ultrahigh tunneling magnetoresistance of 1.67 × 105% accompanied by a spin injection efficiency of 90%. The enhancement of spin-dependent tunneling efficiency under tensile strain originates from a Fermi level shift of the electrodes and modulation of the spin asymmetry of the interfacial Schottky barrier. By integrating atomic intercalation with strain engineering, this work establishes a new paradigm for designing high-performance, low-power two-dimensional spintronic devices.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":21,"enAbstract":"Abstract This work proposes an all-two-dimensional magnetic tunnel junction consisting of Fe-intercalated MoS2 ferromagnetic electrodes and a pristine bilayer MoS2 tunneling barrier. We systematically investigate the modulation mechanism of out-of-plane tensile strain on the spin-transport properties of the device using quantum transport simulations. The results reveal that Fe intercalation induces a semiconductor-to-ferromagnetic-metal transition in MoS2 and the magnetic moment increases progressively under tensile strain. Under an applied tensile strain of 3%, the MTJ achieves an ultrahigh tunneling magnetoresistance of 1.67 × 105% accompanied by a spin injection efficiency of 90%. The enhancement of spin-dependent tunneling efficiency under tensile strain originates from a Fermi level shift of the electrodes and modulation of the spin asymmetry of the interfacial Schottky barrier. By integrating atomic intercalation with strain engineering, this work establishes a new paradigm for designing high-performance, low-power two-dimensional spintronic devices.","zhAbstract":"摘要 本工作提出了一种全二维磁性隧道结，由Fe插层MoS2铁磁电极和原始双层MoS2隧穿势垒构成。我们采用量子输运模拟系统研究了面外拉伸应变对器件自旋输运性质的调制机制。结果表明，Fe插层诱导MoS2发生从半导体到铁磁金属的转变，且磁矩在拉伸应变下逐渐增大。在施加3%的拉伸应变下，该MTJ实现了1.67 × 105%的超高隧穿磁阻，并伴随90%的自旋注入效率。拉伸应变下自旋相关隧穿效率的增强源于电极费米能级的移动以及界面肖特基势垒自旋不对称性的调制。通过将原子插层与应变工程相结合，本工作为设计高性能、低功耗二维自旋电子器件建立了新范式。"},{"title":"Design optimization of flux concentrators for magnetic tunnel junctions-based sensors","url":"https://doi.org/10.1063/5.0337390","doi":"10.1063/5.0337390","journal":"Applied Physics Letters","jabbr":"Applied Physics Letters","pubdate":"2026-10-19","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻","自旋逻辑与神经形态器件"],"matchTerm":"magnetic tunnel junctions","matchWhere":"标题：magnetic tunnel junctions、摘要：magnetic sensor","score":12,"authors":["Thomas Brun","Javier Rial","Lucía Risoli","Johanna Fischer","Philippe Sabon","G. Jannet"],"authorMore":true,"abstract":"Miniaturized, ultra-sensitive, and easily integrable magnetometers are needed for many applications, such as space exploration or health monitoring. Achieving this goal requires a magnetic sensor with high sensitivity and low noise. High sensitivity (\u0026gt;1000%/mT) can be obtained by integrating high gain Permalloy flux concentrators (FC), with the advantage of high field direction selectivity. Reducing the magnetic 1/f noise can be realized by increasing the number of magnetic tunnel junctions in the air-gap of the FC. However, this is obtained at the expense of a larger air-gap and consequently a decrease in the magnetic gain and thus in the sensitivity. In this paper, we explore a design optimization scheme in order to find the best trade-off between high FC gain and low magnetic noise. To model the gain of the flux concentrator, we propose two complementary approaches; one is based on finite-element simulations of the FC gain, where the influence of geometrical parameters of the air-gap is investigated. Then, in a second step, we propose an analytical formula consistent with all our simulation results and based on magnetic reluctance. Finally, we derive an analytical model of the sensor detectivity from which we can extract the optimal sensor design, which allows an improvement by three orders of magnitude in the performance compared to a single junction. Our research demonstrates that a multi-parameter approach outperforms single-parameter optimization, with peak performance surprisingly achieved at moderate parameter values.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":22,"enAbstract":"Miniaturized, ultra-sensitive, and easily integrable magnetometers are needed for many applications, such as space exploration or health monitoring. Achieving this goal requires a magnetic sensor with high sensitivity and low noise. High sensitivity (\u0026gt;1000%/mT) can be obtained by integrating high gain Permalloy flux concentrators (FC), with the advantage of high field direction selectivity. Reducing the magnetic 1/f noise can be realized by increasing the number of magnetic tunnel junctions in the air-gap of the FC. However, this is obtained at the expense of a larger air-gap and consequently a decrease in the magnetic gain and thus in the sensitivity. In this paper, we explore a design optimization scheme in order to find the best trade-off between high FC gain and low magnetic noise. To model the gain of the flux concentrator, we propose two complementary approaches; one is based on finite-element simulations of the FC gain, where the influence of geometrical parameters of the air-gap is investigated. Then, in a second step, we propose an analytical formula consistent with all our simulation results and based on magnetic reluctance. Finally, we derive an analytical model of the sensor detectivity from which we can extract the optimal sensor design, which allows an improvement by three orders of magnitude in the performance compared to a single junction. Our research demonstrates that a multi-parameter approach outperforms single-parameter optimization, with peak performance surprisingly achieved at moderate parameter values.","zhAbstract":"英文论文标题：用于磁隧道结传感器的磁通集中器设计优化 英文摘要：许多应用，例如空间探索或健康监测，都需要小型化、超灵敏且易于集成的磁强计。实现这一目标需要具有高灵敏度和低噪声的磁传感器。通过集成高增益坡莫合金磁通集中器（FC），可以获得高灵敏度（\u003e1000%/mT），并具有高磁场方向选择性的优势。降低磁1/f噪声可以通过增加FC气隙中磁隧道结的数量来实现。然而，这是以更大的气隙为代价获得的，并因此导致磁增益下降，从而使灵敏度降低。在本文中，我们探索了一种设计优化方案，以寻找高FC增益与低磁噪声之间的最佳折衷。为了对磁通集中器的增益进行建模，我们提出了两种互补方法；一种基于FC增益的有限元仿真，其中研究了气隙几何参数的影响。然后，在第二步中，我们提出了一个与所有仿真结果一致且基于磁阻的解析公式。最后，我们推导了传感器探测率的解析模型，从中可以提取最优传感器设计，与单结相比，该设计可使性能提高三个数量级。我们的研究表明，多参数方法优于单参数优化，并且令人惊讶地在中等参数值处实现了峰值性能。"},{"title":"Termination-Dependent Surface Fermiology in the Intercalated Altermagnet CoNb4Se8","url":"https://doi.org/10.1021/acs.nanolett.6c01819","doi":"10.1021/acs.nanolett.6c01819","journal":"Nano Letters","jabbr":"Nano Letters","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"标题：altermagnet","score":12,"authors":["Pietro Maria Forcella","Alessandro De Vita","Matthew D. Watson","Sammar Tayyab","Chiara Bigi","Iulia Cojocariu"],"authorMore":true,"abstract":"Abstract Altermagnets have recently gained attention for hosting symmetry-enforced spin-split bands despite zero net magnetization. Angle-resolved photoelectron spectroscopy (ARPES) offers direct access to their electronic structure. However, the intrinsic surface sensitivity of this technique complicates the identification of the observed features: Surface states can be misinterpreted as the spin-split counterpart of bulk bands. This issue becomes particularly relevant for layered intercalated systems, where micrometer-sized domains with distinct terminations often coexist on a cleaved surface. We discuss this scenario for CoNb4Se8, one of the first established layered altermagnets. Supported by density functional theory calculations, we employ micro-ARPES to probe individual domains and reveal two contrasting surface terminations. We identify Co- and Se-terminated domains with characteristic surface states arising from bulk-surface connectivity of the material. Our work shows that termination-dependent surface contributions are essential for the reliable spectroscopic identification of altermagnetism and for assessing its presence across the family of layered materials.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":23,"enAbstract":"Abstract Altermagnets have recently gained attention for hosting symmetry-enforced spin-split bands despite zero net magnetization. Angle-resolved photoelectron spectroscopy (ARPES) offers direct access to their electronic structure. However, the intrinsic surface sensitivity of this technique complicates the identification of the observed features: Surface states can be misinterpreted as the spin-split counterpart of bulk bands. This issue becomes particularly relevant for layered intercalated systems, where micrometer-sized domains with distinct terminations often coexist on a cleaved surface. We discuss this scenario for CoNb4Se8, one of the first established layered altermagnets. Supported by density functional theory calculations, we employ micro-ARPES to probe individual domains and reveal two contrasting surface terminations. We identify Co- and Se-terminated domains with characteristic surface states arising from bulk-surface connectivity of the material. Our work shows that termination-dependent surface contributions are essential for the reliable spectroscopic identification of altermagnetism and for assessing its presence across the family of layered materials.","zhAbstract":"摘要 交错磁体近期因在净磁化强度为零的情况下仍具有对称性强制自旋分裂能带而受到关注。角分辨光电子能谱（ARPES）可直接探测其电子结构。然而，该技术固有的表面敏感性使所观测特征的识别变得复杂：表面态可能被误判为体态能带的自旋分裂对应物。对于层状插层体系而言，这一问题尤为突出，因为解理表面上常共存着具有不同终止方式的微米级畴区。我们以CoNb4Se8——最早确立的层状交错磁体之一——为例讨论了这一情形。在密度泛函理论计算的支持下，我们采用微区ARPES探测单个畴区，并揭示了两种截然不同的表面终止方式。我们识别出Co终止和Se终止的畴区，它们具有源于材料体-表面连通性的特征表面态。我们的工作表明，终止方式依赖的表面贡献对于可靠地通过光谱学识别交错磁性以及评估其在层状材料家族中的存在至关重要。"},{"title":"Spin order and excitations in the collinear kagome antiferromagnet Y 0.5 Fe 3 Sn 3","url":"https://doi.org/10.1103/mjd4-ylmx","doi":"10.1103/mjd4-ylmx","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["Jin Ding","Yang Liu","Feihao Pan","Yinghao Zhu","Yixi Su","Stanislav E. Nikitin"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":24},{"title":"Probing the intrinsic linear magnetoelectric effect in the honeycomb antiferromagnet Co 4 Nb 2 O 9 using high magnetic fields","url":"https://doi.org/10.1103/4j2l-5hqs","doi":"10.1103/4j2l-5hqs","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["Yuting Chang","Huakun Zuo","Junfeng Wang","Chengliang Lu"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":25},{"title":"Intrinsic defects and 4 d / 5 d transition metal defects in Cr 2 O₃: Pathways for enhancing the Néel temperature","url":"https://doi.org/10.1103/bdrw-y6tl","doi":"10.1103/bdrw-y6tl","journal":"Physical Review Materials","jabbr":"Physical Review Materials","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"Néel temperature","matchWhere":"标题：Néel temperature","score":12,"authors":["Xuecong Wang","Sai Mu"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":26},{"title":"Robust Spin Splitting and Fermiology in the Layered Altermagnet CoNb4Se8","url":"https://doi.org/10.1002/adma.75367","doi":"10.1002/adma.75367","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-18","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"标题：altermagnet","score":12,"authors":["Alessandro De Vita","Chiara Bigi","Davide Romanin","Matthew D. Watson","Vincent Polewczyk","Marta Zonno"],"authorMore":true,"abstract":"ABSTRACT Altermagnetism defies conventional classifications of collinear magnetic phases, combining compensated magnetization with momentum‐dependent, nonrelativistic spin splitting. While altermagnetic band splitting has been established in three‐dimensional compounds such as MnTe and CrSb, layered altermagnets remain far less explored spectroscopically. Here, combining termination‐resolved micro‐ARPES, fine photon‐energy mapping, spin‐ARPES, and density functional theory, we map the three‐dimensional fermiology of the layered g ‐wave altermagnet, obtained by ordered Co intercalation of 2H‐. We resolve the spin–split branches of the altermagnetic pairs directly in the raw photoemission spectra and, with spin‐ARPES at these experimentally identified momenta, show the reversal of the spin polarization at opposite momenta and between two regions of the sample, consistent with opposite time‐reversal domains, and its absence along the symmetry‐protected nodal –K direction. We further report a weak low‐temperature anomaly near T 0 ≈ 50–60 K, detected by magnetometry, temperature‐dependent micro‐ARPES, and ultrafast reflectivity, whose microscopic origin remains open. These results provide a momentum‐resolved benchmark of the electronic structure of a layered altermagnet.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":27,"enAbstract":"ABSTRACT Altermagnetism defies conventional classifications of collinear magnetic phases, combining compensated magnetization with momentum‐dependent, nonrelativistic spin splitting. While altermagnetic band splitting has been established in three‐dimensional compounds such as MnTe and CrSb, layered altermagnets remain far less explored spectroscopically. Here, combining termination‐resolved micro‐ARPES, fine photon‐energy mapping, spin‐ARPES, and density functional theory, we map the three‐dimensional fermiology of the layered g ‐wave altermagnet , obtained by ordered Co intercalation of 2H‐. We resolve the spin–split branches of the altermagnetic pairs directly in the raw photoemission spectra and, with spin‐ARPES at these experimentally identified momenta, show the reversal of the spin polarization at opposite momenta and between two regions of the sample, consistent with opposite time‐reversal domains, and its absence along the symmetry‐protected nodal –K direction. We further report a weak low‐temperature anomaly near T 0 ≈ 50–60 K, detected by magnetometry, temperature‐dependent micro‐ARPES, and ultrafast reflectivity, whose microscopic origin remains open. These results provide a momentum‐resolved benchmark of the electronic structure of a layered altermagnet.","zhAbstract":"摘要 交错磁性突破了共线磁相的常规分类，将补偿磁化与动量依赖的非相对论性自旋劈裂相结合。尽管交错磁性能带劈裂已在MnTe和CrSb等三维化合物中得到确立，层状交错磁体在光谱学上仍远未被充分探索。本文结合终端分辨微区ARPES、精细光子能量映射、自旋ARPES和密度泛函理论，绘制了通过2H-的有序Co插层获得的层状g波交错磁体的三维费米面。我们在原始光电子能谱中直接分辨出交错磁对的自旋劈裂分支，并利用在这些实验确定的动量处的自旋ARPES，展示了在相反动量处以及样品两个区域之间自旋极化的反转，这与相反的时间反演畴一致，并且沿对称性保护的节点–K方向不存在自旋极化。我们进一步报告了在T 0 ≈ 50–60 K附近由磁强计、温度依赖微区ARPES和超快反射率检测到的弱低温异常，其微观起源仍未明确。这些结果为层状交错磁体的电子结构提供了动量分辨的基准。"},{"title":"Operating regimes and materials limits of nonlinear magnon dynamics in Co-doped YIG","url":"https://doi.org/10.1016/j.jmmm.2026.174649","doi":"10.1016/j.jmmm.2026.174649","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-12-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["A.M. Tishin"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":28},{"title":"Modulation of Current-Induced Magnetization Switching by Tb Layer Thickness in Ti/Pt/Co/Tb/Ti Heterostructures","url":"https://doi.org/10.1016/j.jmmm.2026.174674","doi":"10.1016/j.jmmm.2026.174674","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magn ","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Terumitsu Tanaka","Budi Purnama"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":35},{"title":"Designer quantum states in magnetic topological insulator multilayers","url":"https://doi.org/10.1016/j.jmmm.2026.174589","doi":"10.1016/j.jmmm.2026.174589","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"magnetic topological insulator","matchWhere":"标题：magnetic topological insulator","score":9,"authors":["Deyi Zhuo","Han Tay","Cui-Zu Chang"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":36},{"title":"Skyrmion Bubbles by Design in a Centrosymmetric Kagome Magnet","url":"https://doi.org/10.1002/advs.78269","doi":"10.1002/advs.78269","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Mohamed El Gazzah","Fehmi Sami Yasin","Sk Jamaluddin","Hari Bhandari","Resham Babu Regmi","Xiuzhen Yu"],"authorMore":true,"abstract":"ABSTRACT Topologically protected nanoscale spin textures, such as magnetic skyrmions, have attracted significant interest for spintronics applications. While skyrmions in noncentrosymmetric materials are known to be stabilized by the Dzyaloshinskii‐Moriya interaction (DMI), their deliberate design in centrosymmetric materials remains a challenge. This difficulty largely stems from the complexity of controlling magnetocrystalline anisotropy–a critical factor in the absence of DMI. Here, we demonstrate the chemical tuning of magnetocrystalline anisotropy in the centrosymmetric Kagome magnet. The resulting compound exhibits a spin reorientation transition accompanied by an emergent skyrmion bubble lattice, confirmed by cryogenic Lorentz transmission electron microscopy and cryogenic Lorentz differential phase contrast scanning transmission electron microscopy. Our findings overcome a key materials design challenge and open possibilities for deliberate design of skyrmionic textures in centrosymmetric systems.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":37,"enAbstract":"ABSTRACT Topologically protected nanoscale spin textures, such as magnetic skyrmions, have attracted significant interest for spintronics applications. While skyrmions in noncentrosymmetric materials are known to be stabilized by the Dzyaloshinskii‐Moriya interaction (DMI), their deliberate design in centrosymmetric materials remains a challenge. This difficulty largely stems from the complexity of controlling magnetocrystalline anisotropy–a critical factor in the absence of DMI. Here, we demonstrate the chemical tuning of magnetocrystalline anisotropy in the centrosymmetric Kagome magnet . The resulting compound exhibits a spin reorientation transition accompanied by an emergent skyrmion bubble lattice, confirmed by cryogenic Lorentz transmission electron microscopy and cryogenic Lorentz differential phase contrast scanning transmission electron microscopy. Our findings overcome a key materials design challenge and open possibilities for deliberate design of skyrmionic textures in centrosymmetric systems.","zhAbstract":"摘要 拓扑保护的纳米尺度自旋结构，例如磁性斯格明子，已因其在自旋电子学应用中的潜力而引起了广泛关注。虽然已知非中心对称材料中的斯格明子可由Dzyaloshinskii-Moriya相互作用（DMI）稳定，但在中心对称材料中有意设计它们仍然是一项挑战。这一困难很大程度上源于控制磁晶各向异性的复杂性——在缺乏DMI的情况下，磁晶各向异性是一个关键因素。在此，我们展示了在中心对称Kagome磁体中对磁晶各向异性的化学调控。所得化合物表现出自旋重取向转变，并伴随出现斯格明子气泡晶格，这已通过低温洛伦兹透射电子显微镜和低温洛伦兹微分相位衬度扫描透射电子显微镜得到证实。我们的发现克服了一项关键的材料设计挑战，并为在中心对称体系中有意设计斯格明子织构开辟了可能性。"},{"title":"Supercurrent-controlled magnon transport via suppression of the superconducting gap","url":"https://doi.org/10.1103/jlhg-yy14","doi":"10.1103/jlhg-yy14","journal":"Physical Review Applied","jabbr":"Physical Review Applied","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Tetsuma Mandokoro","Yoichi Shiota","Hisakazu Matsuki","Ryusuke Hisatomi","Shutaro Karube","Akito Daido"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":38},{"title":"Traveling-wave-mediated remote magnon-magnon coupling","url":"https://doi.org/10.1103/yyd4-l1vx","doi":"10.1103/yyd4-l1vx","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Lihua Zhong","Chenyang Lu","Jiguang Yao","Bimu Yao","Wei Lu","Can-Ming Hu"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":39},{"title":"Pseudogauge field-driven magnon thermal Hall effect in two-dimensional compensated ferrimagnets","url":"https://doi.org/10.1103/8m9g-7frl","doi":"10.1103/8m9g-7frl","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Mohd Faizee","Abir De Sarkar"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":40},{"title":"Comparative analysis of unconventional spin-orbit torques and magnetization switching efficiencies in Fe 3 GeTe 2 /WTe 2","url":"https://doi.org/10.1103/n4mx-v1fx","doi":"10.1103/n4mx-v1fx","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetization switching","matchWhere":"标题：magnetization switching","score":9,"authors":["Niklas Kercher","Paul Noël","Emir Karadža","Pietro Gambardella"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":41},{"title":"Spin filtering by electron reflection from surfaces of collinear compensated magnets","url":"https://doi.org/10.1103/7mm4-xymn","doi":"10.1103/7mm4-xymn","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻"],"matchTerm":"spin filtering","matchWhere":"标题：spin filtering","score":9,"authors":["Eugene E. Krasovskii","A. N. Yaresko"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":42},{"title":"Parity-driven RKKY decoupling and anomalous 1 / R Dzyaloshinskii-Moriya interaction in odd-parity magnets","url":"https://doi.org/10.1103/9w3c-7kcr","doi":"10.1103/9w3c-7kcr","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"Dzyaloshinskii-Moriya interaction","matchWhere":"标题：Dzyaloshinskii-Moriya interaction","score":9,"authors":["Morteza Salehi","T. Farajollahpour"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":43},{"title":"Space group symmetry of chiral Fe-deficient van der Waals magnet Fe 3 − x GeTe 2 probed by convergent beam electron diffraction","url":"https://doi.org/10.1103/3hjn-dx1x","doi":"10.1103/3hjn-dx1x","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"van der Waals magnet","matchWhere":"标题：van der Waals magnet","score":9,"authors":["O. Zaiets","S. Subakti","D. Wolf","J. Steinweh","S. Parkin","A. Lubk"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":44},{"title":"Hybridization of a magnon mode with a higher-order topological photonic corner state","url":"https://doi.org/10.1063/5.0353242","doi":"10.1063/5.0353242","journal":"Applied Physics Letters","jabbr":"Applied Physics Letters","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Wen Qiao Wu","Shu-Man Huang","Jie Qian","Zhiwei Guo","Yi‐Pu Wang"],"authorMore":false,"abstract":"Photonic corner states in higher-order topological lattices combine topological localization with zero-dimensional field confinement, making them promising interfaces for enhanced light–matter interactions. Yet their coupling to material excitations remains largely unexplored. Here, we demonstrate hybridization between the Kittel mode of a yttrium iron garnet sphere and a higher-order topological photonic corner state in a two-dimensional Su–Schrieffer–Heeger microwave lattice. Tuning the Kittel mode through the corner-state resonance produces a pronounced avoided crossing with a minimum frequency splitting of 155.44 MHz. Moving the same sphere to the adjacent site reduces the splitting to 36.22 MHz, whereas no splitting is resolved in the bulk. The resulting coupling-strength map is concentrated at the corners and corroborates the corner-state assignment relative to extended edge and bulk modes. Our results show that higher-order topological corner states can serve as localized interfaces for cavity magnonics and hybrid topological light–matter systems.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":45,"enAbstract":"Photonic corner states in higher-order topological lattices combine topological localization with zero-dimensional field confinement, making them promising interfaces for enhanced light–matter interactions. Yet their coupling to material excitations remains largely unexplored. Here, we demonstrate hybridization between the Kittel mode of a yttrium iron garnet sphere and a higher-order topological photonic corner state in a two-dimensional Su–Schrieffer–Heeger microwave lattice. Tuning the Kittel mode through the corner-state resonance produces a pronounced avoided crossing with a minimum frequency splitting of 155.44 MHz. Moving the same sphere to the adjacent site reduces the splitting to 36.22 MHz, whereas no splitting is resolved in the bulk. The resulting coupling-strength map is concentrated at the corners and corroborates the corner-state assignment relative to extended edge and bulk modes. Our results show that higher-order topological corner states can serve as localized interfaces for cavity magnonics and hybrid topological light–matter systems.","zhAbstract":"高阶拓扑晶格中的光子角态将拓扑局域性与零维场约束相结合，使其成为增强光–物质相互作用的潜在界面。然而，它们与材料激发之间的耦合在很大程度上仍未被探索。在此，我们展示了钇铁石榴石球的Kittel模式与二维Su–Schrieffer–Heeger微波晶格中的高阶拓扑光子角态之间的杂化。通过角态共振调谐Kittel模式，产生了明显的避免交叉，最小频率劈裂为155.44 MHz。将同一球体移至相邻格点后，劈裂减小至36.22 MHz，而在体态中未分辨出劈裂。所得的耦合强度分布图集中在角上，并证实了相对于扩展的边缘模式和体模式而言的角态归属。我们的结果表明，高阶拓扑角态可以作为腔磁子学和混合拓扑光–物质系统的局域界面。"},{"title":"A liquid-crystal analogue of the skyrmion Hall effect","url":"https://doi.org/10.1038/s41567-026-03379-0","doi":"10.1038/s41567-026-03379-0","journal":"Nature Physics","jabbr":"Nature Physics","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Rodrigo C. V. Coelho","Hanqing Zhao","Guilherme N. C. Amaral","Ivan I. Smalyukh","M. M. Telo da Gama","Mykola Tasinkevych"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":46},{"title":"Coherent and incoherent interfacial spin transport: Quantum-to-classical crossover in spin superfluids","url":"https://doi.org/10.1103/9x45-12q2","doi":"10.1103/9x45-12q2","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运"],"matchTerm":"spin transport","matchWhere":"标题：spin transport","score":9,"authors":["A. R. Moura","L. S. L. Barbosa"],"authorMore":false,"abstract":"We investigate the thermodynamics of interfacial spin transport within a normal metal/ferromagnetic insulator/normal metal ($\\mathrm{NM/FMI/NM}$) trilayer heterostructure, where the central magnetic layer is described by the anisotropic quantum XXZ model. By employing the self-consistent harmonic approximation (SCHA) combined with a microscopic linear response formulation, we evaluate the interfacial spin-mixing conductance $g_{\\uparrow\\downarrow}$ across all spin regimes. We demonstrate that $g_{\\uparrow\\downarrow}$ uniquely decomposes into a coherent condensed component ($g_{\\mathrm{cond}}$), driven by the macroscopic phase of the spin superfluid, and an incoherent fluctuation-driven term ($g_{\\mathrm{fluct}}$) mediated by stochastic thermal magnons. Crucially, in the extreme quantum limit of $S = 1/2$, $g_{\\mathrm{cond}}$ drops steeply and vanishes at a finite coherence temperature $T_{\\mathrm{coh}}$. Conversely, the fluctuation-driven term $g_{\\mathrm{fluct}}$ vanishes at $T = 0$, exhibits a characteristic $T^2$ quadratic scaling at low temperatures, and undergoes a systematic $1/S$ amplitude suppression as the macroscopic magnetization becomes robust. Our microscopic insights bridge the gap between quantum many-body fluctuations and macroscopic spin-superfluid hydrodynamics, providing clear foundational principles for optimizing long-range coherent transport in quantum spintronic devices.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":47},{"title":"Si 29 nuclear spin diffusion effects on the electron spin resonance spectrum in silicon: Low temperature and high magnetic field regime","url":"https://doi.org/10.1103/417j-6hyz","doi":"10.1103/417j-6hyz","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运"],"matchTerm":"spin diffusion","matchWhere":"标题：spin diffusion","score":9,"authors":["V. A. Grabar","M. B. Lifshits","N. S. Averkiev"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":48},{"title":"Skyrmion and meron phases induced by spin-phonon coupling","url":"https://doi.org/10.1103/trdd-j3wy","doi":"10.1103/trdd-j3wy","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["E. Iroulart","F. A. Gómez Albarracín","H. Diego Rosales"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":49},{"title":"Strain induced magnetic order and magnetic anisotropy transitions in epitaxial SrM n 0.3 Ir 0.7 O₃ films","url":"https://doi.org/10.1103/sffm-3s75","doi":"10.1103/sffm-3s75","journal":"Physical Review Materials","jabbr":"Physical Review Materials","pubdate":"2026-10-19","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"标题：magnetic anisotropy","score":9,"authors":["Shengkai Liu","Yuqi Wang","Pengxiang Hou","Yang Wu","Jibo Xu","Ya-jie Han"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":50},{"title":"Spin-dependent electron transfer through a ring-wire coupled junction: role of in-plane electric field","url":"https://doi.org/10.1088/1361-648x/aeb0fa","doi":"10.1088/1361-648x/aeb0fa","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","自旋逻辑与神经形态器件"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、摘要：spintronic device","score":7,"authors":["Prabhab Patra","Santanu K Maiti"],"authorMore":false,"abstract":"Abstract We study spin-dependent transport in a hybrid magnetic system, where a non-magnetic (NM) wire is coupled to a side-attached antiferromagnetic mesoscopic ring, placed between two non-magnetic electrodes subject to an in-plane electric field oriented perpendicular to the NM wire. The system is described within a tight-binding framework, and transport properties are computed using the non-equilibrium Green’s function formalism. We consider two junction configurations distinguished by the ring-wire coupling: a single-coupled junction and a double-coupled junction. In the single-coupled configuration, the coupling geometry alone breaks the spin symmetry, yielding a finite spin polarization (SP) even without any external field. The in-plane electric field further enhances the symmetry breaking in both configurations, serving as an efficient tuning parameter that drives the SP nearly 100 % in the low-bias region. In the double-coupled configuration, spin symmetry is preserved in the absence of the external field, and the electric field acts as a sole source of symmetry breaking, producing a large SP. Finite temperature effects and different system sizes are examined, confirming the robustness of the observed features. To validate the findings over a wide parameter space, we considered different sets of parameters and found that the key signatures remain unchanged. Our results demonstrate that such hybrid structures are promising candidates for realizing an externally controllable spintronic device in low-dimensional systems.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":51},{"title":"Magnetic quadrupole current generation and accumulation in noncentrosymmetric systems","url":"https://doi.org/10.1103/vsw5-8s3w","doi":"10.1103/vsw5-8s3w","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"自旋轨道力矩SOT","topics":["自旋轨道力矩SOT","自旋流与自旋输运"],"matchTerm":"spin Hall effect","matchWhere":"摘要：spin Hall effect、摘要：spin injection","score":6,"authors":["Yuuga Takasu","Satoru Hayami"],"authorMore":false,"abstract":
