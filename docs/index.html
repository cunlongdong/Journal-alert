<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自旋电子学文献日报 · 文献卡片墙</title>
<style>
:root{
  --bg:#f1f2f4; --card:#fff; --ink:#1c1c1e; --ink2:#63636d; --ink3:#9d9da8;
  --line:#eeeef2; --red:#ff2442; --radius:16px;
  --sh:0 1px 2px rgba(16,16,24,.05), 0 6px 20px rgba(16,16,24,.06);
  --sh-hover:0 2px 6px rgba(16,16,24,.07), 0 14px 34px rgba(16,16,24,.12);
  --air-a:#ffb27a; --air-b:#ff5f7e;
  --rs-a:#63b3ff;  --rs-b:#3a5ce0;
  --chem-a:#c3a0ff; --chem-b:#7048e8;
  --bgc-a:#6ee0a8;  --bgc-b:#0b9e73;
  --gis-a:#5ed6c4;  --gis-b:#0d8f9e;
  --other-a:#c9ccd4; --other-b:#8b90a0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; padding-bottom:56px;
}
a{color:inherit;text-decoration:none}
svg.ic{display:block;flex:none}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(241,242,244,.84);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid rgba(0,0,0,.05);
}
.topbar-in{max-width:1560px;margin:0 auto;padding:14px 22px 0}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--red),#ff7a59);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 3px 10px rgba(255,36,66,.32);
}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand .sub{font-size:12.5px;color:var(--ink3);margin-left:2px}
.brand .spacer{flex:1}
.kpi{display:flex;gap:6px;flex-wrap:wrap}
.kpi span{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:3px 9px;border-radius:999px;white-space:nowrap}
.kpi b{color:var(--red);font-weight:700}

.controls{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:.16s;display:flex;align-items:center;gap:7px;font-family:inherit;
}
.tab svg{width:15px;height:15px;stroke-width:1.9}
.tab:hover{border-color:#dcdce4;transform:translateY(-1px)}
.tab .n{font-size:11.5px;color:var(--ink3);font-weight:600}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.on .n{color:rgba(255,255,255,.66)}
.tab.on svg{stroke-width:2}
.search{
  flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 15px;font-size:13.5px;outline:none;font-family:inherit;color:var(--ink);transition:.16s;
}
.search:focus{border-color:#ffc2cc;box-shadow:0 0 0 3px rgba(255,36,66,.09)}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:.16s}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.count{font-size:12.5px;color:var(--ink3);margin-left:auto;white-space:nowrap}

.grouphead{max-width:1560px;margin:24px auto 0;padding:0 22px;display:flex;align-items:center;gap:10px}
.grouphead h2{font-size:15.5px;margin:0;font-weight:800;display:flex;align-items:center;gap:8px}
.grouphead h2 svg{width:18px;height:18px;stroke-width:1.9}
.grouphead .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grouphead .gn{font-size:12.5px;color:var(--ink3);font-weight:600}
.g-air h2{color:#e8455f} .g-rs h2{color:#3a5ce0} .g-chem h2{color:#7048e8} .g-bgc h2{color:#0b9e73} .g-gis h2{color:#0d8f9e}

.wall{max-width:1560px;margin:0 auto;padding:14px 22px 0;columns:4;column-gap:16px}
@media(max-width:1380px){.wall{columns:3}}
@media(max-width:1000px){.wall{columns:2}}
@media(max-width:620px){
  .wall{columns:1}
  .topbar-in,.controls,.wall,.grouphead{padding-left:14px;padding-right:14px}
  .kpi{display:none}
}
.card{
  break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh);margin:0 0 16px;cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  display:inline-block;width:100%;vertical-align:top;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-hover)}

.cover{position:relative;height:108px;overflow:hidden}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.3) 1px,transparent 1px);
  background-size:14px 14px;opacity:.45;
}
.t-air .cover{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs  .cover{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .cover{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .cover{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .cover{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .cover{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.cover .icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#fff;opacity:.28;width:76px;height:76px;z-index:1}
.cover .icon svg{width:100%;height:100%;stroke-width:1.25}
.cover .jr{
  position:absolute;left:12px;bottom:11px;right:60px;color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.3px;text-shadow:0 1px 6px rgba(0,0,0,.25);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;
}
.cover .tp{
  position:absolute;left:12px;top:10px;background:rgba(255,255,255,.95);color:#2a2a30;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}
.cover .sc{
  position:absolute;right:12px;top:10px;background:rgba(0,0,0,.28);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:999px;z-index:2;backdrop-filter:blur(4px);
  font-variant-numeric:tabular-nums;
}
.tier{position:absolute;left:0;bottom:0;height:3px;width:100%;z-index:2}
.tier.must_read{background:#ff2442}
.tier.worth_reading{background:#ffab2e}
.tier.other{background:rgba(255,255,255,.6)}

.body{padding:12px 14px 11px}
.title{font-size:14.5px;font-weight:700;line-height:1.42;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.excerpt{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.excerpt.none{color:var(--ink3);font-style:italic;font-size:12px;-webkit-line-clamp:2}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f4f5f7;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.must_read{background:#ffe9ed;color:#e01b39}
.tag.worth_reading{background:#fff4e3;color:#c67a00}
.tag.other{background:#f0f1f4;color:#7c8090}
.tag.match{background:#eef4ff;color:#3a5ce0}
.tag.cross{background:#e6f7f5;color:#0d8f9e}

.foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fcfcfd}
.av{width:22px;height:22px;border-radius:50%;flex:none;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.t-air .av{background:linear-gradient(135deg,var(--air-a),var(--air-b))}
.t-rs .av{background:linear-gradient(135deg,var(--rs-a),var(--rs-b))}
.t-chem .av{background:linear-gradient(135deg,var(--chem-a),var(--chem-b))}
.t-bgc .av{background:linear-gradient(135deg,var(--bgc-a),var(--bgc-b))}
.t-gis .av{background:linear-gradient(135deg,var(--gis-a),var(--gis-b))}
.t-other .av{background:linear-gradient(135deg,var(--other-a),var(--other-b))}
.au{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dt{font-size:11.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.empty{max-width:1560px;margin:70px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty svg{width:44px;height:44px;margin:0 auto 12px;stroke-width:1.5;opacity:.5;display:block}

.mask{position:fixed;inset:0;background:rgba(20,20,26,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.mask.on{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.mhead{position:relative;padding:18px 22px 16px;color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.26) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.mhead .mj{font-size:12.5px;font-weight:700;opacity:.95;position:relative;z-index:2;letter-spacing:.3px}
.mhead h3{font-size:18px;line-height:1.42;margin:8px 0 0;position:relative;z-index:2;font-weight:800;text-shadow:0 1px 8px rgba(0,0,0,.18);padding-right:26px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2;margin-top:11px}
.mmeta span{background:rgba(255,255,255,.95);color:#2a2a30;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.mclose{position:absolute;right:14px;top:14px;z-index:3;border:0;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.22);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;font-family:inherit}
.mclose:hover{background:rgba(0,0,0,.36)}
.mbody{padding:18px 22px 22px}
.sec-t{font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.8px;margin:0 0 8px}
.abs{font-size:14px;line-height:1.78;color:#33333a;margin:0 0 20px;white-space:pre-wrap}
.authors{font-size:13.5px;line-height:1.7;color:var(--ink2);margin:0 0 18px}
.kv{font-size:12.5px;color:var(--ink2);line-height:1.9;margin:0 0 18px}
.kv code{background:#f4f5f7;padding:2px 7px;border-radius:5px;font-size:12px;color:#3a3a44}
.linkrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:9px 17px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:.16s}
.btn:hover{border-color:#d8d8e0;transform:translateY(-1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 12px rgba(255,36,66,.28)}
.btn.pri:hover{background:#f01a38}
/* Journal-alert uniform card grid · paste before the closing CSS tag in jalert/cards.py */
.wall {
  display: grid;
  columns: auto;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: 392px;
  gap: 16px;
  align-items: stretch;
}
@media (max-width: 1380px) {
  .wall { columns: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1000px) {
  .wall { columns: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 620px) {
  .wall { columns: auto; grid-template-columns: minmax(0, 1fr); }
}
.card {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  margin: 0;
  min-width: 0;
  break-inside: auto;
}
.cover { flex: 0 0 108px; }
.body {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.title { flex: 0 0 auto; }
.excerpt { flex: 0 0 auto; }
.tagrow {
  flex: 0 0 auto;
  max-height: 48px;
  overflow: hidden;
  margin-top: auto;
}
.foot {
  flex: 0 0 42px;
  min-height: 42px;
  overflow: hidden;
  margin-top: auto;
}

/* JALERT_BILINGUAL_V1: English / Chinese bilingual paper previews */
.bilingual-preview { margin-top: 6px; min-width: 0; }
.bilingual-preview .language { display:block; color:#667085; font-size:10.5px;
  font-weight:750; letter-spacing:.15px; margin-bottom:2px; }
.bilingual-preview .excerpt { display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; margin:0;
  font-size:11.5px; line-height:1.45; color:var(--ink2); }
.bilingual-preview.absent .excerpt { color:var(--ink3); font-style:italic; }
.bilingual-section .sec-t { margin-top:15px; }
.bilingual-section .abs { overflow-wrap:anywhere; }
.english-title { display:block; font-size:0.76em; font-weight:500; color:var(--ink3); padding-top:3px; }

</style>
</head>

ces. In this work, we investigated the stability and current-driven dynamics of k π -skyrmions ( k = 1,2,3 , and 4) in racetrack nanostructures. Stability phase diagrams were constructed as a function of the interfacial Dzyaloshinskii–Moriya interaction strength ( D int ) and the perpendicular magnetic field ( B z ). Our results showed that the stabilization range of each k π -skyrmion strongly depends on D int . In addition, the diameters of all textures increased with increasing D int and decreased with increasing B z . The current-driven dynamics induced by spin–orbit torque were then investigated. Our results showed that the velocity of all k π -skyrmions increased with current density and decreased with perpendicular magnetic field. Although the 3 π -skyrmion exhibited larger longitudinal velocities during the transient regime than the π -skyrmion, both textures reached nearly identical steady-state velocities. A similar behavior was observed for the 2 π - and 4 π -skyrmions. The steady-state dynamics were further analyzed using the Thiele formalism, which reproduced the trends observed in the micromagnetic simulations. These findings provide insight into the stabilization and transport properties of k π -skyrmions and support their potential use in future spintronic applications.","zhTitle":"赛道纳米结构中kπ-斯格明子的自旋轨道矩操控及其在自旋电子存储器中的应用","zhAbstract":"kπ-斯格明子是一种拓扑磁结构，在自旋电子器件中具有广阔的应用前景。在本工作中，我们研究了赛道纳米结构中kπ-斯格明子（k=1、2、3和4）的稳定性及电流驱动动力学。我们构建了稳定性相图，其作为界面Dzyaloshinskii–Moriya相互作用强度（D_int）和垂直磁场（B_z）的函数。我们的结果表明，每种kπ-斯格明子的稳定范围强烈依赖于D_int。此外，所有结构的直径均随D_int增大而增大，并随B_z增大而减小。随后研究了由自旋轨道力矩诱导的电流驱动动力学。我们的结果表明，所有kπ-斯格明子的速度均随电流密度增大而增大，并随垂直磁场增大而减小。尽管3π-斯格明子在瞬态阶段表现出比π-斯格明子更大的纵向速度，但两种结构达到了几乎相同的稳态速度。对于2π-和4π-斯格明子也观察到了类似的行为。我们进一步使用Thiele形式体系分析了稳态动力学，其结果再现了微磁模拟中观察到的趋势。这些发现为kπ-斯格明子的稳定化和输运性质提供了见解，并支持其在未来自旋电子应用中的潜在用途。"},{"title":"Low Energy Excitations in a [4]Triangulene Honeycomb Antiferromagnet","url":"https://doi.org/10.1021/acsnano.6c11666","doi":"10.1021/acsnano.6c11666","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","手性磁结构与自旋动力学"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet、摘要：spin dynamics","score":15,"authors":["Aidan Delgado","Carolin Dusold","James Wu","Jingwei Jiang","Christina M. Dadich","Adam Cronin"],"authorMore":true,"abstract":"Abstract Carbon-based synthetic lattices offer a versatile platform for the realization and control of correlated quantum effects at the nanoscale. Advances in on-surface synthesis have enabled the fabrication of increasingly complex molecular frameworks, providing opportunities for the exploration and engineering of custom tailored electronic and magnetic phases. Here, we report the design, on-surface synthesis, and characterization of a two-dimensional (2D) covalent organic framework (COF) assembled from D3h symmetric S = 3/2 [4]triangulene building blocks arranged in a honeycomb structure. Combined scanning probe microscopy and spectroscopy, corroborated by first-principles density functional theory (DFT) and GW calculations, establish an antiferromagnetic (AFM) insulating ground state. Low energy spectroscopy resolves spin excitations in both one-dimensional (1D) chains and extended 2D networks, providing direct insight into the emergent spin dynamics and establishing a modular platform to explore quantum magnetism in a π-conjugated organic system.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":5,"enAbstract":"Abstract Carbon-based synthetic lattices offer a versatile platform for the realization and control of correlated quantum effects at the nanoscale. Advances in on-surface synthesis have enabled the fabrication of increasingly complex molecular frameworks, providing opportunities for the exploration and engineering of custom tailored electronic and magnetic phases. Here, we report the design, on-surface synthesis, and characterization of a two-dimensional (2D) covalent organic framework (COF) assembled from D3h symmetric S = 3/2 [4]triangulene building blocks arranged in a honeycomb structure. Combined scanning probe microscopy and spectroscopy, corroborated by first-principles density functional theory (DFT) and GW calculations, establish an antiferromagnetic (AFM) insulating ground state. Low energy spectroscopy resolves spin excitations in both one-dimensional (1D) chains and extended 2D networks, providing direct insight into the emergent spin dynamics and establishing a modular platform to explore quantum magnetism in a π-conjugated organic system.","zhTitle":"[4]三角烯蜂窝反铁磁体中的低能激发","zhAbstract":"摘要 碳基合成晶格为在纳米尺度上实现和调控关联量子效应提供了一个多功能的平台。表面合成技术的进步使得制备日益复杂的分子框架成为可能，为探索和工程化定制电子相与磁相提供了机会。在此，我们报道了一种二维（2D）共价有机框架（COF）的设计、表面合成与表征，该框架由D3h对称的S = 3/2 [4]三角烯构建单元以蜂窝结构排列组装而成。结合扫描探针显微镜与光谱学，并辅以第一性原理密度泛函理论（DFT）和GW计算，确立了反铁磁（AFM）绝缘基态。低能光谱分辨出一维（1D）链和扩展二维网络中的自旋激发，为涌现的自旋动力学提供了直接洞察，并建立了一个用于探索π共轭有机体系中量子磁性的模块化平台。"},{"title":"The challenging path toward high-temperature quantum anomalous hall effect in MnBi 2 Te 4","url":"https://doi.org/10.1088/1361-648x/aeb217","doi":"10.1088/1361-648x/aeb217","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","二维磁性与拓扑自旋电子学"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、标题：quantum anomalous Hall","score":13,"authors":["Liangcai Xu","Yuetan Li","Zichen Lian","Jinsong Zhang"],"authorMore":false,"abstract":"Abstract Since its experimental discovery as an intrinsic antiferromagnetic topological insulator in 2019, the MnBi 2 Te 4 family of materials has greatly propelled the development of condensed matter physics over the past several years. This family naturally integrates long-range magnetic order with topological band structure within a two-dimensional van der Waals layered material, providing an unprecedentedly clean platform for exploring quantum phenomena such as axion insulators, the quantum anomalous Hall effect, and the topological magnetoelectric effect. However, the transition from fundamental research to practical applications, particularly the realization of high-temperature quantum effects, is confronted with severe challenges in intrinsic defects, magnetic ground-state tuning, and electronic structure engineering. This article aims to review the current development status of the MnBi 2 Te 4 family, focusing on its core quantum phenomena, recent revolutionary breakthroughs in sample preparation techniques, and diverse tuning methods. On this basis, we outline possible pathways toward high-temperature quantum effects through innovations in material synthesis, interface engineering, and multi-strategy tuning and heterostructure engineering.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":6,"enAbstract":"Abstract Since its experimental discovery as an intrinsic antiferromagnetic topological insulator in 2019, the MnBi 2 Te 4 family of materials has greatly propelled the development of condensed matter physics over the past several years. This family naturally integrates long-range magnetic order with topological band structure within a two-dimensional van der Waals layered material, providing an unprecedentedly clean platform for exploring quantum phenomena such as axion insulators, the quantum anomalous Hall effect, and the topological magnetoelectric effect. However, the transition from fundamental research to practical applications, particularly the realization of high-temperature quantum effects, is confronted with severe challenges in intrinsic defects, magnetic ground-state tuning, and electronic structure engineering. This article aims to review the current development status of the MnBi 2 Te 4 family, focusing on its core quantum phenomena, recent revolutionary breakthroughs in sample preparation techniques, and diverse tuning methods. On this basis, we outline possible pathways toward high-temperature quantum effects through innovations in material synthesis, interface engineering, and multi-strategy tuning and heterostructure engineering."},{"title":"Magnetocaloric effect in one-dimensional chain spin-flop antiferromagnetic Brannerite MnV2O6","url":"https://doi.org/10.1016/j.jmmm.2026.174675","doi":"10.1016/j.jmmm.2026.174675","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-12-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["L. Gowsalya","N. Lakshminarasimhan"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":7,"zhTitle":"一维链自旋翻转反铁磁褐钇铌矿型MnV2O6中的磁热效应"},{"title":"Strain-induced enhanced room-temperature magnetization in epitaxial Mn3Sn thin films for antiferromagnetic spintronics","url":"https://doi.org/10.1016/j.jallcom.2026.191741","doi":"10.1016/j.jallcom.2026.191741","journal":"Journal of Alloys and Compounds","jabbr":"Journal of Alloys and Compounds","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"标题：antiferromagnetic","score":12,"authors":["Subhankar Das","Sriram Kasilingam","Ajoy Dinda","Bilal Jamshed","Biswanath Pramanik","Subrata Biswas"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":8,"zhTitle":"应变诱导的外延Mn3Sn薄膜中增强的室温磁化及其在反铁磁自旋电子学中的应用"},{"title":"Antiphase boundary-driven large exchange bias and negative magnetoresistance in NiCo2O4","url":"https://doi.org/10.1016/j.jmmm.2026.174575","doi":"10.1016/j.jmmm.2026.174575","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange bias","matchWhere":"标题：exchange bias","score":12,"authors":["Biswanath Pramanik","Pushpesh Pathak","Binoy K. Hazra"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":9,"zhTitle":"反相畴界驱动的NiCo2O4大交换偏置与负磁阻"},{"title":"Large coercivity and giant exchange bias in Eu₂NiIrO₆","url":"https://doi.org/10.1016/j.jmmm.2026.174650","doi":"10.1016/j.jmmm.2026.174650","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange bias","matchWhere":"标题：exchange bias","score":12,"authors":["T. Durga Rao","Manish K. Niranjan","K. Ramesh Kumar","G. Bhavani","B. Sattibabu","Thao T. Tran"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":10,"zhTitle":"Eu₂NiIrO₆中的大矫顽力和巨交换偏置"},{"title":"Sector-resolved microcanonical entropy of the spin-1/2 Heisenberg antiferromagnet on the Sierpiński gasket","url":"https://doi.org/10.1016/j.jmmm.2026.174633","doi":"10.1016/j.jmmm.2026.174633","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["J. Ricardo de Sousa","Orion Ciftja"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":11,"zhTitle":"Sierpiński垫上自旋-1/2海森堡反铁磁体的扇区分辨微正则熵"},{"title":"Surface-enhanced anomalous Hall conductivity in ferrimagnetic Mn2PtSn Heusler alloy","url":"https://doi.org/10.1016/j.jmmm.2026.174616","doi":"10.1016/j.jmmm.2026.174616","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["Sadikul Alom","Bhargab Kakati","Munima B. Sahariah"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":12,"enAbstract":"The anomalous Hall conductivity of the bulk ferrimagnetic Heusler alloy Mn 2 PtSn is calculated using density functional theory combined with maximally localized Wannier functions. The corresponding Berry curvature distributions are then computed, from which the net anomalous Hall conductivity is obtained. To enhance the anomalous Hall conductivity through symmetry reduction, three energetically stable (001) surface terminations of Mn 2 PtSn are considered, and their Berry curvature distributions are compared with those of the bulk unit cell. The increased number of Berry curvature peaks at the surface terminations leads to a higher value of the anomalous Hall conductivity. The anomalous Hall conductivity is also evaluated as a function of the Fermi level, and the presence of sharp peaks near the Fermi level indicates the potential for further enhancement through Fermi-level tuning. The high value of anomalous Hall conductivity at the surfaces highlights their potential for application in thin-film memory devices, where surface-driven properties are crucial. • Anomalous Hall conductivity (AHC) of bulk and (001) Mn 2 PtSn surfaces is calculated. • Surface-induced symmetry-breaking enhances the AHC. • The Pt full monolayer shows the enhanced Berry curvature and AHC due to strong spin–orbit interaction. • AHC peak near Fermi level suggests potential for further AHC enhancement via tuning.","zhTitle":"亚铁磁Mn2PtSn Heusler合金中的表面增强反常霍尔电导率"},{"title":"Characterization of ferrimagnetic FeGd coatings formed by a magnetron sputtering","url":"https://doi.org/10.1016/j.jmmm.2026.174566","doi":"10.1016/j.jmmm.2026.174566","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"ferrimagnetic","matchWhere":"标题：ferrimagnetic","score":12,"authors":["V.O. Semin","M.V. Shandrikov","V.R. Utyaganova","M.G. Ostapenko","F.A. D'yachenko","A.A. Cherkasov"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":13,"zhTitle":"由磁控溅射形成的亚铁磁FeGd涂层的表征"},{"title":"Intrinsic i‐Wave Altermagnetism in 2D Graphene Superlattices","url":"https://doi.org/10.1002/advs.78167","doi":"10.1002/advs.78167","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnetism","matchWhere":"标题：altermagnetism","score":12,"authors":["Cuiju Yu","Jose L. Lado"],"authorMore":false,"abstract":"ABSTRACT Altermagnets feature unconventional magnetism due to their momentum‐dependent spin splitting purely driven by magnetic order, for which a variety of transition‐metal‐based ‐wave altermagnets have been proposed. However, carbon‐based altermagnets remain largely unexplored, even though magnetism of graphene nanostructures has been widely demonstrated. Here, through a comprehensive symmetry analysis, we establish a symmetry‐guided design principle for realizing higher‐order ‐wave altermagnetism in graphene antidot superlattices and demonstrate its emergence in both monolayer and bilayer graphene, particularly in the Bernal‐stacked bilayer. By combining atomistic tight binding models and first principles methods, we show the appearance of an interaction‐induced ‐wave altermagnetic splitting, originating from the intrinsic magnetic instability of 2D graphene antidot superlattices. Our work establishes a strategy to engineer ‐wave altermagnetism in a graphene platform, extending the materials landscape beyond conventional ‐wave altermagnets and putting forward a carbon‐based platform for higher‐order altermagnetic spintronics.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":14,"enAbstract":"ABSTRACT Altermagnets feature unconventional magnetism due to their momentum‐dependent spin splitting purely driven by magnetic order, for which a variety of transition‐metal‐based ‐wave altermagnets have been proposed. However, carbon‐based altermagnets remain largely unexplored, even though magnetism of graphene nanostructures has been widely demonstrated. Here, through a comprehensive symmetry analysis, we establish a symmetry‐guided design principle for realizing higher‐order ‐wave altermagnetism in graphene antidot superlattices and demonstrate its emergence in both monolayer and bilayer graphene, particularly in the Bernal‐stacked bilayer. By combining atomistic tight binding models and first principles methods, we show the appearance of an interaction‐induced ‐wave altermagnetic splitting, originating from the intrinsic magnetic instability of 2D graphene antidot superlattices. Our work establishes a strategy to engineer ‐wave altermagnetism in a graphene platform, extending the materials landscape beyond conventional ‐wave altermagnets and putting forward a carbon‐based platform for higher‐order altermagnetic spintronics.","zhTitle":"二维石墨烯超晶格中的本征i波交错磁性","zhAbstract":"摘要 交错磁体因其纯粹由磁序驱动的、依赖动量的自旋劈裂而具有非常规磁性，为此已提出多种过渡金属基d波交错磁体。然而，碳基交错磁体在很大程度上仍未被探索，尽管石墨烯纳米结构的磁性已被广泛证实。在此，通过全面的对称性分析，我们建立了一种对称性引导的设计原则，用于在石墨烯反点超晶格中实现高阶i波交错磁性，并证明其在单层和双层石墨烯中均可出现，尤其是在Bernal堆叠双层石墨烯中。通过结合原子级紧束缚模型和第一性原理方法，我们展示了由二维石墨烯反点超晶格的本征磁不稳定性所导致的相互作用诱导的i波交错磁劈裂的出现。我们的工作建立了一种在石墨烯平台上设计i波交错磁性的策略，将材料范围扩展到传统d波交错磁体之外，并提出了一种用于高阶交错磁自旋电子学的碳基平台。"},{"title":"Terahertz field-induced giant symmetry modulations in a van der Waals antiferromagnet","url":"https://doi.org/10.1038/s41467-026-78519-4","doi":"10.1038/s41467-026-78519-4","journal":"Nature Communications","jabbr":"Nat Commun","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["Sheikh Rubaiat Ul Haque","Martin J. Cross","Sangeeta Rajpurohit","Jonah B. Haber","Christopher J. Ciccarino","Alexandra C. Zimmerman"],"authorMore":true,"abstract":"Abstract Strong-field terahertz (THz) excitations enable dynamic control over electronic, lattice and symmetry degrees of freedom in quantum materials. Here, we uncover pronounced terahertz-induced symmetry modulations and coherent phonon dynamics in the van der Waals antiferromagnet MnPS 3, in which inversion symmetry is broken by its antiferromagnetic spin configuration. Our time-resolved second harmonic generation measurements reveal long-lived giant oscillations in the antiferromagnetic phase, with amplitudes comparable to the equilibrium signal, driven by phonons involving percent-level atomic displacements relative to the equilibrium bond lengths. The temporal evolution of the rotational anisotropy patterns indicates a dynamic breaking of mirror symmetry, modulated by two vibrational modes at 1.7 THz and 4.5 THz, with the former corresponding to a hidden mode not observed in equilibrium spectroscopy. These effects arise in part from a field-induced charge rearrangement mechanism that lowers the local crystal symmetry and couples to the phonon modes. We uncover a long-lived field-driven response with a complex THz polarization dependence, consistent with a metastable state of reduced symmetry. Through comparison with simulations, we interpret this response in terms of a potential antiferromagnetic-to-ferrimagnetic transition. Our results establish an effective field-tunable pathway for driving excitations otherwise weak in equilibrium.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":15,"enAbstract":"Abstract Strong-field terahertz (THz) excitations enable dynamic control over electronic, lattice and symmetry degrees of freedom in quantum materials. Here, we uncover pronounced terahertz-induced symmetry modulations and coherent phonon dynamics in the van der Waals antiferromagnet MnPS 3 , in which inversion symmetry is broken by its antiferromagnetic spin configuration. Our time-resolved second harmonic generation measurements reveal long-lived giant oscillations in the antiferromagnetic phase, with amplitudes comparable to the equilibrium signal, driven by phonons involving percent-level atomic displacements relative to the equilibrium bond lengths. The temporal evolution of the rotational anisotropy patterns indicates a dynamic breaking of mirror symmetry, modulated by two vibrational modes at 1.7 THz and 4.5 THz, with the former corresponding to a hidden mode not observed in equilibrium spectroscopy. These effects arise in part from a field-induced charge rearrangement mechanism that lowers the local crystal symmetry and couples to the phonon modes. We uncover a long-lived field-driven response with a complex THz polarization dependence, consistent with a metastable state of reduced symmetry. Through comparison with simulations, we interpret this response in terms of a potential antiferromagnetic-to-ferrimagnetic transition. Our results establish an effective field-tunable pathway for driving excitations otherwise weak in equilibrium.","zhTitle":"太赫兹场诱导的范德华反铁磁体中巨大对称性调制"},{"title":"Ground-state properties of the S = 3 2 anisotropic triangular lattice antiferromagnet Na 3 Cr (PO 4) 2","url":"https://doi.org/10.1103/d35n-4jtr","doi":"10.1103/d35n-4jtr","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnet","matchWhere":"标题：antiferromagnet","score":12,"authors":["A. Magar","Sebin J. Sebastian","Q.-P. Ding","Y. Skourski","A. A. Tsirlin","Y. Furukawa"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":16},{"title":"Operating regimes and materials limits of nonlinear magnon dynamics in Co-doped YIG","url":"https://doi.org/10.1016/j.jmmm.2026.174649","doi":"10.1016/j.jmmm.2026.174649","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-12-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["A.M. Tishin"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":17,"zhTitle":"Co掺杂YIG中非线性磁振子动力学的运行区间与材料极限"},{"title":"Modulation of Current-Induced Magnetization Switching by Tb Layer Thickness in Ti/Pt/Co/Tb/Ti Heterostructures","url":"https://doi.org/10.1016/j.jmmm.2026.174674","doi":"10.1016/j.jmmm.2026.174674","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetization switching","matchWhere":"标题：magnetization switching","score":9,"authors":["Shumin Lv","Zhicheng Wang","Mengjia Sun","Wenrui Guo","Liang Liu","Xiangxiang Zhao"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":18,"zhTitle":"Ti/Pt/Co/Tb/Ti异质结构中Tb层厚度对电流诱导磁化翻转的调制"},{"title":"Chirality-Barrier skyrmion racetrack with topological protection, Hall effect suppression, and reconfigurable logic","url":"https://doi.org/10.1016/j.jmmm.2026.174638","doi":"10.1016/j.jmmm.2026.174638","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Xue-Feng Zhang","Wenbin Liu","Xiao-Ping Ma","Hongyan Zhang","Mengyao Han","Cunlong Dong"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":19,"enAbstract":"Simultaneous suppression of the skyrmion Hall effect (SkHE) and preservation of skyrmion topological integrity remain critical challenges for skyrmion-based racetrack devices. We propose a chirality-engineered racetrack architecture in which a Dzyaloshinskii–Moriya interaction (DMI) sign reversal creates an energy barrier with a dual function: preserving skyrmion integrity by preventing inter-skyrmion merger into stripe domains, and providing a repulsive force that counterbalances the Magnus force to suppress the SkHE. The barrier also enables helicity-based encoding and reconfigurable AND/OR logic. By tuning the transition width w , the device operates in two regimes: crosstalk-free transport for w \u003e 10 nm , and logic operations via inter-skyrmion interactions for w ≤ 10 nm . For w ≥ 20 nm , topological charge Q ≈ 2 is preserved throughout. Thiele-equation analysis identifies the off-diagonal SOT coupling integral I x y as the governing velocity parameter. An optimal width w = 20 nm maximizes the threshold current density ( J th = 2.7 × 1 0 12 A / m 2 ) and steady-state velocity ( v ̄ ∼ 296 m / s ). Barrier-force model verification confirms the analytic prediction F y = − 2 π R t F D 0 / w . This architecture provides a compact memory-logic integrated platform within a single racetrack.","zhTitle":"手性势垒斯格明子赛道，具有拓扑保护、霍尔效应抑制和可重构逻辑","zhAbstract":"手性势垒斯格明子赛道，具有拓扑保护、霍尔效应抑制和可重构逻辑 同时抑制斯格明子霍尔效应（SkHE）并保持斯格明子拓扑完整性，仍然是基于斯格明子的赛道器件面临的关键挑战。我们提出了一种手性工程化赛道架构，其中Dzyaloshinskii–Moriya相互作用（DMI）符号反转产生一个具有双重功能的能量势垒：通过防止斯格明子间合并为条纹畴来保持斯格明子完整性，并提供排斥力以抵消马格努斯力从而抑制SkHE。该势垒还使基于螺旋度的编码和可重构AND/OR逻辑成为可能。通过调节过渡宽度w，器件工作在两种 regime：w \u003e 10 nm 时的无串扰输运，以及 w ≤ 10 nm 时通过斯格明子间相互作用实现逻辑操作。对于 w ≥ 20 nm，拓扑电荷 Q ≈ 2 在整个过程中得以保持。Thiele方程分析确定非对角SOT耦合积分 I x y 为主导速度参数。最佳宽度 w = 20 nm 使阈值电流密度（ J th = 2.7 × 1 0 12 A / m 2 ）和稳态速度（ v ̄ ∼ 296 m / s ）最大化。势垒力模型验证确认了解析预测 F y = − 2 π R t F D 0 / w 。该架构在单一赛道内提供了一个紧凑的存储-逻辑集成平台。"},{"title":"Multi-scale characterization of magnetic anisotropy via magnetic acoustic emission, Barkhausen noise and magnetic domain observation","url":"https://doi.org/10.1016/j.jmmm.2026.174668","doi":"10.1016/j.jmmm.2026.174668","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"标题：magnetic anisotropy","score":9,"authors":["YuFan Zeng","Fasheng Qiu","Yao Chen"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":20,"zhTitle":"基于磁声发射、巴克豪森噪声和磁畴观测的磁各向异性多尺度表征"},{"title":"The magnetic immunity of perpendicular STT-MRAM","url":"https://doi.org/10.1016/j.jmmm.2026.174570","doi":"10.1016/j.jmmm.2026.174570","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"自旋转移力矩与自旋电子存储","topics":["自旋转移力矩与自旋电子存储"],"matchTerm":"STT-MRAM","matchWhere":"标题：STT-MRAM","score":9,"authors":["Zhengren Yan","Pengqi Lu","Yuyan Chu","Yizhou Liu","Haifeng Du","Shikun He"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":21,"zhTitle":"垂直STT-MRAM的磁免疫性"},{"title":"Impact of He+ ion irradiation on the domain wall dynamics in Pd/Co/Pd trilayers with perpendicular magnetic anisotropy","url":"https://doi.org/10.1016/j.jmmm.2026.174543","doi":"10.1016/j.jmmm.2026.174543","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"perpendicular magnetic anisotropy","matchWhere":"标题：perpendicular magnetic anisotropy","score":9,"authors":["Anurag Keloth","Sakshath Sadashivaiah","Parswajit Kalita","Rakhul Raj","V. Raghavendra Reddy","Bikram Das"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":22,"enAbstract":"Heavy metal/ferromagnetic-based heterostructures with perpendicular magnetic anisotropy (PMA) are prototypes for domain wall (DW)-based spintronic devices. We explored the impact of He + ion irradiation on the bubble DW dynamics in Pd/Co/Pd trilayers with PMA. The effective magnetic anisotropy ( K e f f ) is enhanced by 20% when irradiated at the lowest fluence value, 1 × 1 0 14 He + / cm 2 and further, it decreases with an increase in fluence. Field-induced domain wall motion studies revealed that the sample irradiated at this fluence required a higher magnetic field for bubble domain walls to attain the same velocity as in the pristine sample. The bubble domain walls in the sample irradiated at this fluence expand at a rate of 1.1 mm/s, in contrast to the pristine sample’s rate of 0.38 mm/s near the coercive region, and this expansion rate diminishes with increasing fluence. At the lowest fluence value, bubble domains increase in size while their number density diminishes. However, with increased fluence, the size of the bubble domains reduces and their number density rises. Higher fluence values increase the interlayer roughness, driven by ballistic collisions between low-energy ions and atoms. The enhanced intermixing at higher fluence results in reduced saturation magnetization and anisotropy energy. Thus, by engineering the interfaces of the heterostructure and the magnetic anisotropy, ion interactions can be used to tune the pinning-controlled dynamics of magnetic bubble domains in Pd/Co/Pd based spintronic devices.","zhTitle":"He+离子辐照对具有垂直磁各向异性的Pd/Co/Pd三层膜中畴壁动力学的影响"},{"title":"Thermally driven stochastic magnetic-state selection and competing skyrmion annihilation pathways","url":"https://doi.org/10.1016/j.jmmm.2026.174646","doi":"10.1016/j.jmmm.2026.174646","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["F. Tejo","D. Cortés-Ortuño","J. Escrig"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":23,"enAbstract":"We investigate current-driven skyrmion nucleation and annihilation in confined Ir/Co/Pt nanodots, focusing on the role of thermal fluctuations. While minimum-energy approaches predict well-defined transition mechanisms, we show that finite-temperature dynamics can lead to distinct magnetic configurations under identical nominal conditions. Micromagnetic simulations including spin-transfer torques, Oersted fields, and thermal noise reveal stochastic variability in the current-driven magnetic response, while preserving reproducible current-dependent magnetic regimes across independent thermal-noise realisations. Comparison with geodesic nudged elastic band (GNEB) calculations identifies two competing skyrmion annihilation mechanisms, namely interior collapse and boundary-mediated annihilation, with markedly different activation barriers. At T = 300 K, the corresponding maximum barriers are approximately 44.7 k B T and 21.2 k B T , respectively, indicating that boundary-mediated annihilation is strongly kinetically favoured under thermal activation. These results highlight the interplay between energy landscape topology and stochastic dynamics, providing new insight into current-driven skyrmion transitions in confined geometries.","zhTitle":"热驱动的随机磁态选择与相互竞争的斯格明子湮灭路径","zhAbstract":"我们研究了受限Ir/Co/Pt纳米点中由电流驱动的斯格明子成核与湮灭，重点关注热涨落的作用。虽然最小能量方法预测出明确的转变机制，但我们表明，有限温度动力学可在相同标称条件下导致不同的磁构型。包含自旋转移矩、奥斯特场和热噪声的微磁模拟揭示了电流驱动磁响应中的随机变异性，同时在独立热噪声实现中保持了可重现的电流依赖磁区域。与测地线微扰弹性带（GNEB）计算的比较识别出两种相互竞争的斯格明子湮灭机制，即内部坍缩和边界介导的湮灭，二者具有显著不同的激活势垒。在T = 300 K时，相应的最大势垒分别约为44.7 k B T和21.2 k B T，表明在热激活下边界介导的湮灭在动力学上强烈占优。这些结果凸显了能量景观拓扑与随机动力学之间的相互作用，为受限几何结构中电流驱动的斯格明子转变提供了新见解。"},{"title":"Emergence of multiple metastable Skyrmion states induced by strong grain-boundary pinning","url":"https://doi.org/10.1016/j.jmmm.2026.174629","doi":"10.1016/j.jmmm.2026.174629","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Terumitsu Tanaka","Budi Purnama"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":24,"enAbstract":"The stability of magnetic skyrmions in polycrystalline magnetic thin films with reduced intergrain exchange coupling was investigated using micromagnetic simulations combined with the nudged elastic band method. Polycrystalline films were modeled using Voronoi tessellations, and the exchange coupling across grain boundaries was systematically reduced in order to examine the influence of strong grain-boundary pinning on skyrmion stability. The skyrmion diameter increased significantly with decreasing intergrain exchange coupling owing to the suppression of skyrmion shrinkage by grain-boundary pinning. Correspondingly, the energy barrier against skyrmion collapse increased primarily because of a reduction in the skyrmion-state energy, while the saddle-point energy exhibited only a weak dependence on intergrain exchange coupling. A nearly linear relationship between skyrmion diameter and skyrmion-state energy was observed when magnetic continuity across grain boundaries was relatively well preserved. However, systematic deviations from this diameter-energy relation emerged as the intergrain exchange coupling was further reduced. An analysis of the energy difference between the skyrmion and ferromagnetic states normalized by the skyrmion perimeter revealed that the deviation cannot be explained solely by variations in the energy difference per unit perimeter. Instead, the results suggest that strong grain-boundary pinning suppresses further skyrmion shrinkage during relaxation. Additional simulations employing different initial reversed-domain sizes demonstrated that the relaxed skyrmion diameter depends on the size of the initially introduced reversed domain under strong exchange discontinuity. The results suggest the emergence of multiple metastable skyrmion states with different diameters associated with different pinned domain-wall configurations. Despite a substantial increase in skyrmion diameter, the magnitude of the topological charge decreased only slightly, indicating that the enlarged skyrmions retain the essential topological characteristics of skyrmions. These findings demonstrate that strong grain-boundary pinning introduces additional effects beyond the conventional diameter-energy relation and provide new insight into skyrmion stability in structurally disordered magnetic films.","zhTitle":"强晶界钉扎诱导的多个亚稳态斯格明子态的出现","zhAbstract":"通过微磁学模拟结合微动弹性带方法，研究了在降低晶间交换耦合的多晶磁性薄膜中磁斯格明子的稳定性。多晶薄膜采用Voronoi镶嵌建模，并系统性地降低跨晶界的交换耦合，以考察强晶界钉扎对斯格明子稳定性的影响。由于晶界钉扎抑制了斯格明子的收缩，斯格明子直径随晶间交换耦合的减小而显著增大。相应地，由于斯格明子态能量的降低，斯格明子坍缩的能垒主要随之增大，而鞍点能量对晶间交换耦合仅表现出较弱的依赖性。当跨晶界的磁性连续性保持相对较好时，观察到斯格明子直径与斯格明子态能量之间呈近乎线性的关系。然而，随着晶间交换耦合进一步减小，出现了对该直径-能量关系的系统性偏离。对斯格明子态与铁磁态之间能量差按斯格明子周长归一化后的分析表明，该偏离不能仅由单位周长能量差的变化来解释。相反，结果表明强晶界钉扎抑制了弛豫过程中斯格明子的进一步收缩。采用不同初始反磁畴尺寸的补充模拟表明，在强交换不连续性下，弛豫后的斯格明子直径取决于初始引入的反磁畴尺寸。\n结果表明，出现了与不同钉扎畴壁构型相关的、具有不同直径的多种亚稳态斯格明子态。尽管斯格明子直径大幅增加，拓扑电荷的大小仅略有下降，这表明 enlarged skyrmions 保留了斯格明子的基本拓扑特征。这些发现表明，强晶界钉扎引入了超出传统直径-能量关系的额外效应，并为结构无序磁性薄膜中斯格明子的稳定性提供了新的见解。"},{"title":"Designer quantum states in magnetic topological insulator multilayers","url":"https://doi.org/10.1016/j.jmmm.2026.174589","doi":"10.1016/j.jmmm.2026.174589","journal":"Journal of Magnetism and Magnetic Materials","jabbr":"Journal of Magnetism and Magnetic Materials","pubdate":"2026-11-01（在线预发表）","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"magnetic topological insulator","matchWhere":"标题：magnetic topological insulator","score":9,"authors":["Deyi Zhuo","Han Tay","Cui-Zu Chang"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":25,"zhTitle":"磁性拓扑绝缘体多层结构中的设计量子态"},{"title":"Skyrmion Bubbles by Design in a Centrosymmetric Kagome Magnet","url":"https://doi.org/10.1002/advs.78269","doi":"10.1002/advs.78269","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"标题：skyrmion","score":9,"authors":["Mohamed El Gazzah","Fehmi Sami Yasin","Sk Jamaluddin","Hari Bhandari","Resham Babu Regmi","Xiuzhen Yu"],"authorMore":true,"abstract":"ABSTRACT Topologically protected nanoscale spin textures, such as magnetic skyrmions, have attracted significant interest for spintronics applications. While skyrmions in noncentrosymmetric materials are known to be stabilized by the Dzyaloshinskii‐Moriya interaction (DMI), their deliberate design in centrosymmetric materials remains a challenge. This difficulty largely stems from the complexity of controlling magnetocrystalline anisotropy–a critical factor in the absence of DMI. Here, we demonstrate the chemical tuning of magnetocrystalline anisotropy in the centrosymmetric Kagome magnet. The resulting compound exhibits a spin reorientation transition accompanied by an emergent skyrmion bubble lattice, confirmed by cryogenic Lorentz transmission electron microscopy and cryogenic Lorentz differential phase contrast scanning transmission electron microscopy. Our findings overcome a key materials design challenge and open possibilities for deliberate design of skyrmionic textures in centrosymmetric systems.","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":26,"enAbstract":"ABSTRACT Topologically protected nanoscale spin textures, such as magnetic skyrmions, have attracted significant interest for spintronics applications. While skyrmions in noncentrosymmetric materials are known to be stabilized by the Dzyaloshinskii‐Moriya interaction (DMI), their deliberate design in centrosymmetric materials remains a challenge. This difficulty largely stems from the complexity of controlling magnetocrystalline anisotropy–a critical factor in the absence of DMI. Here, we demonstrate the chemical tuning of magnetocrystalline anisotropy in the centrosymmetric Kagome magnet . The resulting compound exhibits a spin reorientation transition accompanied by an emergent skyrmion bubble lattice, confirmed by cryogenic Lorentz transmission electron microscopy and cryogenic Lorentz differential phase contrast scanning transmission electron microscopy. Our findings overcome a key materials design challenge and open possibilities for deliberate design of skyrmionic textures in centrosymmetric systems.","zhTitle":"中心对称Kagome磁体中的设计性斯格明子气泡","zhAbstract":"摘要 拓扑保护的纳米尺度自旋结构，例如磁性斯格明子，已在自旋电子学应用中引起了显著兴趣。虽然已知非中心对称材料中的斯格明子由Dzyaloshinskii-Moriya相互作用（DMI）稳定，但在中心对称材料中有意设计它们仍然是一项挑战。这一困难很大程度上源于控制磁晶各向异性的复杂性——在缺乏DMI时的一个关键因素。在此，我们展示了中心对称Kagome磁体中磁晶各向异性的化学调控。所得化合物表现出自旋重取向转变，并伴随出现斯格明子气泡晶格，这通过低温洛伦兹透射电子显微镜和低温洛伦兹微分相位衬度扫描透射电子显微镜得到确认。我们的发现克服了一个关键的材料设计挑战，并为在中心对称体系中有意设计斯格明子织构开辟了可能性。"},{"title":"Supercurrent-controlled magnon transport via suppression of the superconducting gap","url":"https://doi.org/10.1103/jlhg-yy14","doi":"10.1103/jlhg-yy14","journal":"Physical Review Applied","jabbr":"Physical Review Applied","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Tetsuma Mandokoro","Yoichi Shiota","Hisakazu Matsuki","Ryusuke Hisatomi","Shutaro Karube","Akito Daido"],"authorMore":true,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":27,"zhTitle":"超电流控制的磁振子输运通过抑制超导能隙"},{"title":"Traveling-wave-mediated remote magnon-magnon coupling","url":"https://doi.org/10.1103/yyd4-l1vx","doi":"10.1103/yyd4-l1vx","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Lihua Zhong","Chenyang Lu","Jiguang Yao","Bimu Yao","Wei Lu","Can-Ming Hu"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":28,"zhTitle":"行波介导的远程磁振子-磁振子耦合"},{"title":"Pseudogauge field-driven magnon thermal Hall effect in two-dimensional compensated ferrimagnets","url":"https://doi.org/10.1103/8m9g-7frl","doi":"10.1103/8m9g-7frl","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"标题：magnon","score":9,"authors":["Mohd Faizee","Abir De Sarkar"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":29,"zhTitle":"赝规范场驱动的二维补偿亚铁磁体中的磁振子热霍尔效应"},{"title":"Comparative analysis of unconventional spin-orbit torques and magnetization switching efficiencies in Fe 3 GeTe 2 /WTe 2","url":"https://doi.org/10.1103/n4mx-v1fx","doi":"10.1103/n4mx-v1fx","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetization switching","matchWhere":"标题：magnetization switching","score":9,"authors":["Niklas Kercher","Paul Noël","Emir Karadža","Pietro Gambardella"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":30},{"title":"Spin filtering by electron reflection from surfaces of collinear compensated magnets","url":"https://doi.org/10.1103/7mm4-xymn","doi":"10.1103/7mm4-xymn","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"磁隧道结与磁电阻","topics":["磁隧道结与磁电阻"],"matchTerm":"spin filtering","matchWhere":"标题：spin filtering","score":9,"authors":["Eugene E. Krasovskii","A. N. Yaresko"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":31,"zhTitle":"共线补偿磁体表面的电子反射自旋过滤"},{"title":"Parity-driven RKKY decoupling and anomalous 1 / R Dzyaloshinskii-Moriya interaction in odd-parity magnets","url":"https://doi.org/10.1103/9w3c-7kcr","doi":"10.1103/9w3c-7kcr","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"Dzyaloshinskii-Moriya interaction","matchWhere":"标题：Dzyaloshinskii-Moriya interaction","score":9,"authors":["Morteza Salehi","T. Farajollahpour"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":32,"zhTitle":"奇宇称磁体中的宇称驱动RKKY退耦与反常1/R Dzyaloshinskii-Moriya相互作用"},{"title":"Space group symmetry of chiral Fe-deficient van der Waals magnet Fe 3 − x GeTe 2 probed by convergent beam electron diffraction","url":"https://doi.org/10.1103/3hjn-dx1x","doi":"10.1103/3hjn-dx1x","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"van der Waals magnet","matchWhere":"标题：van der Waals magnet","score":9,"authors":["O. Zaiets","S. Subakti","D. Wolf","J. Steinweh","S. Parkin","A. Lubk"],"authorMore":false,"abstract":"✅ 数据源：52 本刊、104 条通道全部正常。","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-21","tkey":"other","id":33},{"title":"Spin-dependent electron transfer through a ring-wire coupled junction: role of in-plane electric field","url":"https://doi.org/10.1088/1361-648x/aeb0fa","doi":"10.1088/1361-648x/aeb0fa","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体","自旋逻辑与神经形态器件"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic、摘要：spintronic device","score":7,"authors":["Prabhab Patra","Santanu K Maiti"],"authorMore":false,"abstract":"Abstract We study spin-dependent transport in a hybrid magnetic system, where a non-magnetic (NM) wire is coupled to a side-attached antiferromagnetic mesoscopic ring, placed between two non-magnetic electrodes subject to an in-plane electric field oriented perpendicular to the NM wire. The system is described within a tight-binding framework, and transport properties are computed using the non-equilibrium Green’s function formalism. We consider two junction configurations distinguished by the ring-wire coupling: a single-coupled junction and a double-coupled junction. In the single-coupled configuration, the coupling geometry alone breaks the spin symmetry, yielding a finite spin polarization (SP) even without any external field. The in-plane electric field further enhances the symmetry breaking in both configurations, serving as an efficient tuning parameter that drives the SP nearly 100 % in the low-bias region. In the double-coupled configuration, spin symmetry is preserved in the absence of the external field, and the electric field acts as a sole source of symmetry breaking, producing a large SP. Finite temperature effects and different system sizes are examined, confirming the robustness of the observed features. To validate the findings over a wide parameter space, we considered different sets of parameters and found that the key signatures remain unchanged. Our results demonstrate that such hybrid structures are promising candidates for realizing an externally controllable spintronic device in low-dimensional systems.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":34,"enAbstract":"We study spin-dependent transport in a hybrid magnetic system, where a non-magnetic (NM) wire is coupled to a side-attached antiferromagnetic mesoscopic ring, placed between two non-magnetic electrodes subject to an in-plane electric field oriented perpendicular to the NM wire. The system is described within a tight-binding framework, and transport properties are computed using the non-equilibrium Green's function formalism. We consider two junction configurations distinguished by the ring-wire coupling: a single-coupled junction and a double-coupled junction. In the single-coupled configuration, the coupling geometry alone breaks the spin symmetry, yielding a finite spin polarization (SP) even without any external field. The in-plane electric field further enhances the symmetry breaking in both configurations, serving as an efficient tuning parameter that drives the SP nearlyin the low-bias region. In the double-coupled configuration, spin symmetry is preserved in the absence of the external field, and the electric field acts as a sole source of symmetry breaking, producing a large SP. Finite temperature effects and different system sizes are examined, confirming the robustness of the observed features. To validate the findings over a wide parameter space, we considered different sets of parameters and found that the key signatures remain unchanged. Our results demonstrate that such hybrid structures are promising candidates for realizing an externally controllable spintronic device in low-dimensional systems.","zhTitle":"通过环-线耦合结的自旋相关电子转移：面内电场的作用","zhAbstract":"我们研究了一种混合磁性系统中的自旋相关输运，其中一根非磁性（NM）导线与一个侧向连接的反铁磁介观环耦合，该体系置于两个非磁性电极之间，并受到垂直于NM导线的面内电场作用。该系统在紧束缚框架下描述，输运性质采用非平衡格林函数形式计算。我们考虑由环-导线耦合区分的两种结构型：单耦合结和双耦合结。在单耦合构型中，仅耦合几何结构本身就打破了自旋对称性，即使没有任何外场也产生有限的自旋极化（SP）。面内电场进一步增强两种构型中的对称性破缺，作为一个有效的调控参数，在低偏压区域驱动SP近乎。在双耦合构型中，无外场时自旋对称性得以保持，电场作为对称性破缺的唯一来源，产生大的SP。我们考察了有限温度效应和不同系统尺寸，证实了所观察特征的鲁棒性。为在广泛参数空间中验证这些发现，我们考虑了不同的参数集，发现关键特征保持不变。我们的结果表明，此类混合结构是在低维系统中实现外部可控自旋电子器件的有前景的候选者。"},{"title":"Boosting Microwave Absorption via Hollow CoFe/CoFe2O4 Nanoparticles Anchored on Lotus-Leaf-Derived Biochar","url":"https://doi.org/10.3390/nano16201323","doi":"10.3390/nano16201323","journal":"Nanomaterials","jabbr":"Nanomaterials","pubdate":"2026-10-20","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange coupling","matchWhere":"摘要：exchange coupling","score":4,"authors":["Feng Han","Maomao He","Hongchun Yu","Luran Zhang"],"authorMore":false,"abstract":"Biochar composites are promising for electromagnetic wave absorption due to their renewability and low cost, but performance optimization remains a challenge. Here, hollow CoFe/CoFe2O4 composite nanoparticles, in which the CoFe and CoFe2O4 phases coexist, are grown in situ on lotus-leaf-derived porous carbon via a Kirkendall-type process during heat treatment. The optimized composite (pyrolyzed at 800 °C) exhibits a saturation magnetization of 69.20 emu/g and a coercivity of 482 Oe; a calculated minimum reflection loss (RLmin) of −71.4 dB is obtained at a matching thickness of 2.70 mm, with an effective absorption bandwidth (EAB) of 5.68 GHz at 1.70 mm, covering most of the Ku band. The enhanced microwave absorption performance is attributed to the synergy of dielectric and magnetic losses, polarization relaxations, and improved impedance matching, together with multiple scattering within the hollow structure. In addition, the exchange coupling between the FeCo and CoFe2O4 may contribute to magnetic dissipation, while hollow cavities may promote internal reflections for further energy attenuation. This work provides a biomass-derived route to high-performance biochar-based absorbers competitive with synthetic counterparts.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":35,"enAbstract":"Biochar composites are promising for electromagnetic wave absorption due to their renewability and low cost, but performance optimization remains a challenge. Here, hollow CoFe/CoFe2O4 composite nanoparticles, in which the CoFe and CoFe2O4 phases coexist, are grown in situ on lotus-leaf-derived porous carbon via a Kirkendall-type process during heat treatment. The optimized composite (pyrolyzed at 800 °C) exhibits a saturation magnetization of 69.20 emu/g and a coercivity of 482 Oe; a calculated minimum reflection loss (RLmin) of −71.4 dB is obtained at a matching thickness of 2.70 mm, with an effective absorption bandwidth (EAB) of 5.68 GHz at 1.70 mm, covering most of the Ku band. The enhanced microwave absorption performance is attributed to the synergy of dielectric and magnetic losses, polarization relaxations, and improved impedance matching, together with multiple scattering within the hollow structure. In addition, the exchange coupling between the FeCo and CoFe2O4 may contribute to magnetic dissipation, while hollow cavities may promote internal reflections for further energy attenuation. This work provides a biomass-derived route to high-performance biochar-based absorbers competitive with synthetic counterparts.","zhTitle":"通过锚定在荷叶衍生生物炭上的空心CoFe/CoFe2O4纳米颗粒增强微波吸收","zhAbstract":"生物炭复合材料因其可再生性和低成本而在电磁波吸收方面具有前景，但性能优化仍是一项挑战。在此，空心CoFe/CoFe2O4复合纳米颗粒（其中CoFe相与CoFe2O4相共存）通过热处理过程中的Kirkendall型过程在荷叶衍生的多孔碳上原位生长。优化后的复合材料（在800 °C下热解）表现出69.20 emu/g的饱和磁化强度和482 Oe的矫顽力；在2.70 mm的匹配厚度下计算得到的最小反射损耗（RLmin）为−71.4 dB，在1.70 mm处有效吸收带宽（EAB）为5.68 GHz，覆盖了Ku波段的大部分。增强的微波吸收性能归因于介电损耗与磁损耗的协同作用、极化弛豫以及改善的阻抗匹配，连同空心结构内的多次散射。此外，FeCo与CoFe2O4之间的交换耦合可能有助于磁耗散，而空腔可能促进内部反射以进一步衰减能量。这项工作为高性能生物炭基吸收剂提供了一条生物质衍生路线，使其可与合成同类材料相竞争。"},{"title":"Ligand-mediated origin of altermagnetic spin splitting","url":"https://doi.org/10.1103/s83n-w474","doi":"10.1103/s83n-w474","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"摘要：altermagnet","score":4,"authors":["Luigi Camerano","F. Bisti","Gianni Profeta"],"authorMore":false,"abstract":"Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":36,"enAbstract":"Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.","zhTitle":"配体介导的交变磁自旋分裂起源","zhAbstract":"交错磁体尽管净磁化强度为零，却具有自旋劈裂的电子能带，这为超越传统铁磁体的自旋电子学开辟了新途径。超越基于对称性的分类——此类分类仅指定允许的项而不给出其层级关系——本文利用第一性原理计算和Wannier哈密顿量工程，揭示了$g$波交错磁体Co$_{1/4}$NbSe$_2$中交错磁自旋劈裂的微观成键贡献。我们表明，该劈裂可由短程紧束缚模型描述，从而确立其局域起源。通过选择性地控制跃迁通道，我们证明主要贡献并非来自磁性离子之间的直接跃迁，而是来自配体介导的杂化，后者将各向异性传递至巡游态。这确定配体辅助耦合为交错磁自旋劈裂的关键机制，并在最小模型与对称性引导的第一性原理材料搜索之间提供了微观桥梁，从而实现了交错磁功能性的实空间设计。"},{"title":"Deconfined quantum critical point in a dissipative spin-1/2 chain","url":"https://doi.org/10.1103/lmlm-2mxw","doi":"10.1103/lmlm-2mxw","journal":"Physical Review Letters","jabbr":"Physical Review Letters","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["Longye Lu","Shifeng Cui","Wenan Guo"],"authorMore":false,"abstract":"Open quantum spin systems offer a previously unexplored route to realizing deconfined quantum criticality. We consider a spin-1/2 $J$-$Q_3$ chain, consisting of an antiferromagnetic (AFM) Heisenberg exchange and a competing multi-spin interaction favoring a valence-bond solid (VBS) state, with each spin component coupled to a bosonic bath. Using non-Abelian bosonization and renormalization-group (RG) analysis, combined with large-scale quantum Monte Carlo (QMC) simulations, we determine the phase diagram and the associated phase transitions of the model. We show that strong dissipation stabilizes an AFM phase for sub-Ohmic, Ohmic, and super-Ohmic baths. Continuous AFM-VBS transitions at finite dissipation are found upon increasing the multi-spin interaction in both the sub-Ohmic and Ohmic regimes. Critical properties are obtained through perturbative RG analysis and QMC simulations. In the Ohmic case, the critical point features spinon deconfinement and emergent O(4) symmetry. In the sub-Ohmic regime, the transition may also involve spinon deconfinement, provided that spinons remain deconfined in the dissipative VBS phase. In addition, in the super-Ohmic regime, we propose a transition from AFM phase to a quasi-long-range ordered phase.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":37,"enAbstract":"Open quantum spin systems offer a previously unexplored route to realizing deconfined quantum criticality. We consider a spin-1/2 $J$-$Q_3$ chain, consisting of an antiferromagnetic (AFM) Heisenberg exchange and a competing multi-spin interaction favoring a valence-bond solid (VBS) state, with each spin component coupled to a bosonic bath. Using non-Abelian bosonization and renormalization-group (RG) analysis, combined with large-scale quantum Monte Carlo (QMC) simulations, we determine the phase diagram and the associated phase transitions of the model. We show that strong dissipation stabilizes an AFM phase for sub-Ohmic, Ohmic, and super-Ohmic baths. Continuous AFM-VBS transitions at finite dissipation are found upon increasing the multi-spin interaction in both the sub-Ohmic and Ohmic regimes. Critical properties are obtained through perturbative RG analysis and QMC simulations. In the Ohmic case, the critical point features spinon deconfinement and emergent O(4) symmetry. In the sub-Ohmic regime, the transition may also involve spinon deconfinement, provided that spinons remain deconfined in the dissipative VBS phase. In addition, in the super-Ohmic regime, we propose a transition from AFM phase to a quasi-long-range ordered phase.","zhTitle":"耗散性自旋-1/2链中的解禁量子临界点","zhAbstract":"开放量子自旋系统为 realization 去禁闭量子临界性提供了一条此前未被探索的途径。我们考虑一个自旋-1/2的$J$-$Q_3$链，它由反铁磁（AFM）海森堡交换和一种倾向于价键固体（VBS）态的竞争性多自旋相互作用组成，且每个自旋分量都与一个玻色子浴耦合。利用非阿贝尔玻色化和重整化群（RG）分析，结合大规模量子蒙特卡洛（QMC）模拟，我们确定了该模型的相图及相关的相变。我们表明，对于亚欧姆、欧姆和超欧姆浴，强耗散稳定了AFM相。在亚欧姆和欧姆区域中，通过增加多自旋相互作用，发现了有限耗散下的连续AFM-VBS转变。临界性质通过微扰RG分析和QMC模拟获得。在欧姆情形下，临界点具有自旋子去禁闭和涌现的O(4)对称性。在亚欧姆区域，只要自旋子在耗散VBS相中保持去禁闭，该转变也可能涉及自旋子去禁闭。此外，在超欧姆区域，我们提出了一种从AFM相到准长程有序相的转变。"},{"title":"Robust Anomalous Hall Effect in Epitaxial Cubic D03-Fe3Ge Nanoplates Grown via Chemical Vapor Deposition","url":"https://doi.org/10.1021/acsami.6c14914","doi":"10.1021/acsami.6c14914","journal":"ACS Applied Materials \u0026 Interfaces","jabbr":"ACS Applied Materials \u0026 Interfaces","pubdate":"2026-10-21","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Mingxuan Chen","Chao Chen","Siqi Jiang","Shuxiang Qiao","Hongyan Lu","Di Zhang"],"authorMore":true,"abstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":38,"enAbstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","zhTitle":"通过化学气相沉积生长的外延立方D03-Fe3Ge纳米片中的稳健反常霍尔效应","zhAbstract":"摘要 铁基铁磁材料因其高居里温度以及由贝里曲率驱动的显著反常霍尔效应（AHE），已成为自旋电子学中一个有前景的材料体系。尽管已有对非层状铁基铁磁材料外延生长的研究，但高质量单晶薄膜的实现仍然是一个艰巨的障碍。同时，晶界散射等问题进一步阻碍了它们的表征与应用。在此，我们报道了首次通过化学气相沉积合成单晶立方D03-Fe3Ge纳米片。该化合物与Fe–Ge体系中通常观察到的传统六方相有显著不同。结构表征证实了晶体的立方晶格和化学计量纯度。结构分析确认了强外延效应，导致界面处约4.16%的巨大压应变，并逐渐向表面弛豫。二次谐波产生信号可能进一步揭示，这种界面应变破坏了立方相固有的中心对称性。超导量子干涉器件磁强计测量显示出稳健的室温铁磁性和明显的磁各向异性。磁输运测量揭示出稳健的AHE，该效应在远高于室温的温度下仍保持稳定。在反常霍尔电阻与纵向电阻之间观察到的标度关系强烈表明，该效应由本征贝里曲率机制主导。\n此外，密度泛函理论计算表明，巨大的外延应变诱导能带重构，并在费米能级附近产生密集的自旋-轨道耦合带隙，从而有效地将反常霍尔电导率提高一倍，与我们的实验观测结果相符。"},{"title":"Enhanced Magneto-Optical Kerr Effect in Nano-Magnetic Metamaterials with Near-Perfect Coherent Absorption","url":"https://doi.org/10.1021/acsnano.6c15462","doi":"10.1021/acsnano.6c15462","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-21","topic":"自旋逻辑与神经形态器件","topics":["自旋逻辑与神经形态器件"],"matchTerm":"magnetic sensing","matchWhere":"摘要：magnetic sensing","score":3,"authors":["Xiaofei Xiao","Tingjun Zheng","Alex Vanstone","Daniel S. Bromley","Holly Holder","Kilian D. Stenning"],"authorMore":true,"abstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":39,"enAbstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong
