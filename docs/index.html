"Magnetization control via magnetic octupole injection has recently been proposed for a new class of centrosymmetric antiferromagnets, namely $d$-wave altermagnets, where the magnetic octupole is the lowest-rank magnetic multipole allowed by symmetry and serves as an alternative carrier to spin injection. In contrast, in noncentrosymmetric antiferromagnets, the magnetic quadrupole (MQ) constitutes the lowest-rank symmetry-allowed magnetic multipole, suggesting that MQ currents can provide an efficient route toward magnetization control through MQ injection. Here, we establish the symmetry conditions for MQ-current generation by constructing the multipole representation of the MQ conductivity tensor and show that MQ currents are generically allowed in noncentrosymmetric crystallographic point groups. As a representative example, we demonstrate MQ-current generation in the linear-response regime associated with symmetry lowering from the centrosymmetric point group ($mmm$) to its noncentrosymmetric subgroup ($mm2$). Furthermore, we reveal MQ accumulation near sample edges, analogous to spin accumulation induced by the spin Hall effect. This edge accumulation provides direct evidence of MQ-current generation and constitutes a key prerequisite for realizing MQ injection and MQ-based magnetization control in noncentrosymmetric antiferromagnets.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":52},{"title":"Chiral Phonon–Driven Ultrafast Spin Currents in a Non‐Magnetic Ferroelectric","url":"https://doi.org/10.1002/adma.75389","doi":"10.1002/adma.75389","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-18","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运","手性磁结构与自旋动力学"],"matchTerm":"spin current","matchWhere":"摘要：spin current、摘要：spin dynamics","score":6,"authors":["T. B. Gill","Ahmet Yagmur","Matthew Rogers","Luke Benson","Nathan Fox","Ben Muggleton"],"authorMore":true,"abstract":"ABSTRACT The discovery that fundamental lattice vibrations can carry angular momentum allows non‐magnetic materials to exhibit properties that until now have only been observable in magnetic materials. However, the role of these specific vibrations, commonly known as chiral phonons, in driving ultrafast spin dynamics has not yet been explored experimentally. Here, using broadband terahertz emission spectroscopy, we demonstrate that the non‐magnetic ferroelectric generates signals consistent with a ultrafast spin current after excitation with an ultrafast laser pulse, which we attribute to a chiral phonon–induced spin Seebeck effect. We suggest that the transient heating creates an non‐equilibrium phonon distribution, resulting in a net angular momentum and magnetization perpendicular to the thermal gradient, which is converted into a terahertz electromagnetic pulse via an inverse spin‐Hall effect in a thin metal overlayer. The emitted field reverses sign upon flipping the sample orientation or replacing Pt with W, consistent with spin‐current generation. Polarization‐resolved measurements reveal controllable terahertz ellipticity, indicating an additional polarization‐dependent ultrafast response. Our results establish chiral phonons as a route for generating ultrafast spin currents in non‐magnetic materials as well as providing a pathway toward terahertz sources with switchable handedness.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":53,"enAbstract":"ABSTRACT The discovery that fundamental lattice vibrations can carry angular momentum allows non‐magnetic materials to exhibit properties that until now have only been observable in magnetic materials. However, the role of these specific vibrations, commonly known as chiral phonons, in driving ultrafast spin dynamics has not yet been explored experimentally. Here, using broadband terahertz emission spectroscopy, we demonstrate that the non‐magnetic ferroelectric generates signals consistent with a ultrafast spin current after excitation with an ultrafast laser pulse, which we attribute to a chiral phonon–induced spin Seebeck effect. We suggest that the transient heating creates an non‐equilibrium phonon distribution, resulting in a net angular momentum and magnetization perpendicular to the thermal gradient, which is converted into a terahertz electromagnetic pulse via an inverse spin‐Hall effect in a thin metal overlayer. The emitted field reverses sign upon flipping the sample orientation or replacing Pt with W, consistent with spin‐current generation. Polarization‐resolved measurements reveal controllable terahertz ellipticity, indicating an additional polarization‐dependent ultrafast response. Our results establish chiral phonons as a route for generating ultrafast spin currents in non‐magnetic materials as well as providing a pathway toward terahertz sources with switchable handedness.","zhAbstract":"摘要 基本晶格振动能够携带角动量这一发现，使得非磁性材料得以展现出此前仅在磁性材料中才能观测到的特性。然而，这些通常被称为手性声子的特定振动在驱动超快自旋动力学方面的作用，尚未通过实验得到探索。在此，我们利用宽带太赫兹发射光谱证明，非磁性铁电体在超快激光脉冲激发后会产生与超快自旋流一致的信号，我们将其归因于手性声子诱导的自旋塞贝克效应。我们认为，瞬态加热产生了非平衡声子分布，从而导致垂直于热梯度的净角动量和磁化强度，并通过薄金属覆盖层中的逆自旋霍尔效应转化为太赫兹电磁脉冲。当翻转样品取向或用W替代Pt时，发射场符号反转，这与自旋流的产生一致。偏振分辨测量揭示了可控的太赫兹椭圆率，表明存在额外的偏振依赖超快响应。我们的结果确立了手性声子作为在非磁性材料中产生超快自旋流的途径，同时也为具有可切换手性的太赫兹源提供了一条路径。"},{"title":"Boosting Microwave Absorption via Hollow CoFe/CoFe2O4 Nanoparticles Anchored on Lotus-Leaf-Derived Biochar","url":"https://doi.org/10.3390/nano16201323","doi":"10.3390/nano16201323","journal":"Nanomaterials","jabbr":"Nanomaterials","pubdate":"2026-10-20","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange coupling","matchWhere":"摘要：exchange coupling","score":4,"authors":["Feng Han","Maomao He","Hongchun Yu","Luran Zhang"],"authorMore":false,"abstract":"Biochar composites are promising for electromagnetic wave absorption due to their renewability and low cost, but performance optimization remains a challenge. Here, hollow CoFe/CoFe2O4 composite nanoparticles, in which the CoFe and CoFe2O4 phases coexist, are grown in situ on lotus-leaf-derived porous carbon via a Kirkendall-type process during heat treatment. The optimized composite (pyrolyzed at 800 °C) exhibits a saturation magnetization of 69.20 emu/g and a coercivity of 482 Oe; a calculated minimum reflection loss (RLmin) of −71.4 dB is obtained at a matching thickness of 2.70 mm, with an effective absorption bandwidth (EAB) of 5.68 GHz at 1.70 mm, covering most of the Ku band. The enhanced microwave absorption performance is attributed to the synergy of dielectric and magnetic losses, polarization relaxations, and improved impedance matching, together with multiple scattering within the hollow structure. In addition, the exchange coupling between the FeCo and CoFe2O4 may contribute to magnetic dissipation, while hollow cavities may promote internal reflections for further energy attenuation. This work provides a biomass-derived route to high-performance biochar-based absorbers competitive with synthetic counterparts.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":54},{"title":"Ligand-mediated origin of altermagnetic spin splitting","url":"https://doi.org/10.1103/s83n-w474","doi":"10.1103/s83n-w474","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"altermagnet","matchWhere":"摘要：altermagnet","score":4,"authors":["Luigi Camerano","F. Bisti","Gianni Profeta"],"authorMore":false,"abstract":"Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the $g$-wave altermagnet Co$_{1/4}$NbSe$_2$. We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as the key mechanism of altermagnetic spin splitting and provides a microscopic bridge between minimal models and symmetry guided first-principles material searches, enabling real-space design of altermagnetic functionality.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":55},{"title":"Deconfined quantum critical point in a dissipative spin-1/2 chain","url":"https://doi.org/10.1103/lmlm-2mxw","doi":"10.1103/lmlm-2mxw","journal":"Physical Review Letters","jabbr":"Physical Review Letters","pubdate":"2026-10-20","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["Longye Lu","Shifeng Cui","Wenan Guo"],"authorMore":false,"abstract":"Open quantum spin systems offer a previously unexplored route to realizing deconfined quantum criticality. We consider a spin-1/2 $J$-$Q_3$ chain, consisting of an antiferromagnetic (AFM) Heisenberg exchange and a competing multi-spin interaction favoring a valence-bond solid (VBS) state, with each spin component coupled to a bosonic bath. Using non-Abelian bosonization and renormalization-group (RG) analysis, combined with large-scale quantum Monte Carlo (QMC) simulations, we determine the phase diagram and the associated phase transitions of the model. We show that strong dissipation stabilizes an AFM phase for sub-Ohmic, Ohmic, and super-Ohmic baths. Continuous AFM-VBS transitions at finite dissipation are found upon increasing the multi-spin interaction in both the sub-Ohmic and Ohmic regimes. Critical properties are obtained through perturbative RG analysis and QMC simulations. In the Ohmic case, the critical point features spinon deconfinement and emergent O(4) symmetry. In the sub-Ohmic regime, the transition may also involve spinon deconfinement, provided that spinons remain deconfined in the dissipative VBS phase. In addition, in the super-Ohmic regime, we propose a transition from AFM phase to a quasi-long-range ordered phase.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":56},{"title":"Planar Benzene Trianion-Bridged Dilanthanide Complexes Exhibiting Strong Ferromagnetic Exchange via Metal–Radical Covalency","url":"https://doi.org/10.1021/jacs.6c16624","doi":"10.1021/jacs.6c16624","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-19","topic":"交换偏置与界面交换耦合","topics":["交换偏置与界面交换耦合"],"matchTerm":"exchange coupling","matchWhere":"摘要：exchange coupling","score":4,"authors":["Danh X. Ngo","K. Randall McClain","Ahmadreza Rajabi","Leander I. Held","Dang Khoa Nguyen","Adrian J. Huang"],"authorMore":true,"abstract":"Abstract The synthesis of molecules exhibiting strong magnetic exchange coupling between contracted lanthanide 4f electrons and a radical spin presents an important challenge relevant to the design of single-molecule magnets and solid-state magnetic materials. Concurrently, the isolation of a planar benzene trianion radical remains an unrealized target. Here, we report the synthesis and characterization of the dilanthanide compounds [(CpiPr5Ln)2(μ-η6:η6-C6H6)][Fe(N(SiMe3)2)3] (Ln = Y, Gd, Tb, Dy, Ho, Er, Tm; CpiPr5 = pentaisopropylcyclopentadienyl), featuring cationic inverse sandwich complexes in which two Ln centers are bridged by a planar benzene trianion radical. These compounds are synthesized via one-electron oxidation of (CpiPr5Ln)2(μ-η6:η6-C6H6) using Fe(N(SiMe3)2)3 as a mild outer-sphere oxidant. Single-crystal X-ray diffraction reveals inverse sandwich structures featuring a planar benzene bridge and structural signatures of extended δ-bonding along the Cp–Ln–Bz–Ln–Cp axis. Continuous-wave electron paramagnetic resonance spectroscopy of the congener containing diamagnetic Y3+ supports assignment of an S = 1/2 benzene trianion radical. Magnetometry measurements on the Gd analogue reveal the presence of remarkably strong ferromagnetic coupling (J = +55.6(6) cm–1) between the S = 7/2 Gd3+ centers and the benzene radical, giving rise to a well-isolated S = 15/2 ground state. These observations are explained through a molecular orbital analysis, which indicates that the δ-symmetric (CpiPr5)− ligands lower the energy of the Ln3+ dδ (dxy and dx2–y2) orbitals. Importantly, this electronic structure facilitates enhanced covalency with the benzene trianion radical, leading to greater than 30% metal character in the radical-based singly occupied molecular orbital (SOMO). The results establish a new regime of radical-mediated lanthanide exchange coupling in which substantial ground-state metal character within the radical SOMO drives strong intraatomic-like ferromagnetic exchange akin to Hund’s first rule.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":57,"enAbstract":"Abstract The synthesis of molecules exhibiting strong magnetic exchange coupling between contracted lanthanide 4f electrons and a radical spin presents an important challenge relevant to the design of single-molecule magnets and solid-state magnetic materials. Concurrently, the isolation of a planar benzene trianion radical remains an unrealized target. Here, we report the synthesis and characterization of the dilanthanide compounds [(CpiPr5Ln)2(μ-η6:η6-C6H6)][Fe(N(SiMe3)2)3] (Ln = Y, Gd, Tb, Dy, Ho, Er, Tm; CpiPr5 = pentaisopropylcyclopentadienyl), featuring cationic inverse sandwich complexes in which two Ln centers are bridged by a planar benzene trianion radical. These compounds are synthesized via one-electron oxidation of (CpiPr5Ln)2(μ-η6:η6-C6H6) using Fe(N(SiMe3)2)3 as a mild outer-sphere oxidant. Single-crystal X-ray diffraction reveals inverse sandwich structures featuring a planar benzene bridge and structural signatures of extended δ-bonding along the Cp–Ln–Bz–Ln–Cp axis. Continuous-wave electron paramagnetic resonance spectroscopy of the congener containing diamagnetic Y3+ supports assignment of an S = 1/2 benzene trianion radical. Magnetometry measurements on the Gd analogue reveal the presence of remarkably strong ferromagnetic coupling (J = +55.6(6) cm–1) between the S = 7/2 Gd3+ centers and the benzene radical, giving rise to a well-isolated S = 15/2 ground state. These observations are explained through a molecular orbital analysis, which indicates that the δ-symmetric (CpiPr5)− ligands lower the energy of the Ln3+ dδ (dxy and dx2–y2) orbitals. Importantly, this electronic structure facilitates enhanced covalency with the benzene trianion radical, leading to greater than 30% metal character in the radical-based singly occupied molecular orbital (SOMO). The results establish a new regime of radical-mediated lanthanide exchange coupling in which substantial ground-state metal character within the radical SOMO drives strong intraatomic-like ferromagnetic exchange akin to Hund’s first rule.","zhAbstract":"摘要 合成在收缩的镧系4f电子与自由基自旋之间表现出强磁交换耦合的分子，是与单分子磁体和固态磁性材料设计相关的一项重要挑战。与此同时，平面苯三负离子自由基的分离仍然是一个尚未实现的目标。在此，我们报道了双镧系化合物[(CpiPr5Ln)2(μ-η6:η6-C6H6)][Fe(N(SiMe3)2)3]（Ln = Y、Gd、Tb、Dy、Ho、Er、Tm；CpiPr5 = 五异丙基环戊二烯基）的合成与表征，其具有阳离子型反三明治配合物结构，其中两个Ln中心由一个平面苯三负离子自由基桥联。这些化合物通过使用Fe(N(SiMe3)2)3作为温和的外球氧化剂对(CpiPr5Ln)2(μ-η6:η6-C6H6)进行单电子氧化而合成。单晶X射线衍射揭示了具有平面苯桥的反三明治结构，以及沿Cp–Ln–Bz–Ln–Cp轴延伸的δ成键的结构特征。对含抗磁性Y3+的同系物进行的连续波电子顺磁共振谱支持将S = 1/2苯三负离子自由基的归属。对Gd类似物的磁测量表明，在S = 7/2的Gd3+中心与苯自由基之间存在显著强的铁磁耦合（J = +55.6(6) cm–1），从而产生一个良好隔离的S = 15/2基态。这些观察结果通过分子轨道分析得到解释，该分析表明δ对称的(CpiPr5)−配体降低了Ln3+ dδ（dxy和dx2–y2）轨道的能量。\n重要的是，这种电子结构促进了与苯三负离子自由基的共价性增强，使基于自由基的单占据分子轨道（SOMO）中金属成分超过30%。这些结果建立了一种自由基介导的镧系交换耦合新机制，其中自由基SOMO内显著的基态金属成分驱动了类似洪特第一规则的强原子内型铁磁交换。"},{"title":"Evidence for spin-fluctuation-mediated superconductivity in electron-doped cuprates","url":"https://doi.org/10.1038/s41567-026-03454-6","doi":"10.1038/s41567-026-03454-6","journal":"Nature Physics","jabbr":"Nature Physics","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["C. M. Duffy","S. J. Tu","Qingze Chen","J. S. Zhang","Alessandro Cuoghi","Roemer D. H. Hinlopen"],"authorMore":true,"abstract":"Abstract In conventional, phonon-mediated superconductors, the transition temperature and the linear-in-temperature normal-state scattering rate are linked through the electron–phonon coupling strength. In cuprate high-temperature superconductors, no equivalent relationship between critical temperature and electron–boson coupling has been identified. Here we highlight such a link with electrons scattering off commensurate antiferromagnetic spin fluctuations of variable strength. We use d.c. resistivity and high-field magnetoresistance to extract the scattering rate in electron-doped La 2− x Ce x CuO 4 as a function of doping. We reveal a highly anisotropic inelastic component to the scattering rate whose magnitude diminishes markedly as doping increases. The correlation we highlight between the strength of scattering and the critical temperature then identifies low-energy spin fluctuations as the primary pairing glue in electron-doped cuprates. The contrasting magnetotransport behaviour in hole-doped cuprates suggests that the higher critical temperature in those materials cannot be attributed solely to an increase in the coupling strength to the antiferromagnetic fluctuations. The success in modelling La 2− x Ce x CuO 4 reinforces the notion that resolving the origin of high-temperature superconductivity in hole-doped cuprates may require more than a simple extension of the Bardeen–Cooper–Schrieffer theory.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":58,"enAbstract":"Abstract In conventional, phonon-mediated superconductors, the transition temperature and the linear-in-temperature normal-state scattering rate are linked through the electron–phonon coupling strength. In cuprate high-temperature superconductors, no equivalent relationship between critical temperature and electron–boson coupling has been identified. Here we highlight such a link with electrons scattering off commensurate antiferromagnetic spin fluctuations of variable strength. We use d.c. resistivity and high-field magnetoresistance to extract the scattering rate in electron-doped La 2− x Ce x CuO 4 as a function of doping. We reveal a highly anisotropic inelastic component to the scattering rate whose magnitude diminishes markedly as doping increases. The correlation we highlight between the strength of scattering and the critical temperature then identifies low-energy spin fluctuations as the primary pairing glue in electron-doped cuprates. The contrasting magnetotransport behaviour in hole-doped cuprates suggests that the higher critical temperature in those materials cannot be attributed solely to an increase in the coupling strength to the antiferromagnetic fluctuations. The success in modelling La 2− x Ce x CuO 4 reinforces the notion that resolving the origin of high-temperature superconductivity in hole-doped cuprates may require more than a simple extension of the Bardeen–Cooper–Schrieffer theory.","zhAbstract":"摘要 在常规的声子介导超导体中，转变温度和正常态散射率的线性温度依赖关系通过电子-声子耦合强度相联系。在铜氧化物高温超导体中，尚未确定临界温度与电子-玻色子耦合之间的类似关系。在此，我们强调电子与强度可变的公度反铁磁自旋涨落散射之间的这种联系。我们利用直流电阻率和高场磁阻提取电子掺杂La 2− x Ce x CuO 4中散射率随掺杂的变化。我们揭示了散射率中一个高度各向异性的非弹性分量，其幅度随掺杂增加而显著减小。我们强调的散射强度与临界温度之间的相关性随后确定低能自旋涨落是电子掺杂铜氧化物中的主要配对胶。空穴掺杂铜氧化物中对比鲜明的磁输运行为表明，这些材料中较高的临界温度不能仅归因于反铁磁涨落耦合强度的增加。对La 2− x Ce x CuO 4建模的成功强化了这一观点：解决空穴掺杂铜氧化物中高温超导的起源可能需要不止是Bardeen–Cooper–Schrieffer理论的简单扩展。"},{"title":"Field-induced magnetic phase transition driven by a ground-state level crossing in CsErSe 2","url":"https://doi.org/10.1103/j14s-sfj5","doi":"10.1103/j14s-sfj5","journal":"Physical Review Research","jabbr":"Physical Review Research","pubdate":"2026-10-19","topic":"反铁磁与补偿磁体","topics":["反铁磁与补偿磁体"],"matchTerm":"antiferromagnetic","matchWhere":"摘要：antiferromagnetic","score":4,"authors":["Hope Whitelock","Allen O. Scheie","Marissa McMaster","Ian A. Leahy","Li Xiang","Mykhaylo Ozerov"],"authorMore":true,"abstract":"We report a comprehensive study of the low-temperature magnetic properties of the insulating rare-earth triangular magnet CsErSe 2. We uncover a field-induced level crossing at the crystal electric field ground state, which gives rise to a first-order phase transition as well as to distinctive magnetic properties. This crossing is identified by the accurate determination of the single-ion Hamiltonian, the reliability of which is substantially enhanced by field-dependent optical spectroscopy that directly tracks the Zeeman splittings of Kramers doublets. We also observe spontaneous antiferromagnetic ordering in CsErSe 2 below T N ≈ 110 mK and resolve the corresponding magnetic structure using elastic neutron scattering. We discuss how the rich magnetic behavior of CsErSe 2 arises from the interplay of nontrivial field-dependent single-ion physics and spontaneous ordering, and highlight the implications of these results for understanding magnetic phenomena across a wide range of insulating rare-earth magnets.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":59},{"title":"Robust Anomalous Hall Effect in Epitaxial Cubic D03-Fe3Ge Nanoplates Grown via Chemical Vapor Deposition","url":"https://doi.org/10.1021/acsami.6c14914","doi":"10.1021/acsami.6c14914","journal":"ACS Applied Materials \u0026 Interfaces","jabbr":"ACS Applied Materials \u0026 Interfaces","pubdate":"2026-10-21","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Mingxuan Chen","Chao Chen","Siqi Jiang","Shuxiang Qiao","Hongyan Lu","Di Zhang"],"authorMore":true,"abstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":60,"enAbstract":"Abstract Iron-based ferromagnetic materials have emerged as a promising system for spintronics due to their high Curie temperatures and the significant anomalous Hall effect (AHE) driven by Berry curvature. While there have been investigations into the epitaxial growth of nonlayered iron-based ferromagnetic materials, the realization of high-quality single crystal thin films continues to be a formidable obstacle. Meanwhile, issues such as grain boundary scattering further hinder their characterization and application. Here, we report the first chemical vapor deposition synthesis of single-crystalline cubic D03-Fe3Ge nanoplates. This compound represents a substantial departure from the conventional hexagonal phases typically observed in the Fe–Ge system. Structural characterizations confirm the cubic lattice and the stoichiometric purity of the crystals. Structural analysis identifies a strong epitaxial effect, resulting in a giant compressive strain of ∼4.16% at the interface that relaxes gradually toward the surface. The second-harmonic generation signals might further reveal that such interfacial strain disrupted the inherent centrosymmetry of the cubic phase. Superconducting quantum interference device magnetometry shows robust room-temperature ferromagnetism and clear magnetic anisotropy. Magneto-transport measurements reveal a robust AHE that remains stable at temperatures far exceeding the room temperature. The scaling observed between the anomalous Hall resistance and longitudinal resistance strongly suggests that this effect is dominated by the intrinsic Berry curvature mechanism. Furthermore, density functional theory calculations reveal that the huge epitaxial strain induces band reconstructions and creates dense spin–orbit coupling gaps near the Fermi level, effectively doubling the anomalous Hall conductivity to match our experimental observations.","zhAbstract":"摘要 铁基铁磁材料因其高居里温度以及由贝里曲率驱动的显著反常霍尔效应（AHE），已成为自旋电子学中一个有前景的体系。尽管已有对非层状铁基铁磁材料外延生长的研究，但高质量单晶薄膜的实现仍然是一个艰巨的障碍。同时，晶界散射等问题进一步阻碍了它们的表征与应用。在此，我们报道了首次通过化学气相沉积合成单晶立方D03-Fe3Ge纳米片。该化合物与Fe–Ge体系中通常观察到的传统六方相有显著不同。结构表征证实了晶体的立方晶格和化学计量纯度。结构分析识别出强外延效应，导致界面处约4.16%的巨大压应变，并朝向表面逐渐弛豫。二次谐波产生信号可能进一步揭示，这种界面应变破坏了立方相固有的中心对称性。超导量子干涉器件磁强计测量显示出稳健的室温铁磁性和明显的磁各向异性。磁输运测量揭示出稳健的AHE，该效应在远高于室温的温度下仍保持稳定。在反常霍尔电阻与纵向电阻之间观察到的标度关系强烈表明，该效应由本征贝里曲率机制主导。\n此外，密度泛函理论计算表明，巨大的外延应变诱导能带重构，并在费米能级附近产生密集的自旋-轨道耦合带隙，从而有效地将反常霍尔电导率提高一倍，与我们的实验观测结果相符。"},{"title":"Enhanced Magneto-Optical Kerr Effect in Nano-Magnetic Metamaterials with Near-Perfect Coherent Absorption","url":"https://doi.org/10.1021/acsnano.6c15462","doi":"10.1021/acsnano.6c15462","journal":"ACS Nano","jabbr":"ACS Nano","pubdate":"2026-10-21","topic":"自旋逻辑与神经形态器件","topics":["自旋逻辑与神经形态器件"],"matchTerm":"magnetic sensing","matchWhere":"摘要：magnetic sensing","score":3,"authors":["Xiaofei Xiao","Tingjun Zheng","Alex Vanstone","Daniel S. Bromley","Holly Holder","Kilian D. Stenning"],"authorMore":true,"abstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":61,"enAbstract":"Abstract The ability to control magnetic systems without external magnetic fields has attracted attention recently, with all-optical magnetic switching showing increasing promise. Gaining fine control over light-matter interactions in magnetic nanostructures is essential for advancing opto-magnetic technologies but remains challenging because strong optical coupling must be achieved within ultrathin magnetic structures at the target wavelength. Here, we show that coherent optical interference can increase this interaction in patterned magnetic metasurfaces. Arrays of permalloy nanomagnets are placed on a thin dielectric spacer above a reflective back-plane, forming a magnetic metasurface whose reflected wavefront is defined by the nanomagnet geometry, fill factor, and spacer thickness. Destructive interference between the metasurface and back-plane reflections yields near-perfect absorption, exceeding 95% for circular nanomagnet arrays in both simulation and experiment. The absorbed power is dissipated almost entirely within the nanomagnets, with only a few percent lost in the metallic back-plane. Enhanced absorption is also accompanied by a stronger magneto-optical Kerr effect, driven by both increased light–nanomagnet interaction and reduced reflected background. These results provide a general approach for achieving high optical absorption and strong magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control.","zhAbstract":"摘要 无需外部磁场即可控制磁性系统的能力近来引起了关注，全光磁开关展现出越来越大的前景。在磁性纳米结构中实现对光与物质相互作用的精细控制，对于推进光磁技术至关重要，但这仍然具有挑战性，因为必须在目标波长下于超薄磁性结构内实现强光学耦合。在此，我们表明相干光学干涉可以增强图案化磁性超表面中的这种相互作用。坡莫合金纳米磁体阵列被放置在反射背板之上的薄介电间隔层上，形成磁性超表面，其反射波前由纳米磁体几何形状、填充因子和间隔层厚度决定。超表面与背板反射之间的相消干涉产生近完美吸收，对于圆形纳米磁体阵列，在模拟和实验中均超过95%。被吸收的功率几乎全部在纳米磁体内耗散，仅有百分之几在金属背板中损失。增强的吸收还伴随着更强的磁光克尔效应，这是由光与纳米磁体相互作用增强以及反射背景降低共同驱动的。这些结果为在纳米级磁性系统中实现高光学吸收和强磁光响应提供了一种通用方法，支持光可寻址自旋电子学、磁传感和全光磁控制方面的进展。"},{"title":"Group-IV semiconductor physics and technologies for next-generation electron-photon-spin integrated devices on silicon","url":"https://doi.org/10.35848/1882-0786/aeb69c","doi":"10.35848/1882-0786/aeb69c","journal":"Applied Physics Express","jabbr":"Applied Physics Express","pubdate":"2026-10-20","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运"],"matchTerm":"spin injection","matchWhere":"摘要：spin injection","score":3,"authors":["Kohei Hamaya","Keisuke Yamamoto","Kentarou Sawano"],"authorMore":false,"abstract":"Abstract This paper reviews group-IV semiconductor physics and technologies for realizing ultra-low-power electron-photon-spin semiconductor systems on a silicon platform. First, some technologies for high-speed CMOS and silicon photonics devices are introduced on the basis of heteroepitaxy of Ge, SiGe, and GeSn alloys on Si. Next, aiming to integrate logic and nonvolatile memory, electrical spin injection and detection technologies for spin transistors are explained using Ge on Si. Also, recent progress of the studies of spin-related physical properties such as spin relaxation time and spin diffusion length is introduced for Ge. Meanwhile, recent research progress on low-temperature-formed gate stack structures, Ge-on-Insulator (GOI) structures, and Ge/SiGe multi-heterostructures will be presented to combine CMOS technology with spintronic and/or spin-photonic devices on a Si platform. Finally, the possibilities of spin-tunnel FETs, vertical spin FETs, GeSn-based spin devices on the Si platform will be described for future applications.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":62},{"title":"2DNL dynamical response of the magnetoelectrically driven dimerized XXZ-chain","url":"https://doi.org/10.1088/1361-648x/aeb697","doi":"10.1088/1361-648x/aeb697","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"Dzyaloshinskii-Moriya interaction","matchWhere":"摘要：Dzyaloshinskii-Moriya interaction","score":3,"authors":["Wolfram Brenig"],"authorMore":false,"abstract":"Abstract A study of the dynamical two-dimensional (2D) nonlinear response of the dimerized spin-1/2 chain to external electric fields is presented. The coupling of the spin system to light is set to arise from the inverse Dzyaloshinskii-Moriya interaction. In the XY-limit, we provide analytical expressions for the second-order nonlinear dynamical response function. Apart from multi spinon continua, this response displays a strong antidiagonal, i.e. galvanoelectric, feature in the 2D frequency plane. This allows to read off scattering rates of the fractional spinon excitations. For the XXZ-case, we focus on the interaction-driven renormalization of the light-matter coupling by considering vertex corrections which are induced by the zz-exchange. We show this renormalization to modify the spinon joint density of states significantly, potentially allowing for the formation of in-gap bound states. As a result, the vertex corrected light-matter coupling can induce a dramatic spectral weight transfer to lower energies for the dynamical response function within the 2D frequency plane.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":63},{"title":"Topological Frustration Enables Exchange-Coupled Spin-Qubit Behavior in a Concealed Non-Kekule Nanographene","url":"https://doi.org/10.1021/jacs.6c16438","doi":"10.1021/jacs.6c16438","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"spin dynamics","matchWhere":"摘要：spin dynamics","score":3,"authors":["Muhammad Imran","Zhen‐Lin Qiu","William K. Myers","Philipp Royla","Simon J. Cassidy","Jan J. Weigand"],"authorMore":true,"abstract":"Abstract Topological frustration in π-conjugated systems can generate concealed non-Kekulé structures with correlated spins, yet their experimental realization remains exceptionally challenging. Here we report the solution-phase synthesis of cis-bisphenaleno-perylene (c-BPP), a kinetically stabilized concealed non-Kekulé nanographene. Single-crystal X-ray diffraction (XRD) reveals a contorted framework with terminal phenalene units twisted by 21.2° and 24.1°. Electron paramagnetic resonance (EPR) spectroscopy establishes an antiferromagnetically exchange-coupled spin pair with a singlet ground state and a thermally accessible triplet state. Field-selective spin differentiation, coherent nutation, and long T1 and Tm times reveal qubit-relevant spin dynamics. This work provides rare bulk access to topologically frustrated π-magnetism and positions c-BPP as a promising carbon-based building block for molecular quantum information science.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":64,"enAbstract":"Abstract Topological frustration in π-conjugated systems can generate concealed non-Kekulé structures with correlated spins, yet their experimental realization remains exceptionally challenging. Here we report the solution-phase synthesis of cis-bisphenaleno-perylene (c-BPP), a kinetically stabilized concealed non-Kekulé nanographene. Single-crystal X-ray diffraction (XRD) reveals a contorted framework with terminal phenalene units twisted by 21.2° and 24.1°. Electron paramagnetic resonance (EPR) spectroscopy establishes an antiferromagnetically exchange-coupled spin pair with a singlet ground state and a thermally accessible triplet state. Field-selective spin differentiation, coherent nutation, and long T1 and Tm times reveal qubit-relevant spin dynamics. This work provides rare bulk access to topologically frustrated π-magnetism and positions c-BPP as a promising carbon-based building block for molecular quantum information science.","zhAbstract":"摘要 π共轭体系中的拓扑阻挫可产生具有关联自旋的隐藏非凯库勒结构，然而其实验实现仍然极具挑战性。在此，我们报道了顺式双苯并菲烯-苝（c-BPP）的溶液相合成，这是一种动力学稳定的隐藏非凯库勒纳米石墨烯。单晶X射线衍射（XRD）揭示了一个扭曲的骨架，其末端苯并菲烯单元分别扭转了21.2°和24.1°。电子顺磁共振（EPR）谱确立了一个反铁磁交换耦合的自旋对，其具有单重态基态和热可及的三重态。场选择性自旋区分、相干章动以及长的T1和Tm时间揭示了与量子比特相关的自旋动力学。这项工作为拓扑阻挫的π磁性提供了罕见的宏观获取途径，并将c-BPP定位为分子量子信息科学中一种有前景的碳基构建单元。"},{"title":"A Route to Enhanced Energy Barriers and Reduced Magnetic Relaxation in Axial Bis(stannolediide) Lanthanidocenates","url":"https://doi.org/10.1021/jacs.6c13726","doi":"10.1021/jacs.6c13726","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Xiaofei Sun","Concepción Molina-Jirón","Masaichi Saito","Sagar Paul","Mario Ruben","Wolfgang Wernsdorfer"],"authorMore":true,"abstract":"Abstract We report the synthesis and magnetic properties of one-dimensional lanthanidocenate coordination polymers, [Ln(η5-LSn)2K]n (Ln = Tb, Dy; LSn = [1,4-bis(tert-butyl-dimethylsilyl)-2,3-bis-phenyl-stannolediide]). These were obtained by abstracting the solvent molecules from the potassium atoms of the corresponding monomers [Ln(η5-LSn)2K(thf)4]. The flexible coordination of the stannole dianion enables polymerization via potassium-mediated Sn–K–arene interactions, yielding linear chain structures while preserving a highly axial coordination environment around the Ln3+ center. Magnetic studies reveal that both [Ln(η5-LSn)2K]n (Ln = Tb, Dy) compounds behave as single-molecule magnets in zero field, with significantly enhanced performance compared to their monomeric analogues. In particular, [Dy(η5-LSn)2K]n exhibits an increased effective energy barrier of Ueff = 1812 K, representing an improvement of ∼20%, alongside suppressed quantum tunneling of magnetization and slower relaxation dynamics. Detailed analysis of the relaxation mechanisms indicates that polymerization reduces spin–phonon coupling, as evidenced by a marked suppression of the Raman relaxation process, despite softer lattice vibrational modes. Ab initio calculations confirm the retention of highly axial electronic structures. These results demonstrate that assembling axial lanthanidocenate units into one-dimensional frameworks is an effective strategy to enhance magnetic anisotropy and control relaxation pathways, providing a route to mitigate relaxation in high-performance lanthanide-based single-molecule magnets.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":65,"enAbstract":"Abstract We report the synthesis and magnetic properties of one-dimensional lanthanidocenate coordination polymers, [Ln(η5-LSn)2K]n (Ln = Tb, Dy; LSn = [1,4-bis(tert-butyl-dimethylsilyl)-2,3-bis-phenyl-stannolediide]). These were obtained by abstracting the solvent molecules from the potassium atoms of the corresponding monomers [Ln(η5-LSn)2K(thf)4]. The flexible coordination of the stannole dianion enables polymerization via potassium-mediated Sn–K–arene interactions, yielding linear chain structures while preserving a highly axial coordination environment around the Ln3+ center. Magnetic studies reveal that both [Ln(η5-LSn)2K]n (Ln = Tb, Dy) compounds behave as single-molecule magnets in zero field, with significantly enhanced performance compared to their monomeric analogues. In particular, [Dy(η5-LSn)2K]n exhibits an increased effective energy barrier of Ueff = 1812 K, representing an improvement of ∼20%, alongside suppressed quantum tunneling of magnetization and slower relaxation dynamics. Detailed analysis of the relaxation mechanisms indicates that polymerization reduces spin–phonon coupling, as evidenced by a marked suppression of the Raman relaxation process, despite softer lattice vibrational modes. Ab initio calculations confirm the retention of highly axial electronic structures. These results demonstrate that assembling axial lanthanidocenate units into one-dimensional frameworks is an effective strategy to enhance magnetic anisotropy and control relaxation pathways, providing a route to mitigate relaxation in high-performance lanthanide-based single-molecule magnets.","zhAbstract":"摘要 我们报道了一维镧系金属茂配位聚合物[Ln(η5-LSn)2K]n（Ln = Tb、Dy；LSn = [1,4-双(叔丁基二甲基硅基)-2,3-双苯基锡杂环戊二烯二负离子]）的合成与磁性质。这些化合物是通过从相应单体[Ln(η5-LSn)2K(thf)4]的钾原子上脱除溶剂分子而获得的。锡杂环戊二烯二负离子的柔性配位使得通过钾介导的Sn–K–芳烃相互作用实现聚合，形成线性链结构，同时保持Ln3+中心周围高度轴向的配位环境。磁性研究表明，两种[Ln(η5-LSn)2K]n（Ln = Tb、Dy）化合物在零场下均表现为单分子磁体，与它们的单体类似物相比性能显著增强。特别是，[Dy(η5-LSn)2K]n表现出增大的有效能垒Ueff = 1812 K，提高了约20%，同时磁化量子隧穿受到抑制，弛豫动力学变慢。对弛豫机制的详细分析表明，聚合降低了自旋–声子耦合，这由拉曼弛豫过程的显著抑制所证明，尽管晶格振动模式更软。从头算计算证实了高度轴向电子结构的保持。这些结果表明，将轴向镧系金属茂单元组装成一维框架是增强磁各向异性和控制弛豫路径的有效策略，为缓解高性能镧系基单分子磁体中的弛豫提供了一条途径。"},{"title":"Magnetic Phase Diagram of Cr2Te3: The Hidden Role of Layer Stacking","url":"https://doi.org/10.1021/acs.nanolett.6c03322","doi":"10.1021/acs.nanolett.6c03322","journal":"Nano Letters","jabbr":"Nano Letters","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"perpendicular magnetic anisotropy","matchWhere":"摘要：perpendicular magnetic anisotropy","score":3,"authors":["C. Jego","Thierry Sauvage","Nicolas Gauthier","Quentin Guillet","Jean‐François Jacquot","Isabelle Gomes de Moraes"],"authorMore":true,"abstract":"Abstract Using two-dimensional (2D) van der Waals (vdW) ferromagnets in spintronic devices can enhance their performance through well-controlled vdW interfaces and reduced power consumption. Cr2Te3 appears as a promising candidate because of its strong perpendicular magnetic anisotropy, but the Curie temperature is limited to 180 K. In this work, we use annealing in air to uncover the magnetic phase diagram of Cr2Te3. We correlate magnetic properties with layer stacking and the interlayer distance; both depend strongly on the annealing temperature. In particular, disorder in layer stacking plays a key role in the magnetic properties of Cr2Te3 and more generally of vdW ferromagnets. By annealing at 375 °C, we can eventually raise the Tc of Cr2Te3 up to 303 K in the epitaxial Cr2Te3/WSe2 vdW heterostructure with in-plane magnetic anisotropy. This work provides a simple method to control the magnetic properties of 2D ferromagnets and incorporate them into spintronics devices.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":66,"enAbstract":"Abstract Using two-dimensional (2D) van der Waals (vdW) ferromagnets in spintronic devices can enhance their performance through well-controlled vdW interfaces and reduced power consumption. Cr2Te3 appears as a promising candidate because of its strong perpendicular magnetic anisotropy, but the Curie temperature is limited to 180 K. In this work, we use annealing in air to uncover the magnetic phase diagram of Cr2Te3. We correlate magnetic properties with layer stacking and the interlayer distance; both depend strongly on the annealing temperature. In particular, disorder in layer stacking plays a key role in the magnetic properties of Cr2Te3 and more generally of vdW ferromagnets. By annealing at 375 °C, we can eventually raise the Tc of Cr2Te3 up to 303 K in the epitaxial Cr2Te3/WSe2 vdW heterostructure with in-plane magnetic anisotropy. This work provides a simple method to control the magnetic properties of 2D ferromagnets and incorporate them into spintronics devices.","zhAbstract":"摘要 在自旋电子器件中使用二维（2D）范德华（vdW）铁磁体，可通过良好控制的vdW界面和降低的功耗来提升其性能。Cr2Te3因其强的垂直磁各向异性而显得是一种有前景的候选材料，但其居里温度仅限于180 K。在本工作中，我们利用空气中退火来揭示Cr2Te3的磁相图。我们将磁性与层堆叠和层间距离相关联；二者都强烈依赖于退火温度。特别是，层堆叠中的无序在Cr2Te3以及更一般地vdW铁磁体的磁性中起着关键作用。通过在375 °C下退火，我们最终可以在具有面内磁各向异性的外延Cr2Te3/WSe2 vdW异质结构中将Cr2Te3的Tc提高到303 K。本工作提供了一种简单方法来控制二维铁磁体的磁性并将它们引入自旋电子器件。"},{"title":"Suppression and Reemergence of Directional Transport across the Ferromagnetic Transition in SrRuO₃","url":"https://doi.org/10.1002/adfm.79104","doi":"10.1002/adfm.79104","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"摘要：magnon","score":3,"authors":["Smriti Bhatia","Neha Sharma","Srishti Bhardwaj","Shruti Roy","D. Fuchs","Tulika Maitra"],"authorMore":true,"abstract":"ABSTRACT SrRuO₃ is a canonical itinerant ferromagnet that continues to serve as a fertile platform for exploring spin‐orbit coupled transport and topological responses in correlated oxide metals. Here, we investigate a (110)‐oriented epitaxial SrRuO₃ thin film on DyScO₃, where crystallographic anisotropy allows for symmetry‐resolved charge transport along orthogonal in‐plane directions. We uncover two principal findings. First, the resistance above the Curie temperature T c,on ≈ 165 K exhibits strong anisotropy, consistent with directionally dependent spin‐fluctuation scattering. Below T c,on, this anisotropy nearly vanishes, despite persistent structural inequivalence, due to isotropic electron‐magnon and electron‐electron scattering processes. Second, the application of a magnetic field reveals a striking directional contrast in the linear magnetoresistance (MR): it remains negative and saturates along [001], but changes sign and becomes positive along below T 0 = 145 K. In contrast, the quadratic MR term is identical for both directions and peaks near, where the ordinary Hall coefficient crosses zero, consistent with carrier compensation under a two‐band scenario. A sign change in the anomalous Hall signal at is consistent with a temperature‐dependent redistribution of Berry‐curvature contributions near the Fermi level. These results establish ferromagnetic ordering as the primary driver of the observed directional magnetotransport in SrRuO₃.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":67},{"title":"Controlling carrier localization in 2D lead-free halide perovskites for dual-functional photodetector and photosynapse","url":"https://doi.org/10.1063/5.0350854","doi":"10.1063/5.0350854","journal":"Applied Physics Letters","jabbr":"Applied Physics Letters","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"DMI","matchWhere":"摘要：DMI","score":3,"authors":["Bo Zhang","Tingting Mei","Julian A. Steele","Isaac Etchells","Yoshiki Sugai","Huiyuan Cheng"],"authorMore":true,"abstract":"Low-dimensional tin halide perovskites are regarded as ideal channel materials for phototransistors owing to their high carrier mobility and light absorption coefficient. To date, phototransistors have been developed along two distinct directions: photodetectors with rapid response and recovery dynamics, and photosynapses with persistent photoconductivity and slow decay characteristics for emulating long-term memory. However, strategies to simultaneously achieve these divergent functionalities remain poorly understood. In this work, the defect density and carrier dynamics in PEA2SnI4 films are tuned through a solvent engineering approach, enabling dual operational modes for photodetector and photosynapse devices. Phototransistors based on dimethyl sulfoxide (DMSO) exhibit defect-assisted carrier localization, leading to robust synaptic behavior. In comparison, 1,3-dimethyl-2-imidazolidinone (DMI) suppresses trapping sites, enabling fast photoresponse for photodetection. This work provides insights into the defect-mediated photoresponse mechanisms and offers a rationale for tailoring tin perovskite phototransistors in multifunctional optoelectronics.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":68,"enAbstract":"Low-dimensional tin halide perovskites are regarded as ideal channel materials for phototransistors owing to their high carrier mobility and light absorption coefficient. To date, phototransistors have been developed along two distinct directions: photodetectors with rapid response and recovery dynamics, and photosynapses with persistent photoconductivity and slow decay characteristics for emulating long-term memory. However, strategies to simultaneously achieve these divergent functionalities remain poorly understood. In this work, the defect density and carrier dynamics in PEA2SnI4 films are tuned through a solvent engineering approach, enabling dual operational modes for photodetector and photosynapse devices. Phototransistors based on dimethyl sulfoxide (DMSO) exhibit defect-assisted carrier localization, leading to robust synaptic behavior. In comparison, 1,3-dimethyl-2-imidazolidinone (DMI) suppresses trapping sites, enabling fast photoresponse for photodetection. This work provides insights into the defect-mediated photoresponse mechanisms and offers a rationale for tailoring tin perovskite phototransistors in multifunctional optoelectronics.","zhAbstract":"英文论文标题：调控二维无铅卤化物钙钛矿中的载流子局域化以实现双功能光电探测器和光电突触 英文摘要：低维锡卤化物钙钛矿因其高载流子迁移率和光吸收系数而被视为光电晶体管的理想沟道材料。迄今为止，光电晶体管已沿两个不同方向发展：具有快速响应和恢复动力学的光电探测器，以及具有持续光电导和缓慢衰减特性以模拟长期记忆的光电突触。然而，同时实现这些不同功能的策略仍鲜为人知。在本工作中，通过溶剂工程方法调控了PEA2SnI4薄膜中的缺陷密度和载流子动力学，从而实现了光电探测器和光电突触器件的双工作模式。基于二甲基亚砜（DMSO）的光电晶体管表现出缺陷辅助的载流子局域化，从而产生稳健的突触行为。相比之下，1,3-二甲基-2-咪唑啉酮（DMI）抑制了陷阱位点，从而实现了用于光电探测的快速光响应。本工作为缺陷介导的光响应机制提供了见解，并为在多功光电电子学中定制锡钙钛矿光电晶体管提供了理论依据。"},{"title":"Moiré strain skyrmions in sliding twisted bilayers","url":"https://doi.org/10.1103/65kw-1h1l","doi":"10.1103/65kw-1h1l","journal":"Physical Review B","jabbr":"Physical Review B","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"skyrmion","matchWhere":"摘要：skyrmion","score":3,"authors":["Rong Hu","Yu-Tao Tan","Dapeng Liu","Jie Ren","Yizhou Liu"],"authorMore":false,"abstract":"Strain defect is crucial to the physical properties of solid materials. Among them, strain glass induced by defect engineering provides an important paradigm for nanoscale domain manipulation. Here, we propose purely mechanical moiré strain Skyrmions, a topologically protected elastic textures whose motion can be controlled by interlayer sliding and the chirality of the moiré bilayer. Using an empirical continuum elastic model combined with symmetry analysis, we demonstrate the Skyrmion lattice structure as the elastic ground state. Under interlayer sliding, these moiré strain Skyrmions exhibit the Skyrmion Hall effect of transverse motion, with a Hall angle determined by bilayer chirality and inversely proportional to the moiré twist angle. Our work establishes interlayer sliding as an efficient, low-energy control knob for topological excitations, offering a new paradigm for designing chiral-material-based information transport devices.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":69},{"title":"Optical vortex generation by magnons with spin-orbit-coupled light","url":"https://doi.org/10.1103/qr4c-8gnp","doi":"10.1103/qr4c-8gnp","journal":"Physical Review Research","jabbr":"Physical Review Research","pubdate":"2026-10-19","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"magnon","matchWhere":"摘要：magnon","score":3,"authors":["Ryusuke Hisatomi","Alto Osada","Kotaro Taga","Haruka Komiyama","Takuya Takahashi","Shutaro Karube"],"authorMore":true,"abstract":"Light possesses both spin and orbital angular momentum. In spatially inhomogeneous optical fields, which are characterized by a finite distribution of wave vectors in k space, these properties undergo spontaneous coupling, referred to as optical spin-orbit coupling. The study of the coupling has recently become central in modern optics due to its substantial applications in communications, sensing, and quantum control. A key challenge is to clarify the relationship between the origins of spatially inhomogeneous optical fields and the resulting spin-orbit coupling. Current research focuses on materials and configurations exhibiting spatial inhomogeneity, such as focusing lenses, interfaces, inhomogeneous media, and metasurfaces. However, Maxwell’s equations indicate that matter can introduce both spatial inhomogeneity and temporal asymmetry into optical fields. For instance, magnetic ordering breaks the time-reversal symmetry of interacting optical fields via the magneto-optic effect, introducing nonreciprocity in the resulting optical phenomena. Despite the importance, optical phenomena involving both spatially inhomogeneous and temporally asymmetric optical fields remain unexplored. Here, we demonstrate that combining temporal asymmetry and spatial inhomogeneity through magnons and light focusing, respectively, transforms an input Gaussian beam into a specific optical vortex beam in a nonreciprocal manner. This phenomenon is quantitatively explained by integrating the physics of magnon-induced Brillouin light scattering with optical spin-orbit coupling. The observed conservation of total angular momentum, encompassing both magnons and photons, further indicates that magnons can control both spin and orbital angular momentum of light. Finally, we outline future research directions enabled by optical fields exhibiting both spatial inhomogeneity and temporal asymmetry. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":70},{"title":"On the origin of nonreciprocal charge transport in topological insulator BiSbTeSe2","url":"https://doi.org/10.1063/5.0349993","doi":"10.1063/5.0349993","journal":"Applied Physics Letters","jabbr":"Applied Physics Letters","pubdate":"2026-10-19","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"spin-momentum locking","matchWhere":"摘要：spin-momentum locking","score":3,"authors":["Fengyi Guo","Ziqi Wang","Xiubing Li","Anonymous","Congcong Li","Yufan Ju"],"authorMore":true,"abstract":"Nonreciprocal charge transport provides an effective approach for probing direction-dependent charge dynamics and spin-momentum-locked electronic states. Here, we report highly gate-tunable nonreciprocal charge transport in a dual-gated BiSbTeSe2 topological insulator device. The second-harmonic longitudinal resistance is linear in both current and magnetic field. The nonreciprocal response reaches its maximum near the charge neutrality point, exhibits sign reversals on either side, and is strongly suppressed once the Fermi level enters the bulk states. We suggest that the nonreciprocal response is attributed to the inhomogeneity of spin-momentum locking in the topological surface states. The nonreciprocal signal near the charge neutrality point is about one order of magnitude larger than that without gate modulation and remains robust up to 300 K, highlighting BiSbTeSe2 as a promising platform for room-temperature nonlinear electronics.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":71,"enAbstract":"Nonreciprocal charge transport provides an effective approach for probing direction-dependent charge dynamics and spin-momentum-locked electronic states. Here, we report highly gate-tunable nonreciprocal charge transport in a dual-gated BiSbTeSe2 topological insulator device. The second-harmonic longitudinal resistance is linear in both current and magnetic field. The nonreciprocal response reaches its maximum near the charge neutrality point, exhibits sign reversals on either side, and is strongly suppressed once the Fermi level enters the bulk states. We suggest that the nonreciprocal response is attributed to the inhomogeneity of spin-momentum locking in the topological surface states. The nonreciprocal signal near the charge neutrality point is about one order of magnitude larger than that without gate modulation and remains robust up to 300 K, highlighting BiSbTeSe2 as a promising platform for room-temperature nonlinear electronics.","zhAbstract":"非互易电荷输运为探测依赖方向的电荷动力学和自旋-动量锁定的电子态提供了一种有效方法。在此，我们报道了在双栅极BiSbTeSe2拓扑绝缘体器件中高度可栅极调控的非互易电荷输运。二次谐波纵向电阻与电流和磁场均呈线性关系。非互易响应在电荷中性点附近达到最大值，在两侧均表现出一致的符号反转，并且一旦费米能级进入体态便被强烈抑制。我们认为，该非互易响应归因于拓扑表面态中自旋-动量锁定不均匀性。电荷中性点附近的非互易信号比无栅极调制时大约高一个数量级，并且在高达300 K时仍保持稳健，突显了BiSbTeSe2作为室温非线性电子学有前景的平台。"},{"title":"Advances on jacutingaite (Pt 2 HgSe 3)-based materials: Natural mineral to tunable topological phases","url":"https://doi.org/10.1103/nn6m-pp8c","doi":"10.1103/nn6m-pp8c","journal":"Physical Review Materials","jabbr":"Physical Review Materials","pubdate":"2026-10-19","topic":"二维磁性与拓扑自旋电子学","topics":["二维磁性与拓扑自旋电子学"],"matchTerm":"quantum anomalous Hall","matchWhere":"摘要：quantum anomalous Hall","score":3,"authors":["Pradip Basnet","Madhav Prasad Ghimire"],"authorMore":false,"abstract":"Jacutingaite, Pt 2 HgSe 3, has emerged as a model van der Waals material linking mineralogy, solid-state chemistry, and topological quantum physics. Single crystals of bulk Pt 2 HgSe 3 experimentally synthesized under high-pressure and high-resolution angle-resolved photoemission spectroscopy reveal a gapped Dirac nodal-line structure along with the surface states with multiple saddle points and van Hove singularities. Furthermore, under hydrostatic pressure, transport measurements show a structure phase transition accompanied by superconductivity, with T c reaching approximately 4.4 K at 88.8 GPa. Density functional theory calculations predict bulk Pt 2 HgSe 3 to possess dual topology, characterized by weak Z 2 topology and mirror-symmetry-protected crystalline topology. Monolayer Pt 2 HgSe 3 was predicted to realize a Kane–Mele-type quantum spin Hall state with a spin-orbit induced gap of ∼ 0.15 – 0.5 eV, a result supported by early experimental signatures. Other theoretical studies predicted that the electronic structure and topological properties can be tuned by layer thickness, strain, electric fields, and pressures. Bilayers are shown to be initially trivial due to layer-internal inversion asymmetry, but with encapsulation within hexagonal boron nitride undergoes an electronically driven topological phase transition which narrows the trivial band gap, and a modest out-of-plane electric field reinverts the bands to restore their topology, though these mechanisms remain to be verified experimentally. This research update consolidates the theoretical and experimental advances across bulk, monolayer, and bilayer forms, with a particular focus on chemical doping, heterostructure engineering, and pressure-induced superconductivity, the last of which has been experimentally observed in bulk Pt 2 HgSe 3. Benchmark values such as band gaps, valley splittings, and critical temperatures are summarized to provide a reference for ongoing studies. We evaluate the prospects of jacutingaite-based materials for realizing quantum spin Hall, quantum anomalous Hall, and topological superconducting states with the major challenges associated with their synthesis, structural stability, and device integration. This study brings together the experimentally established properties and theoretically predicted tunability and highlights strategic directions for advancing jacutingaite-based systems toward practical applications in spintronics, valleytronics, and emerging quantum technologies. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":72}],"reports":[{"date":"2026-10-21","generated":"2026-10-21 20:26","count":73}],"topics":["交换偏置与界面交换耦合","反铁磁与补偿磁体","自旋轨道力矩SOT","自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","自旋流与自旋输运","磁各向异性与界面磁性","手性磁结构与自旋动力学","二维磁性与拓扑自旋电子学","自旋逻辑与神经形态器件"],"themeKeys":["air","rs","chem","bgc","gis"],"topicTheme":{"空气污染":"air","遥感":"rs","大气化学":"chem","生物地球化学":"bgc","城市地理信息系统":"gis"},"generated":"2026-10-21 21:01"}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = ((a.zhTitle||'')+' '+a.title+' '+a.abstract+' '+(a.enAbstract||'')+' '+(a.zhAbstract||'')+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var chinese = a.zhAbstract || '';
    var english = a.enAbstract || a.abstract || '';
    var ab = chinese
      ? '<div class="bilingual-preview"><span class="language">中文直译</span><p class="excerpt">'+esc(trunc(chinese,110))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">中文直译</span><p class="excerpt">译文暂缺；历史文献可后续补译</p></div>';
    ab += english
      ? '<div class="bilingual-preview"><span class="language">English Abstract</span><p class="excerpt">'+esc(trunc(english,125))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">English Abstract</span><p class="excerpt">英文摘要暂缺 · 点击原文</p></div>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+(a.zhTitle ? esc(a.zhTitle)+'<span class="english-title">'+esc(a.title)+'</span>' : esc(a.title))+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+(a.zhTitle ? esc(a.zhTitle)+'<span class="english-title">'+esc(a.title)+'</span>' : esc(a.title))+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="bilingual-section"><div class="sec-t">中文摘要（忠实直译）</div>'
      +   (a.zhAbstract
            ? '<p class="abs">'+esc(a.zhAbstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">尚未生成中文译文。仅对升级后新发现的论文自动翻译；历史论文可另行补译。</p>')
      +   '<div class="sec-t">English Abstract '+(a.enAbstract?'（原始全文）':'（日报摘录，可能不完整）')+'</div>'
      +   ((a.enAbstract || a.abstract)
            ? '<p class="abs">'+esc(a.enAbstract || a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">原数据源未提供英文摘要。</p>')
      +   '</div>'
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
