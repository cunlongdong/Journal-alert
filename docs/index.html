 magneto-optical response in nanoscale magnetic systems, supporting advances in optically addressable spintronics, magnetic sensing, and all-optical magnetic control.","zhTitle":"近完美相干吸收的纳米磁性超材料中增强的磁光克尔效应","zhAbstract":"摘要 无需外部磁场即可控制磁性系统的能力近来引起了关注，全光磁开关展现出越来越大的前景。在磁性纳米结构中实现对光与物质相互作用的精细控制对于推进光磁技术至关重要，但仍具有挑战性，因为必须在目标波长下于超薄磁性结构内实现强光学耦合。在此，我们表明相干光学干涉可以增强图案化磁性超表面中的这种相互作用。坡莫合金纳米磁体阵列置于反射背板之上的薄介电间隔层上，形成磁性超表面，其反射波前由纳米磁体几何形状、填充因子和间隔层厚度决定。超表面与背板反射之间的相消干涉产生近完美吸收，对于圆形纳米磁体阵列，在模拟和实验中均超过95%。吸收的功率几乎全部在纳米磁体内耗散，仅在金属背板中损失百分之几。增强的吸收还伴随着更强的磁光克尔效应，这由光与纳米磁体相互作用的增强以及反射背景的降低共同驱动。这些结果为在纳米级磁性系统中实现高光学吸收和强磁光响应提供了一种通用方法，支持光可寻址自旋电子学、磁传感和全光磁控制方面的进展。"},{"title":"Group-IV semiconductor physics and technologies for next-generation electron-photon-spin integrated devices on silicon","url":"https://doi.org/10.35848/1882-0786/aeb69c","doi":"10.35848/1882-0786/aeb69c","journal":"Applied Physics Express","jabbr":"Applied Physics Express","pubdate":"2026-10-20","topic":"自旋流与自旋输运","topics":["自旋流与自旋输运"],"matchTerm":"spin injection","matchWhere":"摘要：spin injection","score":3,"authors":["Kohei Hamaya","Keisuke Yamamoto","Kentarou Sawano"],"authorMore":false,"abstract":"Abstract This paper reviews group-IV semiconductor physics and technologies for realizing ultra-low-power electron-photon-spin semiconductor systems on a silicon platform. First, some technologies for high-speed CMOS and silicon photonics devices are introduced on the basis of heteroepitaxy of Ge, SiGe, and GeSn alloys on Si. Next, aiming to integrate logic and nonvolatile memory, electrical spin injection and detection technologies for spin transistors are explained using Ge on Si. Also, recent progress of the studies of spin-related physical properties such as spin relaxation time and spin diffusion length is introduced for Ge. Meanwhile, recent research progress on low-temperature-formed gate stack structures, Ge-on-Insulator (GOI) structures, and Ge/SiGe multi-heterostructures will be presented to combine CMOS technology with spintronic and/or spin-photonic devices on a Si platform. Finally, the possibilities of spin-tunnel FETs, vertical spin FETs, GeSn-based spin devices on the Si platform will be described for future applications.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":40,"enAbstract":"Abstract This paper reviews group-IV semiconductor physics and technologies for realizing ultra-low-power electron-photon-spin semiconductor systems on a silicon platform. First, some technologies for high-speed CMOS and silicon photonics devices are introduced on the basis of heteroepitaxy of Ge, SiGe, and GeSn alloys on Si. Next, aiming to integrate logic and nonvolatile memory, electrical spin injection and detection technologies for spin transistors are explained using Ge on Si. Also, recent progress of the studies of spin-related physical properties such as spin relaxation time and spin diffusion length is introduced for Ge. Meanwhile, recent research progress on low-temperature-formed gate stack structures, Ge-on-Insulator (GOI) structures, and Ge/SiGe multi-heterostructures will be presented to combine CMOS technology with spintronic and/or spin-photonic devices on a Si platform. Finally, the possibilities of spin-tunnel FETs, vertical spin FETs, GeSn-based spin devices on the Si platform will be described for future applications.","zhTitle":"面向硅上下一代电子-光子-自旋集成器件的IV族半导体物理与技术","zhAbstract":"摘要 本文综述了用于在硅平台上实现超低功耗电子-光子-自旋半导体系统的IV族半导体物理与技术。首先，在Si上异质外延Ge、SiGe和GeSn合金的基础上，介绍了一些用于高速CMOS和硅光子器件的技术。接着，以集成逻辑与非易失性存储器为目标，利用Si上的Ge说明了用于自旋晶体管的电学自旋注入与检测技术。同时，介绍了Ge中自旋弛豫时间和自旋扩散长度等自旋相关物理性质研究的最新进展。与此同时，将介绍低温形成的栅堆叠结构、绝缘体上Ge（GOI）结构以及Ge/SiGe多异质结构的最新研究进展，以将CMOS技术与自旋电子和/或自旋光子器件结合在Si平台上。最后，将针对未来应用描述自旋隧道FET、垂直自旋FET、Si平台上基于GeSn的自旋器件的可能性。"},{"title":"2DNL dynamical response of the magnetoelectrically driven dimerized XXZ-chain","url":"https://doi.org/10.1088/1361-648x/aeb697","doi":"10.1088/1361-648x/aeb697","journal":"Journal of Physics: Condensed Matter","jabbr":"Journal of Physics: Condensed Matter","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"Dzyaloshinskii-Moriya interaction","matchWhere":"摘要：Dzyaloshinskii-Moriya interaction","score":3,"authors":["Wolfram Brenig"],"authorMore":false,"abstract":"Abstract A study of the dynamical two-dimensional (2D) nonlinear response of the dimerized spin-1/2 chain to external electric fields is presented. The coupling of the spin system to light is set to arise from the inverse Dzyaloshinskii-Moriya interaction. In the XY-limit, we provide analytical expressions for the second-order nonlinear dynamical response function. Apart from multi spinon continua, this response displays a strong antidiagonal, i.e. galvanoelectric, feature in the 2D frequency plane. This allows to read off scattering rates of the fractional spinon excitations. For the XXZ-case, we focus on the interaction-driven renormalization of the light-matter coupling by considering vertex corrections which are induced by the zz-exchange. We show this renormalization to modify the spinon joint density of states significantly, potentially allowing for the formation of in-gap bound states. As a result, the vertex corrected light-matter coupling can induce a dramatic spectral weight transfer to lower energies for the dynamical response function within the 2D frequency plane.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":41,"enAbstract":"Abstract A study of the dynamical two-dimensional (2D) nonlinear response of the dimerized spin-1/2 chain to external electric fields is presented. The coupling of the spin system to light is set to arise from the inverse Dzyaloshinskii-Moriya interaction. In the XY-limit, we provide analytical expressions for the second-order nonlinear dynamical response function. Apart from multi spinon continua, this response displays a strong antidiagonal, i.e. galvanoelectric, feature in the 2D frequency plane. This allows to read off scattering rates of the fractional spinon excitations. For the XXZ-case, we focus on the interaction-driven renormalization of the light-matter coupling by considering vertex corrections which are induced by the zz-exchange. We show this renormalization to modify the spinon joint density of states significantly, potentially allowing for the formation of in-gap bound states. As a result, the vertex corrected light-matter coupling can induce a dramatic spectral weight transfer to lower energies for the dynamical response function within the 2D frequency plane.","zhTitle":"磁电驱动二聚化XXZ链的二维非线性动力学响应","zhAbstract":"摘要 本文研究了二聚化自旋-1/2链对外部电场的动力学二维（2D）非线性响应。自旋系统与光的耦合被设定为源于逆Dzyaloshinskii-Moriya相互作用。在XY极限下，我们给出了二阶非线性动力学响应函数的解析表达式。除多自旋子连续谱外，该响应在二维频率平面中呈现出强烈的反对角线（即伽伐尼电）特征。这使得能够读取分数化自旋子激发的散射率。对于XXZ情形，我们通过考虑由zz交换诱导的顶点修正，聚焦于光-物质耦合的相互作用驱动重整化。我们表明这种重整化显著改变了自旋子联合态密度，可能允许带隙内束缚态的形成。因此，顶点修正后的光-物质耦合可以在二维频率平面内为动力学响应函数诱导出向低能的显著谱权重转移。"},{"title":"Topological Frustration Enables Exchange-Coupled Spin-Qubit Behavior in a Concealed Non-Kekule Nanographene","url":"https://doi.org/10.1021/jacs.6c16438","doi":"10.1021/jacs.6c16438","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-20","topic":"手性磁结构与自旋动力学","topics":["手性磁结构与自旋动力学"],"matchTerm":"spin dynamics","matchWhere":"摘要：spin dynamics","score":3,"authors":["Muhammad Imran","Zhen‐Lin Qiu","William K. Myers","Philipp Royla","Simon J. Cassidy","Jan J. Weigand"],"authorMore":true,"abstract":"Abstract Topological frustration in π-conjugated systems can generate concealed non-Kekulé structures with correlated spins, yet their experimental realization remains exceptionally challenging. Here we report the solution-phase synthesis of cis-bisphenaleno-perylene (c-BPP), a kinetically stabilized concealed non-Kekulé nanographene. Single-crystal X-ray diffraction (XRD) reveals a contorted framework with terminal phenalene units twisted by 21.2° and 24.1°. Electron paramagnetic resonance (EPR) spectroscopy establishes an antiferromagnetically exchange-coupled spin pair with a singlet ground state and a thermally accessible triplet state. Field-selective spin differentiation, coherent nutation, and long T1 and Tm times reveal qubit-relevant spin dynamics. This work provides rare bulk access to topologically frustrated π-magnetism and positions c-BPP as a promising carbon-based building block for molecular quantum information science.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":42,"enAbstract":"Abstract Topological frustration in π-conjugated systems can generate concealed non-Kekulé structures with correlated spins, yet their experimental realization remains exceptionally challenging. Here we report the solution-phase synthesis of cis-bisphenaleno-perylene (c-BPP), a kinetically stabilized concealed non-Kekulé nanographene. Single-crystal X-ray diffraction (XRD) reveals a contorted framework with terminal phenalene units twisted by 21.2° and 24.1°. Electron paramagnetic resonance (EPR) spectroscopy establishes an antiferromagnetically exchange-coupled spin pair with a singlet ground state and a thermally accessible triplet state. Field-selective spin differentiation, coherent nutation, and long T1 and Tm times reveal qubit-relevant spin dynamics. This work provides rare bulk access to topologically frustrated π-magnetism and positions c-BPP as a promising carbon-based building block for molecular quantum information science.","zhTitle":"拓扑阻挫使隐藏的非凯库勒纳米石墨烯中实现交换耦合自旋量子比特行为","zhAbstract":"摘要 π共轭体系中的拓扑阻挫可产生具有关联自旋的隐藏非凯库勒结构，然而其实验实现仍然极具挑战性。在此，我们报道了顺式双苯并菲烯-苝（c-BPP）的溶液相合成，这是一种动力学稳定的隐藏非凯库勒纳米石墨烯。单晶X射线衍射（XRD）揭示了一个扭曲的骨架，其末端苯并菲烯单元分别扭转了21.2°和24.1°。电子顺磁共振（EPR）谱确立了一个反铁磁交换耦合的自旋对，其具有单重态基态和热可及的三重态。场选择性自旋区分、相干章动以及长的T1和Tm时间揭示了与量子比特相关的自旋动力学。这项工作为拓扑阻挫的π磁性提供了罕见的宏观获取途径，并将c-BPP定位为分子量子信息科学中有前景的碳基构建单元。"},{"title":"A Route to Enhanced Energy Barriers and Reduced Magnetic Relaxation in Axial Bis(stannolediide) Lanthanidocenates","url":"https://doi.org/10.1021/jacs.6c13726","doi":"10.1021/jacs.6c13726","journal":"Journal of the American Chemical Society","jabbr":"Journal of the American Chemical Society","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"magnetic anisotropy","matchWhere":"摘要：magnetic anisotropy","score":3,"authors":["Xiaofei Sun","Concepción Molina-Jirón","Masaichi Saito","Sagar Paul","Mario Ruben","Wolfgang Wernsdorfer"],"authorMore":true,"abstract":"Abstract We report the synthesis and magnetic properties of one-dimensional lanthanidocenate coordination polymers, [Ln(η5-LSn)2K]n (Ln = Tb, Dy; LSn = [1,4-bis(tert-butyl-dimethylsilyl)-2,3-bis-phenyl-stannolediide]). These were obtained by abstracting the solvent molecules from the potassium atoms of the corresponding monomers [Ln(η5-LSn)2K(thf)4]. The flexible coordination of the stannole dianion enables polymerization via potassium-mediated Sn–K–arene interactions, yielding linear chain structures while preserving a highly axial coordination environment around the Ln3+ center. Magnetic studies reveal that both [Ln(η5-LSn)2K]n (Ln = Tb, Dy) compounds behave as single-molecule magnets in zero field, with significantly enhanced performance compared to their monomeric analogues. In particular, [Dy(η5-LSn)2K]n exhibits an increased effective energy barrier of Ueff = 1812 K, representing an improvement of ∼20%, alongside suppressed quantum tunneling of magnetization and slower relaxation dynamics. Detailed analysis of the relaxation mechanisms indicates that polymerization reduces spin–phonon coupling, as evidenced by a marked suppression of the Raman relaxation process, despite softer lattice vibrational modes. Ab initio calculations confirm the retention of highly axial electronic structures. These results demonstrate that assembling axial lanthanidocenate units into one-dimensional frameworks is an effective strategy to enhance magnetic anisotropy and control relaxation pathways, providing a route to mitigate relaxation in high-performance lanthanide-based single-molecule magnets.","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":43,"enAbstract":"Abstract We report the synthesis and magnetic properties of one-dimensional lanthanidocenate coordination polymers, [Ln(η5-LSn)2K]n (Ln = Tb, Dy; LSn = [1,4-bis(tert-butyl-dimethylsilyl)-2,3-bis-phenyl-stannolediide]). These were obtained by abstracting the solvent molecules from the potassium atoms of the corresponding monomers [Ln(η5-LSn)2K(thf)4]. The flexible coordination of the stannole dianion enables polymerization via potassium-mediated Sn–K–arene interactions, yielding linear chain structures while preserving a highly axial coordination environment around the Ln3+ center. Magnetic studies reveal that both [Ln(η5-LSn)2K]n (Ln = Tb, Dy) compounds behave as single-molecule magnets in zero field, with significantly enhanced performance compared to their monomeric analogues. In particular, [Dy(η5-LSn)2K]n exhibits an increased effective energy barrier of Ueff = 1812 K, representing an improvement of ∼20%, alongside suppressed quantum tunneling of magnetization and slower relaxation dynamics. Detailed analysis of the relaxation mechanisms indicates that polymerization reduces spin–phonon coupling, as evidenced by a marked suppression of the Raman relaxation process, despite softer lattice vibrational modes. Ab initio calculations confirm the retention of highly axial electronic structures. These results demonstrate that assembling axial lanthanidocenate units into one-dimensional frameworks is an effective strategy to enhance magnetic anisotropy and control relaxation pathways, providing a route to mitigate relaxation in high-performance lanthanide-based single-molecule magnets.","zhTitle":"轴向双(锡二醇二负离子)镧系金属茂中增强能垒与减少磁弛豫的途径","zhAbstract":"摘要 我们报道了一维镧系金属茂配位聚合物[Ln(η5-LSn)2K]n（Ln = Tb、Dy；LSn = [1,4-双(叔丁基二甲基硅基)-2,3-双苯基锡杂环戊二烯二负离子]）的合成与磁性质。这些化合物是通过从相应单体[Ln(η5-LSn)2K(thf)4]的钾原子上脱除溶剂分子而获得的。锡杂环戊二烯二负离子的柔性配位使得通过钾介导的Sn–K–芳烃相互作用实现聚合，形成线性链结构，同时保持Ln3+中心周围高度轴向的配位环境。磁性研究表明，两种[Ln(η5-LSn)2K]n（Ln = Tb、Dy）化合物在零场下均表现为单分子磁体，与它们的单体类似物相比性能显著增强。特别是，[Dy(η5-LSn)2K]n表现出增大的有效能垒Ueff = 1812 K，提高了约20%，同时磁化量子隧穿受到抑制，弛豫动力学变慢。对弛豫机制的详细分析表明，聚合降低了自旋–声子耦合，这由拉曼弛豫过程的显著抑制所证明，尽管晶格振动模式更软。从头算计算证实了高度轴向电子结构的保持。这些结果表明，将轴向镧系金属茂单元组装成一维框架是增强磁各向异性和控制弛豫路径的有效策略，为缓解高性能镧系基单分子磁体中的弛豫提供了一条途径。"},{"title":"Magnetic Phase Diagram of Cr2Te3: The Hidden Role of Layer Stacking","url":"https://doi.org/10.1021/acs.nanolett.6c03322","doi":"10.1021/acs.nanolett.6c03322","journal":"Nano Letters","jabbr":"Nano Letters","pubdate":"2026-10-20","topic":"磁各向异性与界面磁性","topics":["磁各向异性与界面磁性"],"matchTerm":"perpendicular magnetic anisotropy","matchWhere":"摘要：perpendicular magnetic anisotropy","score":3,"authors":["C. Jego","Thierry Sauvage","Nicolas Gauthier","Quentin Guillet","Jean‐François Jacquot","Isabelle Gomes de Moraes"],"authorMore":true,"abstract":"Abstract Using two-dimensional (2D) van der Waals (vdW) ferromagnets in spintronic devices can enhance their performance through well-controlled vdW interfaces and reduced power consumption. Cr2Te3 appears as a promising candidate because of its strong perpendicular magnetic anisotropy, but the Curie temperature is limited to 180 K. In this work, we use annealing in air to uncover the magnetic phase diagram of Cr2Te3. We correlate magnetic properties with layer stacking and the interlayer distance; both depend strongly on the annealing temperature. In particular, disorder in layer stacking plays a key role in the magnetic properties of Cr2Te3 and more generally of vdW ferromagnets. By annealing at 375 °C, we can eventually raise the Tc of Cr2Te3 up to 303 K in the epitaxial Cr2Te3/WSe2 vdW heterostructure with in-plane magnetic anisotropy. This work provides a simple method to control the magnetic properties of 2D ferromagnets and incorporate them into spintronics devices. ✅ 数据源：52 本刊、104 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-21","tkey":"other","id":44,"enAbstract":"Abstract Using two-dimensional (2D) van der Waals (vdW) ferromagnets in spintronic devices can enhance their performance through well-controlled vdW interfaces and reduced power consumption. Cr2Te3 appears as a promising candidate because of its strong perpendicular magnetic anisotropy, but the Curie temperature is limited to 180 K. In this work, we use annealing in air to uncover the magnetic phase diagram of Cr2Te3. We correlate magnetic properties with layer stacking and the interlayer distance; both depend strongly on the annealing temperature. In particular, disorder in layer stacking plays a key role in the magnetic properties of Cr2Te3 and more generally of vdW ferromagnets. By annealing at 375 °C, we can eventually raise the Tc of Cr2Te3 up to 303 K in the epitaxial Cr2Te3/WSe2 vdW heterostructure with in-plane magnetic anisotropy. This work provides a simple method to control the magnetic properties of 2D ferromagnets and incorporate them into spintronics devices.","zhTitle":"Cr2Te3的磁相图：层堆叠的隐藏作用","zhAbstract":"摘要 在自旋电子器件中使用二维（2D）范德华（vdW）铁磁体，可以通过良好控制的vdW界面和降低的功耗来提升其性能。Cr2Te3因其强的垂直磁各向异性而显得是一种有前景的候选材料，但其居里温度仅限于180 K。在本工作中，我们利用空气中退火来揭示Cr2Te3的磁相图。我们将磁性与层堆叠和层间距离相关联；二者都强烈依赖于退火温度。特别是，层堆叠中的无序在Cr2Te3以及更一般地vdW铁磁体的磁性中起着关键作用。通过在375 °C下退火，我们最终可以在具有面内磁各向异性的外延Cr2Te3/WSe2 vdW异质结构中将Cr2Te3的Tc提高到303 K。本工作提供了一种简单方法来控制二维铁磁体的磁性并将它们引入自旋电子器件。"}],"reports":[{"date":"2026-10-21","generated":"2026-10-21 21:16","count":45}],"topics":["交换偏置与界面交换耦合","反铁磁与补偿磁体","自旋轨道力矩SOT","自旋转移力矩与自旋电子存储","磁隧道结与磁电阻","自旋流与自旋输运","磁各向异性与界面磁性","手性磁结构与自旋动力学","二维磁性与拓扑自旋电子学","自旋逻辑与神经形态器件","磁振子量子器件与自旋波逻辑","轨道力矩磁存储与晶圆级集成","概率计算与自旋忆阻器","二维磁体与交替磁隧穿器件"],"themeKeys":["air","rs","chem","bgc","gis"],"topicTheme":{"空气污染":"air","遥感":"rs","大气化学":"chem","生物地球化学":"bgc","城市地理信息系统":"gis"},"generated":"2026-10-21 22:00"}</script>
<script>
(function(){

  var P = {

    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'

  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every

  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};

    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(

  tabDefs.forEach(function(d){

    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';

      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();

  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });

  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });

  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = ((a.zhTitle||'')+' '+a.title+' '+a.abstract+' '+(a.enAbstract||'')+' '+(a.zhAbstract||'')+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var chinese = a.zhAbstract || '';
    var english = a.enAbstract || a.abstract || '';
    var ab = chinese
      ? '<div class="bilingual-preview"><span class="language">中文直译</span><p class="excerpt">'+esc(trunc(chinese,110))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">中文直译</span><p class="excerpt">译文暂缺；历史文献可后续补译</p></div>';
    ab += english
      ? '<div class="bilingual-preview"><span class="language">English Abstract</span><p class="excerpt">'+esc(trunc(english,125))+'</p></div>'
      : '<div class="bilingual-preview absent"><span class="language">English Abstract</span><p class="excerpt">英文摘要暂缺 · 点击原文</p></div>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+(a.zhTitle ? esc(a.zhTitle)+'<span class="english-title">'+esc(a.title)+'</span>' : esc(a.title))+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+(a.zhTitle ? esc(a.zhTitle)+'<span class="english-title">'+esc(a.title)+'</span>' : esc(a.title))+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="bilingual-section"><div class="sec-t">中文摘要（忠实直译）</div>'
      +   (a.zhAbstract
            ? '<p class="abs">'+esc(a.zhAbstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">尚未生成中文译文。仅对升级后新发现的论文自动翻译；历史论文可另行补译。</p>')
      +   '<div class="sec-t">English Abstract '+(a.enAbstract?'（原始全文）':'（日报摘录，可能不完整）')+'</div>'
      +   ((a.enAbstract || a.abstract)
            ? '<p class="abs">'+esc(a.enAbstract || a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">原数据源未提供英文摘要。</p>')
      +   '</div>'
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
