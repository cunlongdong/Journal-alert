<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal-alert · 文献重建</title><style>body{font:16px/1.75 system-ui,-apple-system,sans-serif;background:#f5f8fb;color:#28354d;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}main{max-width:640px;padding:32px;border:1px solid #e0e7ef;background:white;border-radius:16px;box-shadow:0 8px 30px #34405412}a{color:#1256bd}</style></head><body><main><h1>Journal-alert · 等待重新生成文献</h1><p>历史文献、摘要翻译缓存、Bark 推送记录已按要求清空。</p><p>每日自动任务设置为北京时间 <strong>08:30</strong>（UTC 00:30）。GitHub Actions 定时触发可能延迟。</p><p>为防止旧论文重新大量推送，Bark 暂处于待验收保护；可先运行 <a href="https://github.com/cunlongdong/Journal-alert/actions/workflows/daily.yml">journal-alert daily</a>，勾选 <strong>no_push</strong> 检查新卡片，再单独使用 <strong>approve_rebuild</strong> 解锁推送。</p></main></body></html>
